name: Sprawdzanie materiałów

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Odnośniki wewnętrzne
        run: python3 tools/check_links.py
      - name: Obrazy, teksty alternatywne i licencje
        run: python3 tools/check_images.py --todo
