name: Linki zewnętrzne

on:
  schedule:
    - cron: "17 5 * * 1"   # poniedziałek, 05:17 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wszystkie linki
        run: python3 tools/check_links.py --external
