name: przepisy
# Raz w miesiącu sprawdza w API Sejmu, czy kluczowe akty prawne się zmieniły (i czy wyszły nowe WT).
# Przy zmianie zakłada zgłoszenie (issue) i zapisuje nowy stan w tools/przepisy-stan.json.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprawdź akty w ELI
        run: python3 tools/sprawdz_przepisy.py --raport zmiany.md
      - name: Załóż zgłoszenie
        if: hashFiles('zmiany.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create przepisy --color F2C300 --description "Zmiany w aktach prawnych" 2>/dev/null || true
          gh issue create --title "Zmiany w przepisach — $(date +%Y-%m)" --label przepisy --body-file zmiany.md
      - name: Zapisz stan
        run: |
          if ! git diff --quiet -- tools/przepisy-stan.json || [ -n "$(git status --porcelain tools/przepisy-stan.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/przepisy-stan.json
            git commit -m "Stan przepisów: $(date +%Y-%m-%d)"
            git push
          else
            echo "Stan bez zmian."
          fi
