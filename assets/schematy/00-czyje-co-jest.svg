<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="t d">
  <title id="t">Od sieci do gniazdka: czyje co jest</title>
  <desc id="d">Łańcuch zasilania: sieć operatora, złącze, zabezpieczenie przedlicznikowe, licznik, przewody do mieszkania, rozdzielnica mieszkaniowa, obwody. Elementy przed licznikiem i sam licznik należą do operatora i są zaplombowane. W budynku wielorodzinnym część przewodów należy do wspólnoty lub spółdzielni. Instalacja właściciela zaczyna się zwykle za licznikiem.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .blok { font-size: 13px; text-anchor: middle; }
    .strefa { font-size: 14px; font-weight: bold; text-anchor: middle; }
    .male { font-size: 12.5px; fill: #444444; }
  </style>
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="430" y="32" class="tytul" text-anchor="middle">Od sieci do gniazdka — czego nie wolno ruszać</text>

  <!-- strefy -->
  <rect x="15" y="55" width="455" height="44" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="242" y="83" class="strefa" fill="#922b21">OPERATOR — plomby, nie otwierać</text>
  <rect x="480" y="55" width="110" height="44" rx="8" fill="#fef5e7" stroke="#d68910" stroke-width="1.5"/>
  <text x="535" y="76" class="strefa" style="font-size:12px">część wspólna*</text>
  <text x="535" y="92" class="strefa" style="font-size:12px">(blok)</text>
  <rect x="600" y="55" width="245" height="44" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
  <text x="722" y="83" class="strefa" fill="#145a32">TWOJA INSTALACJA</text>

  <!-- bloki -->
  <g stroke="#555" stroke-width="1.5" fill="#f6f7f9">
    <rect x="15" y="125" width="100" height="80" rx="8"/>
    <rect x="130" y="125" width="100" height="80" rx="8"/>
    <rect x="245" y="125" width="105" height="80" rx="8"/>
    <rect x="365" y="125" width="105" height="80" rx="8"/>
    <rect x="480" y="125" width="110" height="80" rx="8"/>
    <rect x="600" y="125" width="120" height="80" rx="8"/>
    <rect x="735" y="125" width="110" height="80" rx="8"/>
  </g>
  <text x="65" y="160" class="blok">sieć</text><text x="65" y="178" class="blok">operatora</text>
  <text x="180" y="160" class="blok">złącze</text><text x="180" y="178" class="blok">(skrzynka)</text>
  <text x="297" y="152" class="blok" style="font-size:12px">zabezpieczenie</text><text x="297" y="170" class="blok" style="font-size:12px">przed-</text><text x="297" y="188" class="blok" style="font-size:12px">licznikowe</text>
  <text x="417" y="160" class="blok">licznik</text><text x="417" y="178" class="blok">energii</text>
  <text x="535" y="152" class="blok">przewody</text><text x="535" y="170" class="blok">w pionie</text><text x="535" y="188" class="blok">klatki</text>
  <text x="660" y="160" class="blok">rozdzielnica</text><text x="660" y="178" class="blok">mieszkaniowa</text>
  <text x="790" y="152" class="blok">obwody:</text><text x="790" y="170" class="blok">gniazda,</text><text x="790" y="188" class="blok">oświetlenie</text>

  <!-- strzałki -->
  <g fill="#7a8494">
    <path d="M117 160 L128 165 L117 170 Z"/><path d="M232 160 L243 165 L232 170 Z"/>
    <path d="M352 160 L363 165 L352 170 Z"/><path d="M472 160 L478 165 L472 170 Z"/>
    <path d="M592 160 L598 165 L592 170 Z"/><path d="M722 160 L733 165 L722 170 Z"/>
  </g>

  <!-- plomby -->
  <g>
    <circle cx="180" cy="215" r="7" fill="#c0392b"/><circle cx="297" cy="215" r="7" fill="#c0392b"/><circle cx="417" cy="215" r="7" fill="#c0392b"/>
  </g>
  <circle cx="22" cy="242" r="6" fill="#c0392b"/>
  <text x="34" y="247" class="male">plomba operatora — zerwanie grozi karą i podejrzeniem nielegalnego poboru energii</text>

  <text x="15" y="276" class="male">* W budynku wielorodzinnym część instalacji (rozdzielnica główna budynku, przewody w pionach)</text>
  <text x="15" y="294" class="male">  należy do wspólnoty lub spółdzielni. W domu jednorodzinnym tej strefy zwykle nie ma.</text>
  <text x="15" y="312" class="male">  Dokładną granicę własności określa umowa z operatorem — szczegóły w module 14.</text>
</svg>
