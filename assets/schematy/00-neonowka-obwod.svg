<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d">
  <title id="t">Dlaczego neonówka zależy od człowieka</title>
  <desc id="d">Prąd płynie z przewodu fazowego przez grot wkrętaka, rezystor rzędu megaoma, lampkę neonową, palec na kapturku, ciało człowieka, buty i podłogę do ziemi. Jeśli buty lub podłoga dobrze izolują, prąd jest za mały i lampka nie zaświeci mimo napięcia.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .opis { font-size: 14px; fill: #333333; }
    .male { font-size: 12.5px; fill: #444444; }
    .wazne { font-size: 14px; font-weight: bold; fill: #c0392b; }
  </style>
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="32" class="tytul" text-anchor="middle">Neonówka zamyka obwód przez Twoje ciało</text>

  <!-- przewód L -->
  <line x1="30" y1="90" x2="170" y2="90" stroke="#8b4513" stroke-width="8"/>
  <text x="34" y="76" class="opis">L — 230 V względem ziemi</text>

  <!-- wkrętak: grot, rękojeść z rezystorem i neonem -->
  <polygon points="170,84 230,86 230,94 170,96" fill="#9aa0a6" stroke="#555"/>
  <rect x="230" y="70" width="270" height="40" rx="10" fill="#fdebd0" fill-opacity="0.6" stroke="#555" stroke-width="2"/>
  <!-- rezystor -->
  <rect x="260" y="80" width="80" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="60" class="male" text-anchor="middle">rezystor ~1 MΩ</text>
  <line x1="230" y1="90" x2="260" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="90" x2="380" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <!-- neon -->
  <ellipse cx="410" cy="90" rx="30" ry="14" fill="#f5b041" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="388" y1="90" x2="404" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="416" y1="90" x2="432" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <text x="410" y="130" class="male" text-anchor="middle">lampka neonowa</text>
  <line x1="440" y1="90" x2="490" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="490" y="78" width="16" height="24" fill="#555"/>
  <text x="470" y="60" class="male">metalowy kapturek</text>

  <!-- człowiek -->
  <circle cx="600" cy="110" r="22" fill="#f5cba7" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="132" x2="600" y2="245" stroke="#555" stroke-width="10" stroke-linecap="round"/>
  <line x1="600" y1="150" x2="520" y2="94" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="150" x2="650" y2="200" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="245" x2="575" y2="320" stroke="#555" stroke-width="9" stroke-linecap="round"/>
  <line x1="600" y1="245" x2="625" y2="320" stroke="#555" stroke-width="9" stroke-linecap="round"/>
  <rect x="555" y="318" width="34" height="12" rx="4" fill="#1a1a1a"/>
  <rect x="611" y="318" width="34" height="12" rx="4" fill="#1a1a1a"/>
  <text x="675" y="326" class="male">buty</text>

  <!-- podłoga i ziemia -->
  <rect x="440" y="330" width="360" height="16" fill="#d5b895"/>
  <text x="450" y="365" class="male">podłoga (parkiet, panele, beton, płytki)</text>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="760" y1="346" x2="760" y2="362"/>
    <line x1="744" y1="362" x2="776" y2="362"/>
    <line x1="749" y1="368" x2="771" y2="368"/>
    <line x1="754" y1="374" x2="766" y2="374"/>
  </g>
  <text x="790" y="388" class="male" text-anchor="end">ziemia</text>

  <!-- droga prądu -->
  <path d="M60 100 C 200 160, 420 170, 520 110" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M610 140 C 640 220, 640 300, 610 336" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M605 342 C 680 352, 720 352, 760 350" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="250" y="190" class="wazne">droga prądu: ułamki miliampera</text>

  <!-- wnioski -->
  <rect x="20" y="215" width="400" height="170" rx="10" fill="#fdedec" stroke="#e6b0aa" stroke-width="1.5"/>
  <text x="36" y="243" class="opis" font-weight="bold">Lampka może NIE zaświecić mimo 230 V, gdy:</text>
  <text x="36" y="268" class="opis">• masz buty z grubą gumową podeszwą,</text>
  <text x="36" y="290" class="opis">• stoisz na drabinie albo suchym parkiecie,</text>
  <text x="36" y="312" class="opis">• jest jasno i nie widać słabego świecenia,</text>
  <text x="36" y="334" class="opis">• lampka lub rezystor są uszkodzone.</text>
  <text x="36" y="364" class="wazne">Brak świecenia ≠ brak napięcia.</text>
</svg>
