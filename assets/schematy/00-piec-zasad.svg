<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
  <title id="t">Pięć zasad bezpiecznej pracy przy urządzeniach elektrycznych</title>
  <desc id="d">Pięć kolejnych kroków: wyłącz, zabezpiecz przed ponownym załączeniem, sprawdź brak napięcia, uziem i zewrzyj, osłoń sąsiednie części pod napięciem. Po pracy kroki wykonuje się w odwrotnej kolejności.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 22px; font-weight: bold; }
    .num { font-size: 26px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .nagl { font-size: 17px; font-weight: bold; }
    .opis { font-size: 14px; fill: #333333; }
    .stopka { font-size: 14px; fill: #333333; }
    .box { fill: #f6f7f9; stroke: #b8bec8; stroke-width: 1.5; }
  </style>
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="400" y="36" class="tytul" text-anchor="middle">Pięć zasad bezpiecznej pracy — zawsze w tej kolejności</text>

  <!-- strzałki między krokami -->
  <g stroke="#7a8494" stroke-width="3" fill="#7a8494">
    <line x1="60" y1="118" x2="60" y2="146"/><path d="M52 140 L60 154 L68 140 Z"/>
    <line x1="60" y1="208" x2="60" y2="236"/><path d="M52 230 L60 244 L68 230 Z"/>
    <line x1="60" y1="298" x2="60" y2="326"/><path d="M52 320 L60 334 L68 320 Z"/>
    <line x1="60" y1="388" x2="60" y2="416"/><path d="M52 410 L60 424 L68 410 Z"/>
  </g>

  <!-- 1 -->
  <circle cx="60" cy="90" r="28" fill="#c0392b"/><text x="60" y="99" class="num">1</text>
  <rect x="110" y="58" width="670" height="66" rx="8" class="box"/>
  <text x="128" y="84" class="nagl">WYŁĄCZ</text>
  <text x="128" y="108" class="opis">Odłącz obwód od zasilania na wszystkich biegunach (L i N) i od wszystkich źródeł.</text>

  <!-- 2 -->
  <circle cx="60" cy="180" r="28" fill="#d35400"/><text x="60" y="189" class="num">2</text>
  <rect x="110" y="148" width="670" height="66" rx="8" class="box"/>
  <text x="128" y="172" class="nagl">ZABEZPIECZ PRZED PONOWNYM ZAŁĄCZENIEM</text>
  <text x="128" y="192" class="opis">Blokada lub kłódka na wyłączniku i tablica „Nie załączać”.</text>
  <text x="128" y="209" class="opis">Wkręcane wkładki bezpiecznikowe wykręć i zabierz ze sobą.</text>

  <!-- 3 -->
  <circle cx="60" cy="270" r="28" fill="#b7950b"/><text x="60" y="279" class="num">3</text>
  <rect x="110" y="238" width="670" height="66" rx="8" class="box"/>
  <text x="128" y="262" class="nagl">SPRAWDŹ BRAK NAPIĘCIA</text>
  <text x="128" y="282" class="opis">Wskaźnikiem dwubiegunowym, w miejscu pracy, między wszystkimi przewodami.</text>
  <text x="128" y="299" class="opis">Sam wskaźnik sprawdź na znanym źródle napięcia przed pomiarem i po nim.</text>

  <!-- 4 -->
  <circle cx="60" cy="360" r="28" fill="#1e8449"/><text x="60" y="369" class="num">4</text>
  <rect x="110" y="328" width="670" height="66" rx="8" class="box"/>
  <text x="128" y="352" class="nagl">UZIEM I ZEWRZYJ</text>
  <text x="128" y="372" class="opis">Gdy napięcie może się pojawić (linia napowietrzna, agregat, fotowoltaika, inne źródło).</text>
  <text x="128" y="389" class="opis">W typowej instalacji w budynku, bez innych źródeł, ten krok zwykle się pomija.</text>

  <!-- 5 -->
  <circle cx="60" cy="450" r="28" fill="#1f5fbf"/><text x="60" y="459" class="num">5</text>
  <rect x="110" y="418" width="670" height="66" rx="8" class="box"/>
  <text x="128" y="444" class="nagl">OSŁOŃ SĄSIEDNIE CZĘŚCI POD NAPIĘCIEM</text>
  <text x="128" y="468" class="opis">Zaciski, szyny i obwody, których nie wyłączono, zasłoń osłoną izolacyjną lub odgrodź.</text>

  <rect x="20" y="504" width="760" height="40" rx="8" fill="#fdf2e9" stroke="#e59866" stroke-width="1.5"/>
  <text x="400" y="529" class="stopka" text-anchor="middle">Po pracy — odwrotnie: zdejmij osłony i uziemienia, upewnij się, że nikt nie pracuje, usuń blokadę, załącz.</text>
</svg>
