<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">Analogia wodna: obwód wodny i obwód elektryczny</title>
  <desc id="d">Po lewej obieg wody: pompa wytwarza różnicę ciśnień, woda płynie rurą, przez zwężenie i turbinę wraca do pompy. Po prawej obwód elektryczny: źródło napięcia, przewody, rezystor i żarówka. Pompa odpowiada źródłu napięcia, przepływ wody prądowi, zwężenie oporowi, a turbina odbiornikowi.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 16px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .tab { font-size: 14px; }
    .tabb { font-size: 14px; font-weight: bold; }
  </style>
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="420" y="32" class="tytul" text-anchor="middle">Prąd jak woda w rurach</text>

  <!-- obwód wodny -->
  <text x="205" y="64" class="podt" text-anchor="middle">Obieg wody</text>
  <path d="M90 110 H320 V270 H90 Z" fill="none" stroke="#5dade2" stroke-width="16" stroke-linejoin="round"/>
  <!-- zwężenie -->
  <rect x="180" y="96" width="70" height="28" fill="#ffffff"/>
  <path d="M180 102 L200 106 H230 L250 102 M180 118 L200 114 H230 L250 118" fill="none" stroke="#1b4f72" stroke-width="2"/>
  <rect x="200" y="106" width="30" height="8" fill="#5dade2"/>
  <rect x="180" y="102" width="20" height="16" fill="#5dade2" fill-opacity="0.8"/>
  <rect x="230" y="102" width="20" height="16" fill="#5dade2" fill-opacity="0.8"/>
  <text x="215" y="90" class="opis" text-anchor="middle">zwężenie</text>
  <!-- turbina -->
  <circle cx="320" cy="190" r="26" fill="#ffffff" stroke="#1b4f72" stroke-width="2.5"/>
  <g stroke="#1b4f72" stroke-width="3"><line x1="320" y1="168" x2="320" y2="212"/><line x1="298" y1="190" x2="342" y2="190"/><line x1="305" y1="175" x2="335" y2="205"/><line x1="335" y1="175" x2="305" y2="205"/></g>
  <text x="356" y="194" class="opis">turbina</text>
  <!-- pompa -->
  <circle cx="90" cy="190" r="30" fill="#ffffff" stroke="#1b4f72" stroke-width="2.5"/>
  <path d="M90 210 V172 M80 182 L90 168 L100 182" fill="none" stroke="#1b4f72" stroke-width="3"/>
  <text x="34" y="244" class="opis">pompa</text>
  <!-- strzałki przepływu -->
  <g fill="#1b4f72"><path d="M140 104 L156 110 L140 116 Z"/><path d="M314 240 L320 256 L326 240 Z"/><path d="M220 264 L204 270 L220 276 Z"/></g>
  <text x="205" y="300" class="opis" text-anchor="middle">przepływ wody (litry na sekundę)</text>

  <!-- obwód elektryczny -->
  <text x="625" y="64" class="podt" text-anchor="middle">Obwód elektryczny</text>
  <path d="M510 110 H740 V270 H510 Z" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <!-- rezystor -->
  <rect x="595" y="98" width="60" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="625" y="90" class="opis" text-anchor="middle">opór (rezystor)</text>
  <!-- żarówka -->
  <circle cx="740" cy="190" r="24" fill="#fdebd0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="723" y1="173" x2="757" y2="207" stroke="#1a1a1a" stroke-width="2.5"/><line x1="757" y1="173" x2="723" y2="207" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="772" y="194" class="opis">odbiornik</text>
  <!-- źródło -->
  <rect x="490" y="160" width="40" height="60" fill="#ffffff"/>
  <line x1="490" y1="180" x2="530" y2="180" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="498" y1="200" x2="522" y2="200" stroke="#1a1a1a" stroke-width="6"/>
  <text x="440" y="174" class="opis" text-anchor="middle">źródło</text>
  <text x="440" y="192" class="opis" text-anchor="middle">napięcia</text>
  <g fill="#c0392b"><path d="M560 104 L576 110 L560 116 Z"/><path d="M734 240 L740 256 L746 240 Z"/><path d="M640 264 L624 270 L640 276 Z"/></g>
  <text x="625" y="300" class="opis" text-anchor="middle">prąd (ampery = kulomby na sekundę)</text>

  <!-- tabela -->
  <g>
    <rect x="70" y="325" width="700" height="130" rx="8" fill="#f6f7f9" stroke="#b8bec8" stroke-width="1.5"/>
    <line x1="70" y1="355" x2="770" y2="355" stroke="#b8bec8"/>
    <line x1="420" y1="325" x2="420" y2="455" stroke="#b8bec8"/>
    <text x="245" y="346" class="tabb" text-anchor="middle">Woda</text>
    <text x="595" y="346" class="tabb" text-anchor="middle">Elektryczność</text>
    <text x="90" y="378" class="tab">różnica ciśnień wytwarzana przez pompę</text><text x="440" y="378" class="tab">napięcie U [V, wolt]</text>
    <text x="90" y="402" class="tab">przepływ wody</text><text x="440" y="402" class="tab">prąd I [A, amper]</text>
    <text x="90" y="426" class="tab">wąska, długa, chropowata rura</text><text x="440" y="426" class="tab">opór (rezystancja) R [Ω, om]</text>
    <text x="90" y="450" class="tab">praca turbiny w każdej sekundzie</text><text x="440" y="450" class="tab">moc P [W, wat]</text>
  </g>
</svg>
