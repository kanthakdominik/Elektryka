<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-labelledby="t d">
  <title id="t">Dlaczego luźny zacisk się grzeje</title>
  <desc id="d">Porównanie dwóch zacisków, przez które płynie 16 amperów. Dobrze dokręcony zacisk ma opór styku około 0,001 oma i wydziela około 0,26 wata. Luźny lub utleniony zacisk ma opór styku około 0,05 oma i wydziela około 12,8 wata w punkcie wielkości ziarnka grochu — to wystarczy, żeby stopić izolację i zapalić puszkę.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 16px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .ok { font-size: 18px; font-weight: bold; fill: #1e8449; }
    .zle { font-size: 18px; font-weight: bold; fill: #c0392b; }
  </style>
  <defs>
    <radialGradient id="zar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5733" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5b041" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f9e79f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="32" class="tytul" text-anchor="middle">Ten sam prąd 16 A — zupełnie inne ciepło</text>

  <!-- dobry -->
  <text x="205" y="70" class="podt" text-anchor="middle">Dokręcony, czysty zacisk</text>
  <rect x="120" y="100" width="170" height="110" rx="8" fill="#d5d8dc" stroke="#555" stroke-width="2"/>
  <rect x="150" y="80" width="110" height="26" rx="4" fill="#aab7b8" stroke="#555" stroke-width="2"/>
  <line x1="170" y1="93" x2="240" y2="93" stroke="#555" stroke-width="3"/>
  <line x1="40" y1="155" x2="250" y2="155" stroke="#b9770e" stroke-width="16" stroke-linecap="round"/>
  <rect x="150" y="146" width="100" height="10" fill="#555"/>
  <text x="205" y="245" class="opis" text-anchor="middle">opór styku ≈ 0,001 Ω</text>
  <text x="205" y="275" class="ok" text-anchor="middle">P = 16² · 0,001 ≈ 0,26 W</text>
  <text x="205" y="300" class="opis" text-anchor="middle">ledwie ciepły</text>

  <!-- zły -->
  <text x="615" y="70" class="podt" text-anchor="middle">Luźny lub utleniony zacisk</text>
  <circle cx="620" cy="150" r="70" fill="url(#zar)"/>
  <rect x="530" y="100" width="170" height="110" rx="8" fill="#d5d8dc" stroke="#555" stroke-width="2" fill-opacity="0.85"/>
  <rect x="560" y="80" width="110" height="26" rx="4" fill="#aab7b8" stroke="#555" stroke-width="2"/>
  <line x1="580" y1="93" x2="650" y2="93" stroke="#555" stroke-width="3"/>
  <line x1="450" y1="160" x2="660" y2="160" stroke="#b9770e" stroke-width="16" stroke-linecap="round"/>
  <rect x="560" y="132" width="100" height="10" fill="#555"/>
  <circle cx="620" cy="152" r="8" fill="#ff5733"/>
  <text x="615" y="245" class="opis" text-anchor="middle">opór styku ≈ 0,05 Ω</text>
  <text x="615" y="275" class="zle" text-anchor="middle">P = 16² · 0,05 ≈ 12,8 W</text>
  <text x="615" y="300" class="opis" text-anchor="middle">jak lutownica — w punkcie wielkości ziarnka grochu</text>

  <text x="410" y="340" class="opis" text-anchor="middle">Ciepło rośnie z kwadratem prądu (P = I² · R): dwa razy większy prąd to cztery razy więcej ciepła.</text>
</svg>
