<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t d">
  <title id="t">Typowe moce urządzeń domowych</title>
  <desc id="d">Wykres słupkowy typowych mocy znamionowych: płyta indukcyjna ok. 7200 W, piekarnik 3000 W, żelazko 2400 W, czajnik 2000 W, suszarka do włosów 2000 W, pralka podczas grzania wody 2000 W, mikrofalówka 1200 W, odkurzacz 800 W, telewizor 100 W, lodówka w czasie pracy sprężarki 100 W, laptop 60 W, ładowarka telefonu 20 W, żarówka LED 8 W. Wartości są przykładowe — prawdziwą moc podaje tabliczka znamionowa.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .et { font-size: 13.5px; text-anchor: end; }
    .w { font-size: 13px; fill: #333333; }
    .opis { font-size: 12.5px; fill: #444444; }
    .s { fill: #e67e22; }
    .sl { fill: #5dade2; }
  </style>
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="410" y="32" class="tytul" text-anchor="middle">Ile watów bierze typowy sprzęt (wartości przykładowe)</text>
  <!-- skala: 7200 W = 520 px, start x = 220 -->
  <g stroke="#e5e8e8" stroke-width="1">
    <line x1="220" y1="50" x2="220" y2="455"/><line x1="364.4" y1="50" x2="364.4" y2="455"/>
    <line x1="508.9" y1="50" x2="508.9" y2="455"/><line x1="653.3" y1="50" x2="653.3" y2="455"/>
  </g>
  <text x="220" y="472" class="w" text-anchor="middle">0</text>
  <text x="364.4" y="472" class="w" text-anchor="middle">2000 W</text>
  <text x="508.9" y="472" class="w" text-anchor="middle">4000 W</text>
  <text x="653.3" y="472" class="w" text-anchor="middle">6000 W</text>

  <text x="210" y="73" class="et">płyta indukcyjna</text><rect x="220" y="60" width="520" height="20" class="s"/><text x="746" y="75" class="w">7200 W</text>
  <text x="210" y="103" class="et">piekarnik</text><rect x="220" y="90" width="216.7" height="20" class="s"/><text x="442" y="105" class="w">3000 W</text>
  <text x="210" y="133" class="et">żelazko</text><rect x="220" y="120" width="173.3" height="20" class="s"/><text x="399" y="135" class="w">2400 W</text>
  <text x="210" y="163" class="et">czajnik</text><rect x="220" y="150" width="144.4" height="20" class="s"/><text x="370" y="165" class="w">2000 W</text>
  <text x="210" y="193" class="et">suszarka do włosów</text><rect x="220" y="180" width="144.4" height="20" class="s"/><text x="370" y="195" class="w">2000 W</text>
  <text x="210" y="223" class="et">pralka (grzanie wody)</text><rect x="220" y="210" width="144.4" height="20" class="s"/><text x="370" y="225" class="w">2000 W</text>
  <text x="210" y="253" class="et">mikrofalówka</text><rect x="220" y="240" width="86.7" height="20" class="s"/><text x="313" y="255" class="w">1200 W</text>
  <text x="210" y="283" class="et">odkurzacz</text><rect x="220" y="270" width="57.8" height="20" class="s"/><text x="284" y="285" class="w">800 W</text>
  <text x="210" y="313" class="et">telewizor</text><rect x="220" y="300" width="7.2" height="20" class="sl"/><text x="234" y="315" class="w">100 W</text>
  <text x="210" y="343" class="et">lodówka (sprężarka)</text><rect x="220" y="330" width="7.2" height="20" class="sl"/><text x="234" y="345" class="w">100 W</text>
  <text x="210" y="373" class="et">laptop</text><rect x="220" y="360" width="4.3" height="20" class="sl"/><text x="231" y="375" class="w">60 W</text>
  <text x="210" y="403" class="et">ładowarka telefonu</text><rect x="220" y="390" width="2" height="20" class="sl"/><text x="229" y="405" class="w">20 W</text>
  <text x="210" y="433" class="et">żarówka LED</text><rect x="220" y="420" width="2" height="20" class="sl"/><text x="229" y="435" class="w">8 W</text>

  <text x="20" y="498" class="opis">Pomarańczowe: urządzenia, które grzeją — to one przeciążają obwody. Niebieskie: elektronika i oświetlenie.</text>
  <text x="20" y="515" class="opis">Prawdziwą moc swojego urządzenia odczytasz z tabliczki znamionowej.</text>
</svg>
