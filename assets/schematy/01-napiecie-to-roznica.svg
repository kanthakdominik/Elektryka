<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="t d">
  <title id="t">Napięcie to różnica potencjałów między dwoma punktami</title>
  <desc id="d">Po lewej gniazdo z przewodami L, N i PE oraz napięciami między nimi: między L a N i między L a PE około 230 V, między N a PE prawie zero. Po prawej ptak siedzący na jednym przewodzie — obie nóżki mają ten sam potencjał, więc napięcie między nimi jest zerowe. Obok człowiek, który stoi na ziemi i dotyka przewodu L — między dłonią a stopami jest około 230 V.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .etyk { font-size: 15px; font-weight: bold; }
    .wazne { font-size: 13.5px; font-weight: bold; fill: #c0392b; }
    .ok { font-size: 13.5px; font-weight: bold; fill: #1e8449; }
  </style>
  <rect width="840" height="420" fill="#ffffff"/>
  <text x="420" y="32" class="tytul" text-anchor="middle">Napięcie mierzy się zawsze między dwoma punktami</text>

  <!-- gniazdo -->
  <text x="150" y="66" class="podt" text-anchor="middle">W gniazdku</text>
  <rect x="70" y="85" width="160" height="160" rx="18" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <circle cx="150" cy="165" r="56" fill="#eceff3" stroke="#555" stroke-width="2"/>
  <circle cx="124" cy="170" r="8" fill="#333"/><circle cx="176" cy="170" r="8" fill="#333"/>
  <rect x="144" y="114" width="12" height="24" rx="3" fill="#2e8b57"/>
  <text x="112" y="206" class="etyk" text-anchor="middle">L</text>
  <text x="188" y="206" class="etyk" text-anchor="middle">N</text>
  <text x="150" y="106" class="etyk" text-anchor="middle" style="font-size:12px">PE</text>
  <text x="70" y="270" class="opis">Strona L i N bywa zamieniona —</text>
  <text x="70" y="288" class="opis">to, gdzie jest faza, zależy</text>
  <text x="70" y="306" class="opis">od podłączenia gniazda.</text>
  <rect x="250" y="100" width="180" height="120" rx="8" fill="#f6f7f9" stroke="#b8bec8"/>
  <text x="266" y="130" class="opis">L – N:  ok. 230 V</text>
  <text x="266" y="160" class="opis">L – PE: ok. 230 V</text>
  <text x="266" y="190" class="opis">N – PE: ok. 0 V</text>
  <text x="266" y="208" class="opis" style="font-size:11.5px">(w praktyce 0–kilka V)</text>

  <!-- ptak -->
  <text x="625" y="66" class="podt" text-anchor="middle">Ptak i człowiek przy tym samym przewodzie</text>
  <line x1="470" y1="120" x2="820" y2="120" stroke="#8b4513" stroke-width="7"/>
  <text x="600" y="108" class="opis">przewód L, 230 V względem ziemi</text>
  <ellipse cx="520" cy="96" rx="22" ry="14" fill="#5d6d7e"/>
  <circle cx="540" cy="86" r="9" fill="#5d6d7e"/>
  <path d="M548 86 L558 89 L548 92 Z" fill="#d68910"/>
  <line x1="512" y1="108" x2="510" y2="118" stroke="#5d6d7e" stroke-width="3"/>
  <line x1="526" y1="108" x2="528" y2="118" stroke="#5d6d7e" stroke-width="3"/>
  <text x="540" y="150" class="ok" text-anchor="middle">między nóżkami 0 V</text>
  <text x="540" y="168" class="opis" text-anchor="middle">prąd nie płynie przez ptaka</text>

  <!-- człowiek -->
  <circle cx="730" cy="190" r="16" fill="#f5cba7" stroke="#555" stroke-width="2"/>
  <line x1="730" y1="206" x2="730" y2="290" stroke="#555" stroke-width="9" stroke-linecap="round"/>
  <line x1="730" y1="220" x2="712" y2="124" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <line x1="730" y1="220" x2="760" y2="262" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <line x1="730" y1="290" x2="712" y2="350" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <line x1="730" y1="290" x2="748" y2="350" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <rect x="640" y="352" width="190" height="12" fill="#a9cce3"/>
  <g stroke="#1a1a1a" stroke-width="2"><line x1="800" y1="364" x2="800" y2="378"/><line x1="786" y1="378" x2="814" y2="378"/><line x1="791" y1="384" x2="809" y2="384"/></g>
  <text x="640" y="392" class="opis">ziemia, 0 V</text>
  <text x="560" y="230" class="wazne" text-anchor="middle">między dłonią a stopami</text>
  <text x="560" y="248" class="wazne" text-anchor="middle">ok. 230 V</text>
  <text x="560" y="266" class="opis" text-anchor="middle">prąd płynie przez ciało</text>
</svg>
