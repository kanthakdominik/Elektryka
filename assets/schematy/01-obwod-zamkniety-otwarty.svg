<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d">
  <title id="t">Obwód zamknięty i otwarty</title>
  <desc id="d">Po lewej obwód zamknięty: łącznik jest zamknięty, prąd płynie przez źródło, przewody i żarówkę, żarówka świeci. Po prawej obwód otwarty: łącznik jest otwarty, prąd nie płynie, żarówka nie świeci, chociaż napięcie źródła nadal jest na przewodzie przed łącznikiem.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 16px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .wazne { font-size: 13.5px; font-weight: bold; fill: #c0392b; }
  </style>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="400" y="32" class="tytul" text-anchor="middle">Prąd płynie tylko w zamkniętej pętli</text>

  <!-- zamknięty -->
  <text x="200" y="66" class="podt" text-anchor="middle">Obwód zamknięty</text>
  <path d="M70 100 H160 M200 100 H330 V240 H70 V100" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- łącznik zamknięty -->
  <circle cx="160" cy="100" r="4" fill="#1a1a1a"/><circle cx="200" cy="100" r="4" fill="#1a1a1a"/>
  <line x1="160" y1="100" x2="200" y2="100" stroke="#1a1a1a" stroke-width="3"/>
  <text x="180" y="88" class="opis" text-anchor="middle">łącznik</text>
  <!-- źródło -->
  <rect x="50" y="145" width="40" height="50" fill="#ffffff"/>
  <line x1="50" y1="160" x2="90" y2="160" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="58" y1="178" x2="82" y2="178" stroke="#1a1a1a" stroke-width="6"/>
  <!-- żarówka świecąca -->
  <circle cx="330" cy="170" r="30" fill="#fff3b0"/>
  <circle cx="330" cy="170" r="22" fill="#f9e79f" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="314" y1="154" x2="346" y2="186" stroke="#1a1a1a" stroke-width="2.5"/><line x1="346" y1="154" x2="314" y2="186" stroke="#1a1a1a" stroke-width="2.5"/>
  <g fill="#c0392b"><path d="M250 94 L266 100 L250 106 Z"/><path d="M200 234 L184 240 L200 246 Z"/><path d="M64 130 L70 114 L76 130 Z"/></g>
  <text x="200" y="275" class="opis" text-anchor="middle">płynie prąd — żarówka świeci</text>

  <!-- otwarty -->
  <text x="600" y="66" class="podt" text-anchor="middle">Obwód otwarty</text>
  <path d="M470 100 H560 M600 100 H730 V240 H470 V100" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="560" cy="100" r="4" fill="#1a1a1a"/><circle cx="600" cy="100" r="4" fill="#1a1a1a"/>
  <line x1="560" y1="100" x2="596" y2="76" stroke="#1a1a1a" stroke-width="3"/>
  <text x="580" y="124" class="opis" text-anchor="middle">otwarty</text>
  <rect x="450" y="145" width="40" height="50" fill="#ffffff"/>
  <line x1="450" y1="160" x2="490" y2="160" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="458" y1="178" x2="482" y2="178" stroke="#1a1a1a" stroke-width="6"/>
  <circle cx="730" cy="170" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="714" y1="154" x2="746" y2="186" stroke="#1a1a1a" stroke-width="2.5"/><line x1="746" y1="154" x2="714" y2="186" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="600" y="275" class="opis" text-anchor="middle">prąd nie płynie — żarówka nie świeci</text>
  <text x="590" y="298" class="wazne" text-anchor="middle" style="font-size:12.5px">przewód przed łącznikiem — nadal pod napięciem!</text>
</svg>
