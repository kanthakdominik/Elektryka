<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t d">
  <title id="t">Spadek napięcia na długim przewodzie</title>
  <desc id="d">Obwód: źródło 230 V, przewód L i przewód N o długości 20 metrów i przekroju 1,5 milimetra kwadratowego, na końcu odbiornik pobierający 16 amperów. Każda żyła ma opór około 0,23 oma, więc na każdej traci się około 3,7 wolta. Na odbiorniku zostaje około 222,5 wolta, czyli spadek napięcia wynosi około 3,2 procent.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .wart { font-size: 14px; font-weight: bold; fill: #c0392b; }
    .duze { font-size: 16px; font-weight: bold; }
  </style>
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="32" class="tytul" text-anchor="middle">Część napięcia „zostaje” w przewodach</text>

  <!-- źródło -->
  <rect x="40" y="90" width="110" height="140" rx="10" fill="#f6f7f9" stroke="#555" stroke-width="2"/>
  <text x="95" y="150" class="duze" text-anchor="middle">230 V</text>
  <text x="95" y="172" class="opis" text-anchor="middle">rozdzielnica</text>

  <!-- przewody -->
  <line x1="150" y1="110" x2="680" y2="110" stroke="#8b4513" stroke-width="6"/>
  <line x1="150" y1="210" x2="680" y2="210" stroke="#1f5fbf" stroke-width="6"/>
  <text x="160" y="100" class="opis">L</text><text x="160" y="232" class="opis">N</text>
  <!-- rezystancje żył -->
  <rect x="360" y="98" width="90" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="360" y="198" width="90" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="405" y="86" class="opis" text-anchor="middle">opór żyły L ≈ 0,23 Ω</text>
  <text x="405" y="248" class="opis" text-anchor="middle">opór żyły N ≈ 0,23 Ω</text>
  <text x="405" y="150" class="wart" text-anchor="middle">−3,7 V</text>
  <text x="405" y="182" class="wart" text-anchor="middle">−3,7 V</text>
  <text x="405" y="166" class="opis" text-anchor="middle" style="font-size:12px">20 m, 1,5 mm², 16 A</text>

  <!-- odbiornik -->
  <rect x="680" y="90" width="120" height="140" rx="10" fill="#fdebd0" stroke="#555" stroke-width="2"/>
  <text x="740" y="146" class="duze" text-anchor="middle">222,5 V</text>
  <text x="740" y="168" class="opis" text-anchor="middle">na odbiorniku</text>
  <text x="740" y="188" class="opis" text-anchor="middle">16 A</text>

  <!-- pasek napięcia -->
  <text x="40" y="292" class="opis">Gdzie „podziało się” 230 V:</text>
  <rect x="40" y="302" width="760" height="34" fill="#d5f5e3" stroke="#1e8449"/>
  <rect x="40" y="302" width="12.3" height="34" fill="#f5b7b1" stroke="#c0392b"/>
  <rect x="787.7" y="302" width="12.3" height="34" fill="#f5b7b1" stroke="#c0392b"/>
  <text x="420" y="324" class="opis" text-anchor="middle">222,5 V — pracuje odbiornik</text>
  <text x="40" y="358" class="wart">3,7 V w żyle L</text>
  <text x="800" y="358" class="wart" text-anchor="end">3,7 V w żyle N</text>
  <text x="420" y="384" class="opis" text-anchor="middle">Spadek napięcia: 7,5 V z 230 V ≈ 3,2 %. Przewód o przekroju 2,5 mm² dałby ≈ 1,9 %.</text>
</svg>
