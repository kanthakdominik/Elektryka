<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t d">
  <title id="t">Połączenie szeregowe i równoległe</title>
  <desc id="d">Po lewej trzy żarówki połączone szeregowo: przez wszystkie płynie ten sam prąd, napięcie 230 V dzieli się między nie, a przerwanie jednej gasi wszystkie. Po prawej trzy odbiorniki połączone równolegle: każdy ma pełne 230 V, prądy się sumują, a wyłączenie jednego nie wpływa na pozostałe. Tak są połączone gniazda i lampy w domu.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 16px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .wart { font-size: 13px; font-weight: bold; fill: #1f5fbf; }
    .prad { font-size: 13px; font-weight: bold; fill: #c0392b; }
  </style>
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="32" class="tytul" text-anchor="middle">Szeregowo czy równolegle?</text>

  <!-- szeregowo -->
  <text x="205" y="66" class="podt" text-anchor="middle">Szeregowo — jeden za drugim</text>
  <path d="M60 110 H350 V250 H60 Z" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="40" y="160" width="40" height="44" fill="#ffffff"/>
  <line x1="40" y1="172" x2="80" y2="172" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="48" y1="190" x2="72" y2="190" stroke="#1a1a1a" stroke-width="6"/>
  <text x="92" y="186" class="opis">230 V</text>
  <g>
    <circle cx="140" cy="110" r="18" fill="#fdebd0" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="205" cy="110" r="18" fill="#fdebd0" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="270" cy="110" r="18" fill="#fdebd0" stroke="#1a1a1a" stroke-width="3"/>
    <g stroke="#1a1a1a" stroke-width="2">
      <line x1="128" y1="98" x2="152" y2="122"/><line x1="152" y1="98" x2="128" y2="122"/>
      <line x1="193" y1="98" x2="217" y2="122"/><line x1="217" y1="98" x2="193" y2="122"/>
      <line x1="258" y1="98" x2="282" y2="122"/><line x1="282" y1="98" x2="258" y2="122"/>
    </g>
  </g>
  <text x="140" y="148" class="wart" text-anchor="middle">~77 V</text>
  <text x="205" y="148" class="wart" text-anchor="middle">~77 V</text>
  <text x="270" y="148" class="wart" text-anchor="middle">~77 V</text>
  <g fill="#c0392b"><path d="M310 104 L326 110 L310 116 Z"/></g>
  <text x="205" y="240" class="prad" text-anchor="middle">wszędzie ten sam prąd I</text>
  <text x="60" y="286" class="opis">• napięcia się dzielą: U = U₁ + U₂ + U₃</text>
  <text x="60" y="308" class="opis">• opory się dodają: R = R₁ + R₂ + R₃</text>
  <text x="60" y="330" class="opis">• przerwa w jednym miejscu gasi wszystko</text>
  <text x="60" y="352" class="opis">• przykład: stare lampki choinkowe</text>

  <!-- równolegle -->
  <text x="625" y="66" class="podt" text-anchor="middle">Równolegle — obok siebie</text>
  <line x1="470" y1="100" x2="800" y2="100" stroke="#8b4513" stroke-width="4"/>
  <line x1="470" y1="250" x2="800" y2="250" stroke="#1f5fbf" stroke-width="4"/>
  <text x="808" y="105" class="opis">L</text><text x="808" y="255" class="opis">N</text>
  <rect x="450" y="152" width="40" height="44" fill="#ffffff"/>
  <line x1="470" y1="100" x2="470" y2="164" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="470" y1="186" x2="470" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="450" y1="164" x2="490" y2="164" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="458" y1="182" x2="482" y2="182" stroke="#1a1a1a" stroke-width="6"/>
  <text x="420" y="178" class="opis">230 V</text>
  <g stroke="#1a1a1a" stroke-width="3">
    <line x1="580" y1="100" x2="580" y2="150"/><line x1="580" y1="200" x2="580" y2="250"/>
    <line x1="660" y1="100" x2="660" y2="150"/><line x1="660" y1="200" x2="660" y2="250"/>
    <line x1="740" y1="100" x2="740" y2="150"/><line x1="740" y1="200" x2="740" y2="250"/>
  </g>
  <rect x="555" y="150" width="50" height="50" rx="6" fill="#fdebd0" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="635" y="150" width="50" height="50" rx="6" fill="#fdebd0" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="715" y="150" width="50" height="50" rx="6" fill="#fdebd0" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="580" y="180" class="opis" text-anchor="middle" style="font-size:11.5px">czajnik</text>
  <text x="660" y="180" class="opis" text-anchor="middle" style="font-size:11.5px">lampa</text>
  <text x="740" y="180" class="opis" text-anchor="middle" style="font-size:11.5px">TV</text>
  <text x="595" y="128" class="prad">I₁</text><text x="675" y="128" class="prad">I₂</text><text x="755" y="128" class="prad">I₃</text>
  <text x="520" y="92" class="prad">I = I₁ + I₂ + I₃</text>
  <text x="470" y="286" class="opis">• każdy odbiornik ma pełne 230 V</text>
  <text x="470" y="308" class="opis">• prądy się sumują — w przewodzie przed</text>
  <text x="470" y="326" class="opis">   gniazdami płynie suma wszystkich prądów</text>
  <text x="470" y="348" class="opis">• wyłączenie jednego nie gasi pozostałych</text>
  <text x="470" y="370" class="opis">• tak są połączone gniazda i lampy w domu</text>
</svg>
