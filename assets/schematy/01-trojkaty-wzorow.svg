<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">Trójkąty do zapamiętania prawa Ohma i wzoru na moc</title>
  <desc id="d">Lewy trójkąt: U na górze, I i R na dole — U równa się I razy R, I równa się U przez R, R równa się U przez I. Prawy trójkąt: P na górze, U i I na dole — P równa się U razy I, I równa się P przez U, U równa się P przez I. Zakryj wielkość, której szukasz, a reszta pokaże wzór.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .lit { font-size: 40px; font-weight: bold; text-anchor: middle; }
    .wz { font-size: 16px; }
    .opis { font-size: 13.5px; fill: #333333; }
  </style>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="32" class="tytul" text-anchor="middle">Zakryj szukaną wielkość — zostaje wzór</text>

  <!-- Ohm -->
  <path d="M190 60 L330 250 L50 250 Z" fill="#eaf2f8" stroke="#1f5fbf" stroke-width="3" stroke-linejoin="round"/>
  <line x1="98" y1="175" x2="282" y2="175" stroke="#1f5fbf" stroke-width="3"/>
  <line x1="190" y1="175" x2="190" y2="250" stroke="#1f5fbf" stroke-width="3"/>
  <text x="190" y="155" class="lit" fill="#1f5fbf">U</text>
  <text x="145" y="232" class="lit">I</text>
  <text x="235" y="232" class="lit">R</text>
  <text x="100" y="280" class="wz" text-anchor="middle">U = I · R</text><text x="190" y="280" class="wz" text-anchor="middle">I = U / R</text><text x="280" y="280" class="wz" text-anchor="middle">R = U / I</text>
  <text x="190" y="304" class="opis" text-anchor="middle">napięcie [V] · prąd [A] · opór [Ω]</text>

  <!-- Moc -->
  <path d="M570 60 L710 250 L430 250 Z" fill="#fef5e7" stroke="#d68910" stroke-width="3" stroke-linejoin="round"/>
  <line x1="478" y1="175" x2="662" y2="175" stroke="#d68910" stroke-width="3"/>
  <line x1="570" y1="175" x2="570" y2="250" stroke="#d68910" stroke-width="3"/>
  <text x="570" y="155" class="lit" fill="#b9770e">P</text>
  <text x="525" y="232" class="lit">U</text>
  <text x="615" y="232" class="lit">I</text>
  <text x="480" y="280" class="wz" text-anchor="middle">P = U · I</text><text x="570" y="280" class="wz" text-anchor="middle">I = P / U</text><text x="660" y="280" class="wz" text-anchor="middle">U = P / I</text>
  <text x="570" y="304" class="opis" text-anchor="middle">moc [W] · napięcie [V] · prąd [A]</text>
</svg>
