  <line x1="70" y1="330" x2="110" y2="330" stroke="#8b4513" stroke-width="2" stroke-dasharray="6 5"/><text x="118" y="335" class="opis">napięcie</text>
  <line x1="220" y1="330" x2="260" y2="330" stroke="#c0392b" stroke-width="3"/><text x="268" y="335" class="opis">prąd</text>
  <text x="60" y="370" class="opis">Po lewej prąd ma kształt napięcia. Po prawej płynie krótkimi impulsami tylko przy szczycie napięcia,</text>
  <text x="60" y="390" class="opis">gdy zasilacz ładuje kondensator. To suma sinusoidy 50 Hz i harmonicznych 150, 250, 350 Hz…</text>
  <text x="60" y="418" class="opis" style="fill:#c0392b;font-weight:bold">3. harmoniczna (150 Hz) z trzech faz dodaje się w przewodzie N — N może nieść więcej niż faza.</text>
