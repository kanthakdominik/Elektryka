<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t d">
  <title id="t">Prąd odbiornika liniowego i nieliniowego</title>
  <desc id="d">Dwa wykresy. Po lewej prąd grzałki ma ten sam sinusoidalny kształt co napięcie. Po prawej prąd zasilacza impulsowego płynie wąskimi impulsami w pobliżu szczytów napięcia. Opis: taki prąd zawiera wyższe harmoniczne, a trzecia harmoniczna z trzech faz sumuje się w przewodzie neutralnym.</desc>
