<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
  <title id="t">Budowa i symbole stycznika</title>
  <desc id="d">Po lewej uproszczona budowa stycznika: cewka na nieruchomym rdzeniu, ruchoma zwora ze stykami, sprężyna. Gdy cewka nie ma zasilania, sprężyna trzyma zworę w górze i styki główne są otwarte. Gdy cewka jest zasilona, rdzeń przyciąga zworę i styki się zamykają. Po prawej symbole: cewka z zaciskami A1 i A2, trzy styki główne 1-2, 3-4, 5-6, styk pomocniczy zwierny 13-14 i rozwierny 21-22.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .lin { stroke: #1a1a1a; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="30" class="tytul" text-anchor="middle">Stycznik: elektromagnes, który przestawia styki</text>

  <!-- budowa: cewka bez zasilania -->
  <text x="140" y="64" class="podt" text-anchor="middle">Cewka bez zasilania</text>
  <text x="400" y="64" class="podt" text-anchor="middle">Cewka zasilona</text>
  <g id="budowa">
    <!-- rdzeń E -->
    <path d="M70 330 V250 H90 V310 H130 V250 H150 V310 H190 V250 H210 V330 Z" fill="#aab7b8" stroke="#555" stroke-width="1.5"/>
    <rect x="118" y="262" width="44" height="46" fill="#b9770e" stroke="#7e5109" stroke-width="1.5"/>
    <text x="140" y="290" class="male" text-anchor="middle" style="fill:#ffffff">cewka</text>
  </g>
  <!-- zwora w górze -->
  <rect x="70" y="200" width="140" height="22" fill="#aab7b8" stroke="#555" stroke-width="1.5"/>
  <text x="140" y="216" class="male" text-anchor="middle">zwora</text>
  <path d="M60 222 l-8 6 l16 6 l-16 6 l16 6 l-8 6" fill="none" stroke="#555" stroke-width="2"/>
  <text x="6" y="266" class="male">sprężyna</text>
  <line x1="140" y1="200" x2="140" y2="150" stroke="#555" stroke-width="4"/>
  <rect x="100" y="140" width="80" height="10" fill="#d68910"/>
  <rect x="80" y="110" width="30" height="10" fill="#d68910"/><rect x="170" y="110" width="30" height="10" fill="#d68910"/>
  <text x="140" y="100" class="male" text-anchor="middle">styki otwarte</text>
  <text x="140" y="360" class="opis" text-anchor="middle">sprężyna trzyma zworę;</text>
  <text x="140" y="378" class="opis" text-anchor="middle">obwód główny przerwany</text>

  <!-- zasilona -->
  <use href="#budowa" x="260"/>
  <rect x="330" y="228" width="140" height="22" fill="#aab7b8" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="228" x2="400" y2="130" stroke="#555" stroke-width="4"/>
  <rect x="360" y="120" width="80" height="10" fill="#d68910"/>
  <rect x="340" y="110" width="30" height="10" fill="#d68910"/><rect x="430" y="110" width="30" height="10" fill="#d68910"/>
  <text x="400" y="100" class="male" text-anchor="middle">styki zamknięte</text>
  <g stroke="#1f5fbf" stroke-width="2" fill="none"><path d="M360 255 V240"/><path d="M440 255 V240"/></g>
  <text x="400" y="360" class="opis" text-anchor="middle">pole cewki przyciąga zworę;</text>
  <text x="400" y="378" class="opis" text-anchor="middle">obwód główny zamknięty</text>

  <!-- symbole -->
  <rect x="540" y="50" width="325" height="370" rx="10" fill="#f6f7f9" stroke="#b8bec8"/>
  <text x="702" y="76" class="podt" text-anchor="middle">Symbole na schematach</text>
  <!-- cewka -->
  <rect x="565" y="160" width="40" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="585" y1="140" x2="585" y2="160" class="lin"/><line x1="585" y1="220" x2="585" y2="240" class="lin"/>
  <text x="598" y="146" class="male">A1</text><text x="598" y="240" class="male">A2</text>
  <text x="585" y="262" class="male" text-anchor="middle">cewka</text>
  <!-- styki główne -->
  <g>
    <line x1="650" y1="110" x2="650" y2="160" class="lin"/><line x1="650" y1="160" x2="638" y2="205" class="lin"/><line x1="650" y1="205" x2="650" y2="250" class="lin"/>
    <line x1="690" y1="110" x2="690" y2="160" class="lin"/><line x1="690" y1="160" x2="678" y2="205" class="lin"/><line x1="690" y1="205" x2="690" y2="250" class="lin"/>
    <line x1="730" y1="110" x2="730" y2="160" class="lin"/><line x1="730" y1="160" x2="718" y2="205" class="lin"/><line x1="730" y1="205" x2="730" y2="250" class="lin"/>
    <line x1="605" y1="190" x2="740" y2="190" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="650" y="104" class="male" text-anchor="middle">1</text><text x="690" y="104" class="male" text-anchor="middle">3</text><text x="730" y="104" class="male" text-anchor="middle">5</text>
  <text x="650" y="266" class="male" text-anchor="middle">2</text><text x="690" y="266" class="male" text-anchor="middle">4</text><text x="730" y="266" class="male" text-anchor="middle">6</text>
  <text x="690" y="286" class="male" text-anchor="middle">styki główne (zwierne)</text>
  <!-- pomocnicze -->
  <line x1="790" y1="110" x2="790" y2="160" class="lin"/><line x1="790" y1="160" x2="778" y2="205" class="lin"/><line x1="790" y1="205" x2="790" y2="250" class="lin"/>
  <text x="790" y="104" class="male" text-anchor="middle">13</text><text x="790" y="266" class="male" text-anchor="middle">14</text>
  <line x1="835" y1="110" x2="835" y2="160" class="lin"/><line x1="835" y1="160" x2="852" y2="205" class="lin"/><line x1="835" y1="205" x2="835" y2="250" class="lin"/><line x1="835" y1="160" x2="852" y2="160" class="lin"/>
  <text x="835" y="104" class="male" text-anchor="middle">21</text><text x="835" y="266" class="male" text-anchor="middle">22</text>
  <text x="560" y="320" class="opis">zwierny (NO, „no”): zamyka się, gdy cewka</text>
  <text x="560" y="338" class="opis">ma zasilanie — np. 1-2, 13-14</text>
  <text x="560" y="364" class="opis">rozwierny (NC, „nc”): otwiera się, gdy cewka</text>
  <text x="560" y="382" class="opis">ma zasilanie — np. 21-22</text>
  <text x="560" y="408" class="male">Rysuje się je zawsze w stanie bez zasilania cewki.</text>
</svg>
