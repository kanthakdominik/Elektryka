<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">Droga prądu przez ciało i współczynnik prądu serca</title>
  <desc id="d">Sylwetka człowieka z zaznaczonymi drogami prądu: lewa ręka do stóp, prawa ręka do stóp, ręka do ręki, klatka piersiowa do lewej ręki oraz stopa do stopy. Tabela współczynników prądu serca według IEC TS 60479-1: lewa ręka do stóp 1,0; obie ręce do stóp 1,0; prawa ręka do stóp 0,8; ręka do ręki 0,4; klatka piersiowa do lewej ręki 1,5; stopa do stopy 0,04. Im większy współczynnik, tym większa część prądu przechodzi przez serce.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .cialo { fill: #f5cba7; stroke: #a04000; stroke-width: 1.5; }
  </style>
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="30" class="tytul" text-anchor="middle">Którędy płynie prąd — i ile z niego przechodzi przez serce</text>

  <!-- sylwetka -->
  <circle cx="230" cy="80" r="28" class="cialo"/>
  <rect x="190" y="112" width="80" height="140" rx="22" class="cialo"/>
  <rect x="120" y="118" width="70" height="22" rx="11" class="cialo" transform="rotate(25 190 129)"/>
  <rect x="270" y="118" width="70" height="22" rx="11" class="cialo" transform="rotate(-25 270 129)"/>
  <rect x="195" y="245" width="28" height="160" rx="12" class="cialo"/>
  <rect x="237" y="245" width="28" height="160" rx="12" class="cialo"/>
  <!-- serce -->
  <path d="M245 150 c-6 -10 -22 -6 -18 8 c3 9 18 18 18 18 c0 0 15 -9 18 -18 c4 -14 -12 -18 -18 -8 z" fill="#c0392b"/>
  <text x="290" y="168" class="male">serce</text>
  <!-- ręce: lewa ręka osoby to prawa strona rysunku -->
  <text x="352" y="98" class="male">lewa ręka</text>
  <text x="70" y="98" class="male">prawa ręka</text>
  <circle cx="342" cy="100" r="6" fill="#1a1a1a"/>
  <circle cx="118" cy="100" r="6" fill="#1a1a1a"/>
  <!-- drogi -->
  <path d="M342 100 C 290 130, 260 160, 251 260 L 251 405" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="9 6"/>
  <path d="M118 100 C 170 130, 200 170, 209 260 L 209 405" fill="none" stroke="#d68910" stroke-width="4" stroke-dasharray="9 6"/>
  <path d="M118 100 C 180 90, 280 90, 342 100" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-dasharray="9 6"/>
  <path d="M209 405 C 215 430, 245 430, 251 405" fill="none" stroke="#1e8449" stroke-width="4" stroke-dasharray="9 6"/>
  <rect x="150" y="410" width="160" height="12" fill="#a9cce3"/>

  <!-- tabela -->
  <rect x="440" y="60" width="400" height="330" rx="10" fill="#f6f7f9" stroke="#b8bec8"/>
  <text x="640" y="88" class="podt" text-anchor="middle">Współczynnik prądu serca F</text>
  <line x1="455" y1="100" x2="825" y2="100" stroke="#b8bec8"/>
  <g>
    <line x1="460" y1="125" x2="490" y2="125" stroke="#c0392b" stroke-width="4" stroke-dasharray="9 6"/>
    <text x="500" y="130" class="opis">lewa ręka → stopy</text><text x="815" y="130" class="podt" text-anchor="end">1,0</text>
    <text x="500" y="160" class="opis">obie ręce → stopy</text><text x="815" y="160" class="podt" text-anchor="end">1,0</text>
    <line x1="460" y1="185" x2="490" y2="185" stroke="#d68910" stroke-width="4" stroke-dasharray="9 6"/>
    <text x="500" y="190" class="opis">prawa ręka → stopy</text><text x="815" y="190" class="podt" text-anchor="end">0,8</text>
    <line x1="460" y1="215" x2="490" y2="215" stroke="#1f5fbf" stroke-width="4" stroke-dasharray="9 6"/>
    <text x="500" y="220" class="opis">ręka → ręka</text><text x="815" y="220" class="podt" text-anchor="end">0,4</text>
    <text x="500" y="250" class="opis">klatka piersiowa → lewa ręka</text><text x="815" y="250" class="podt" text-anchor="end" style="fill:#c0392b">1,5</text>
    <line x1="460" y1="275" x2="490" y2="275" stroke="#1e8449" stroke-width="4" stroke-dasharray="9 6"/>
    <text x="500" y="280" class="opis">stopa → stopa</text><text x="815" y="280" class="podt" text-anchor="end">0,04</text>
  </g>
  <line x1="455" y1="296" x2="825" y2="296" stroke="#b8bec8"/>
  <text x="460" y="320" class="male">F mówi, jak groźny jest prąd na danej drodze w porównaniu</text>
  <text x="460" y="338" class="male">z drogą lewa ręka → stopy (F = 1,0). Prąd 100 mA ręka → ręka</text>
  <text x="460" y="356" class="male">działa na serce jak ok. 40 mA lewa ręka → stopy.</text>
  <text x="460" y="378" class="male">Wartości wg IEC TS 60479-1, tabela 12 (wybrane drogi).</text>
  <text x="640" y="420" class="opis" text-anchor="middle">Najgroźniejsze drogi przechodzą przez klatkę piersiową.</text><text x="640" y="440" class="opis" text-anchor="middle">Stopa → stopa omija serce, ale skurcz nóg może przewrócić.</text>
</svg>
