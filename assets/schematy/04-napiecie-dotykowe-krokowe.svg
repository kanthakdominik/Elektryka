<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">Napięcie dotykowe i napięcie krokowe</title>
  <desc id="d">Prąd uszkodzenia spływa do ziemi przez uziom. Potencjał gruntu jest najwyższy przy uziomie i maleje z odległością, co pokazuje krzywa nad gruntem. Osoba dotykająca obudowy połączonej z uziomem ma między dłonią a stopami napięcie dotykowe. Osoba idąca w pobliżu ma między stopami napięcie krokowe, tym większe, im szerszy krok i im bliżej uziomu. Osoba stojąca ze złączonymi stopami ma niemal zerowe napięcie krokowe.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .os { stroke: #555; stroke-width: 1.5; }
  </style>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" class="tytul" text-anchor="middle">Napięcie dotykowe i napięcie krokowe</text>

  <!-- wykres potencjału: φ(r) = φ0·r0/r -->
  <line x1="60" y1="230" x2="840" y2="230" class="os"/>
  <line x1="60" y1="60" x2="60" y2="230" class="os"/>
  <text x="66" y="68" class="male">potencjał gruntu</text>
  <path d="M60 222 L120 218 L180 210 L230 196 L260 182 L280 166 L295 145 L305 120 L310 95 L320 80 L330 95 L335 120 L345 145 L360 166 L380 182 L410 196 L460 210 L520 218 L600 223 L700 226 L840 228" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="330" y="74" class="male" text-anchor="middle">najwyższy przy uziomie</text>

  <!-- grunt -->
  <rect x="40" y="330" width="820" height="90" fill="#e5d3b3"/>
  <line x1="40" y1="330" x2="860" y2="330" stroke="#8d6e63" stroke-width="2"/>
  <!-- uziom -->
  <rect x="314" y="330" width="12" height="70" fill="#7f8c8d"/>
  <text x="320" y="436" class="male" text-anchor="middle">uziom (lub przewód leżący na ziemi)</text>
  <g fill="none" stroke="#8d6e63" stroke-width="1.2" stroke-dasharray="4 4">
    <path d="M300 330 a20 20 0 0 0 40 0"/><path d="M280 330 a40 40 0 0 0 80 0"/><path d="M250 330 a70 70 0 0 0 140 0"/>
  </g>

  <!-- urządzenie i osoba A -->
  <rect x="345" y="250" width="70" height="80" rx="6" fill="#d5d8dc" stroke="#555" stroke-width="2"/>
  <text x="380" y="294" class="male" text-anchor="middle">obudowa</text>
  <line x1="345" y1="320" x2="326" y2="340" stroke="#2e8b57" stroke-width="3"/>
  <circle cx="460" cy="250" r="12" fill="#f5cba7" stroke="#555"/>
  <line x1="460" y1="262" x2="460" y2="300" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="272" x2="418" y2="282" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <line x1="460" y1="300" x2="452" y2="328" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="300" x2="468" y2="328" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="80" x2="380" y2="250" stroke="#1f5fbf" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="460" y1="208" x2="460" y2="240" stroke="#1f5fbf" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="465" y="120" class="podt" style="fill:#1f5fbf">U_T — napięcie dotykowe</text>
  <text x="465" y="138" class="male">ręka na obudowie (potencjał uziomu),</text>
  <text x="465" y="154" class="male">stopy na gruncie o niższym potencjale</text>

  <!-- osoba B: szeroki krok -->
  <circle cx="231" cy="250" r="12" fill="#f5cba7" stroke="#555"/>
  <line x1="231" y1="262" x2="231" y2="300" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="231" y1="300" x2="200" y2="328" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="231" y1="300" x2="262" y2="328" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="205" x2="200" y2="325" stroke="#d68910" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="262" y1="180" x2="262" y2="325" stroke="#d68910" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="60" y="270" class="podt" style="fill:#d68910">U_S — krokowe</text>
  <text x="60" y="288" class="male">stopy na różnych</text>
  <text x="60" y="304" class="male">potencjałach</text>

  <!-- osoba C: stopy razem -->
  <circle cx="660" cy="250" r="12" fill="#f5cba7" stroke="#555"/>
  <line x1="660" y1="262" x2="660" y2="328" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <text x="690" y="270" class="podt" style="fill:#1e8449">U_S ≈ 0</text>
  <text x="690" y="288" class="male">stopy złączone,</text>
  <text x="690" y="304" class="male">daleko od uziomu</text>

  <text x="440" y="462" class="opis" text-anchor="middle">Uciekając ze strefy: małe kroki, stopy blisko siebie (albo skoki obunóż) — nigdy szerokie kroki ani bieg.</text>
</svg>
