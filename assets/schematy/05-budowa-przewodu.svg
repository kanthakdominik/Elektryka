<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" role="img" aria-labelledby="t d">
  <title id="t">Budowa przewodu i różnica między przewodem a kablem</title>
  <desc id="d">Po lewej przekrój przewodu YDY 3 razy 2,5: szara powłoka, białe wypełnienie i trzy żyły miedziane w izolacji brązowej, niebieskiej i żółto-zielonej. Po prawej przewód z odciętą powłoką: powłoka chroni całość, izolacja żył ma kolor oznaczający funkcję, miedziana żyła przewodzi prąd. W ramce: przewód służy do instalacji w budynkach (450/750 V), kabel ma mocniejszą budowę do ziemi i na zewnątrz (0,6/1 kV).</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="460" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Budowa przewodu: żyła, izolacja, powłoka</text>
<circle cx="190" cy="215" r="112" fill="#dfe2e3" stroke="#7f8c8d" stroke-width="2"/>
<circle cx="190" cy="215" r="96" fill="#f6f6f2" stroke="#b3b6b7" stroke-width="1"/>
<circle cx="190.0" cy="165.0" r="38" fill="#8b4513" stroke="#8b4513" stroke-width="1.5"/>
<circle cx="190.0" cy="165.0" r="20" fill="#c87533" stroke="#8e5022" stroke-width="1.5"/>
<circle cx="233.3" cy="240.0" r="38" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="233.3" cy="240.0" r="20" fill="#c87533" stroke="#8e5022" stroke-width="1.5"/>
<circle cx="146.7" cy="240.0" r="38" fill="url(#zz)" stroke="#1e8449" stroke-width="1.5"/>
<circle cx="146.7" cy="240.0" r="20" fill="#c87533" stroke="#8e5022" stroke-width="1.5"/>
<text x="190" y="360" class="podt" text-anchor="middle">Przekrój przewodu YDY 3×2,5</text>
<line x1="291" y1="159" x2="330" y2="92" stroke="#555" stroke-width="1.2"/>
<text x="334" y="90" class="male" text-anchor="start">powłoka</text>
<line x1="262" y1="255" x2="330" y2="300" stroke="#555" stroke-width="1.2"/>
<text x="334" y="304" class="male" text-anchor="start">wypełnienie</text>
<rect x="440" y="150" width="170" height="74" rx="10" fill="#dfe2e3" stroke="#7f8c8d" stroke-width="2"/>
<rect x="604" y="163" width="110" height="18" rx="4" fill="#8b4513" stroke="#8b4513" stroke-width="1.2"/>
<rect x="712" y="167" width="58" height="10" rx="3" fill="#c87533" stroke="#8e5022" stroke-width="1"/>
<rect x="604" y="187" width="110" height="18" rx="4" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.2"/>
<rect x="712" y="191" width="58" height="10" rx="3" fill="#c87533" stroke="#8e5022" stroke-width="1"/>
<rect x="604" y="211" width="110" height="18" rx="4" fill="url(#zz)" stroke="#1e8449" stroke-width="1.2"/>
<rect x="712" y="215" width="58" height="10" rx="3" fill="#c87533" stroke="#8e5022" stroke-width="1"/>
<line x1="525" y1="150" x2="525" y2="112" stroke="#555" stroke-width="1.2"/>
<text x="525" y="104" class="opis" text-anchor="middle">powłoka (PVC)</text>
<text x="525" y="86" class="male" text-anchor="middle">chroni całość</text>
<line x1="660" y1="163" x2="660" y2="112" stroke="#555" stroke-width="1.2"/>
<text x="660" y="104" class="opis" text-anchor="middle">izolacja żył</text>
<text x="660" y="86" class="male" text-anchor="middle">kolor = funkcja</text>
<line x1="745" y1="216" x2="745" y2="262" stroke="#555" stroke-width="1.2"/>
<text x="745" y="280" class="opis" text-anchor="middle">żyła (Cu)</text>
<text x="745" y="298" class="male" text-anchor="middle">przewodzi prąd</text>
<rect x="420" y="320" width="400" height="120" rx="8" class="ramka"/>
<text x="436" y="345" class="podt" text-anchor="start">Przewód</text>
<text x="436" y="365" class="male" text-anchor="start">do budynków, np. YDY, H07V-U; 450/750 V</text>
<text x="436" y="395" class="podt" text-anchor="start">Kabel</text>
<text x="436" y="415" class="male" text-anchor="start">mocniejsza budowa, w ziemi i na zewnątrz,</text>
<text x="436" y="431" class="male" text-anchor="start">np. YKY, NYY; 0,6/1 kV</text>
</svg>
