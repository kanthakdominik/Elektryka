<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="t d">
  <title id="t">Kolory żył przewodów</title>
  <desc id="d">Kolory izolacji według PN-EN 60445: L1 brązowy, L2 czarny, L3 szary, przewód neutralny niebieski, przewód ochronny PE żółto-zielony, przewód PEN żółto-zielony z niebieskimi oznaczeniami na końcach. Ostrzeżenie: żółto-zielonego nie wolno użyć do niczego innego niż PE lub PEN, a kolor trzeba zawsze sprawdzić miernikiem.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="500" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Kolory żył (PN-EN 60445)</text>
<text x="40" y="93" class="podt" text-anchor="start">L1 / L</text>
<rect x="110" y="72" width="230" height="28" rx="14" fill="#8b4513" stroke="#555" stroke-width="1"/>
<rect x="340" y="81" width="40" height="10" rx="3" fill="#c87533"/>
<text x="400" y="85" class="podt" text-anchor="start">brązowy</text>
<text x="400" y="103" class="male" text-anchor="start">faza; w obwodzie jednofazowym zwykle brązowy</text>
<text x="40" y="149" class="podt" text-anchor="start">L2</text>
<rect x="110" y="128" width="230" height="28" rx="14" fill="#222222" stroke="#555" stroke-width="1"/>
<rect x="340" y="137" width="40" height="10" rx="3" fill="#c87533"/>
<text x="400" y="141" class="podt" text-anchor="start">czarny</text>
<text x="400" y="159" class="male" text-anchor="start">faza (L1 albo L w jednofazowym też bywa czarny)</text>
<text x="40" y="205" class="podt" text-anchor="start">L3</text>
<rect x="110" y="184" width="230" height="28" rx="14" fill="#95a5a6" stroke="#555" stroke-width="1"/>
<rect x="340" y="193" width="40" height="10" rx="3" fill="#c87533"/>
<text x="400" y="197" class="podt" text-anchor="start">szary</text>
<text x="400" y="215" class="male" text-anchor="start">faza</text>
<text x="40" y="261" class="podt" text-anchor="start">N</text>
<rect x="110" y="240" width="230" height="28" rx="14" fill="#3498db" stroke="#555" stroke-width="1"/>
<rect x="340" y="249" width="40" height="10" rx="3" fill="#c87533"/>
<text x="400" y="253" class="podt" text-anchor="start">niebieski</text>
<text x="400" y="271" class="male" text-anchor="start">przewód neutralny</text>
<text x="40" y="317" class="podt" text-anchor="start">PE</text>
<rect x="110" y="296" width="230" height="28" rx="14" fill="url(#zz)" stroke="#555" stroke-width="1"/>
<rect x="340" y="305" width="40" height="10" rx="3" fill="#c87533"/>
<text x="400" y="309" class="podt" text-anchor="start">żółto-zielony</text>
<text x="400" y="327" class="male" text-anchor="start">przewód ochronny — tylko i wyłącznie PE</text>
<text x="40" y="373" class="podt" text-anchor="start">PEN</text>
<rect x="110" y="352" width="230" height="28" rx="14" fill="url(#zz)" stroke="#555" stroke-width="1"/>
<rect x="340" y="361" width="40" height="10" rx="3" fill="#c87533"/>
<rect x="120" y="350" width="16" height="32" rx="3" fill="#3498db"/>
<rect x="310" y="350" width="16" height="32" rx="3" fill="#3498db"/>
<text x="400" y="365" class="podt" text-anchor="start">żółto-zielony + niebieskie oznaczenia</text>
<text x="400" y="383" class="male" text-anchor="start">ochronno-neutralny (dawniej „zerowy”)</text>
<rect x="40" y="410" width="760" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="56" y="436" class="opis" text-anchor="start">⚠ Żółto-zielonego nie wolno użyć do niczego innego niż PE (PEN).</text>
<text x="56" y="460" class="opis" text-anchor="start">Kolor to deklaracja montera, nie gwarancja — zawsze sprawdzaj miernikiem.</text>
</svg>
