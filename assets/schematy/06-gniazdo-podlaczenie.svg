<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t d">
  <title id="t">Podłączenie gniazda z bolcem ochronnym</title>
  <desc id="d">Gniazdo widziane od przodu z bolcem ochronnym u góry: lewy otwór to faza L, prawy to przewód neutralny N, bolec to przewód ochronny PE. W gnieździe podwójnym górne gniazdo bywa obrócone bolcem w dół i wtedy faza wypada po prawej. Ostrzeżenie: gniazdo z bolcem bez podłączonego PE nie chroni obudowy urządzenia klasy I.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="440" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Podłączenie gniazda z bolcem ochronnym</text>
<rect x="100" y="110" width="260" height="260" rx="30" fill="#fbfcfc" stroke="#aab7b8" stroke-width="2"/>
<circle cx="230" cy="240" r="95" fill="#eef0f1" stroke="#7f8c8d" stroke-width="2"/>
<rect x="223" y="158" width="14" height="40" rx="7" fill="#d4ac0d" stroke="#7d6608"/>
<circle cx="185" cy="245" r="13" fill="#1a1a1a"/>
<circle cx="275" cy="245" r="13" fill="#1a1a1a"/>
<text x="185" y="288" class="podt" text-anchor="middle" style="font-size:22px;fill:#8b4513">L</text>
<text x="275" y="288" class="podt" text-anchor="middle" style="font-size:22px;fill:#1f5fbf">N</text>
<text x="254" y="184" class="podt" text-anchor="start" style="font-size:18px;fill:#1e8449">PE</text>
<text x="230" y="400" class="opis" text-anchor="middle">Widok od przodu, bolec u góry</text>
<text x="430" y="110" class="podt" text-anchor="start">Zasada przyjęta w Polsce:</text>
<text x="430" y="138" class="opis" text-anchor="start">• faza L — lewy otwór (patrząc od przodu),</text>
<text x="430" y="160" class="opis" text-anchor="start">• N — prawy otwór,</text>
<text x="430" y="182" class="opis" text-anchor="start">• PE — zawsze do bolca.</text>
<text x="430" y="230" class="podt" text-anchor="start">W gnieździe podwójnym:</text>
<text x="430" y="258" class="opis" text-anchor="start">górne gniazdo jest często obrócone</text>
<text x="430" y="278" class="opis" text-anchor="start">(bolec na dole) — wtedy faza wypada</text>
<text x="430" y="298" class="opis" text-anchor="start">po prawej. Trzymaj się jednej reguły</text>
<text x="430" y="318" class="opis" text-anchor="start">w całym mieszkaniu.</text>
<rect x="420" y="350" width="390" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="436" y="375" class="opis" text-anchor="start">⚠ Bez PE gniazdo z bolcem jest pułapką:</text>
<text x="436" y="397" class="opis" text-anchor="start">obudowa urządzenia klasy I nie jest chroniona.</text>
</svg>
