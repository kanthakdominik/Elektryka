<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t d">
  <title id="t">Selektywność zabezpieczeń</title>
  <desc id="d">Dwa przypadki tej samej instalacji: zabezpieczenie przedlicznikowe gG 25 A, a za nim trzy wyłączniki nadprądowe B10, B16 i B16. Zwarcie w obwodzie drugiego B16. Po lewej selektywnie: zadziałał tylko B16 obwodu z usterką, a pozostałe obwody mają prąd. Po prawej nieselektywnie: przepaliła się wkładka przedlicznikowa i ciemno jest w całym mieszkaniu. Selektywność zapewnia odpowiednia różnica prądów lub czasów i sprawdzenie w tabelach producenta.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
