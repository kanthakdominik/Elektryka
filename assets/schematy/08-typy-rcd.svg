<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 475" width="840" height="475" role="img" aria-labelledby="t d">
  <title id="t">Typy wyłączników różnicowoprądowych AC, A, F i B</title>
  <desc id="d">Cztery typy z przebiegami prądu różnicowego, które wykrywają. AC: przemienny sinusoidalny, dla prostych odbiorników jak grzałki. A: dodatkowo prąd pulsujący jednokierunkowy, standard w domu przy elektronice jednofazowej. F: dodatkowo mieszanina częstotliwości, dla pralek, pomp i klimatyzatorów z jednofazowym falownikiem. B: dodatkowo wygładzony prąd stały, dla falowników trójfazowych, ładowarek samochodów elektrycznych i części instalacji fotowoltaicznych. Każdy kolejny typ wykrywa wszystko, co poprzedni.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
