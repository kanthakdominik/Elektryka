<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-labelledby="t d">
  <title id="t">Wpływ długości połączeń ogranicznika przepięć</title>
  <desc id="d">Dwa warianty podłączenia ogranicznika przepięć między przewód fazowy a szynę PE. Po lewej źle: długie przewody z pętlami, a równe 0,7 metra i b równe 0,8 metra. Po prawej dobrze: krótkie proste przewody, a równe 0,2 metra i b równe 0,3 metra, łącznie nie więcej niż 0,5 metra. Napięcie na chronionej instalacji to poziom ochrony ogranicznika plus spadek na przewodach, około 1 kilowolta na metr przy udarze. W złym wariancie 1,3 kV plus 1,5 kV daje około 2,8 kV, więcej niż wytrzyma odbiornik kategorii II. W dobrym wariancie około 1,8 kV.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="520" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Długość połączeń ogranicznika decyduje o ochronie</text>
<rect x="20" y="50" width="390" height="330" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
<text x="215" y="76" class="podt" text-anchor="middle" style="fill:#c0392b">Źle: długie przewody (np. 1,5 m)</text>
<text x="34" y="115" class="podt" text-anchor="start" style="fill:#8b4513">L</text>
<line x1="50" y1="110" x2="390" y2="110" stroke="#8b4513" stroke-width="3"/>
<text x="390" y="100" class="male" text-anchor="end">do odbiorników →</text>
<text x="34" y="345" class="podt" text-anchor="start" style="fill:#1e8449">PE</text>
<line x1="60" y1="340" x2="390" y2="340" stroke="#27ae60" stroke-width="3"/>
<text x="390" y="362" class="male" text-anchor="end">szyna PE / GSU</text>
<path d="M215 110 L215 130 q 40 10 0 20 q -40 10 0 20 L215 180" fill="none" stroke="#8b4513" stroke-width="3"/>
<rect x="185" y="180" width="60" height="70" rx="6" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="215.0" y="220.0" class="podt" text-anchor="middle">SPD</text>
<path d="M215 250 L215 270 q 40 10 0 20 q -40 10 0 20 L215 340" fill="none" stroke="#27ae60" stroke-width="3"/>
<text x="265" y="150" class="opis" text-anchor="start">a = 0,7 m</text>
<text x="265" y="300" class="opis" text-anchor="start">b = 0,8 m</text>
<text x="215" y="395" class="male" text-anchor="middle"></text>
<rect x="430" y="50" width="390" height="330" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
<text x="625" y="76" class="podt" text-anchor="middle" style="fill:#1e8449">Dobrze: a + b ≤ 0,5 m</text>
<text x="444" y="115" class="podt" text-anchor="start" style="fill:#8b4513">L</text>
<line x1="460" y1="110" x2="800" y2="110" stroke="#8b4513" stroke-width="3"/>
<text x="800" y="100" class="male" text-anchor="end">do odbiorników →</text>
<text x="444" y="345" class="podt" text-anchor="start" style="fill:#1e8449">PE</text>
<line x1="470" y1="340" x2="800" y2="340" stroke="#27ae60" stroke-width="3"/>
<text x="800" y="362" class="male" text-anchor="end">szyna PE / GSU</text>
<line x1="625" y1="110" x2="625" y2="180" stroke="#8b4513" stroke-width="3"/>
<rect x="595" y="180" width="60" height="70" rx="6" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="625.0" y="220.0" class="podt" text-anchor="middle">SPD</text>
<line x1="625" y1="250" x2="625" y2="340" stroke="#27ae60" stroke-width="3"/>
<text x="675" y="150" class="opis" text-anchor="start">a = 0,2 m</text>
<text x="675" y="300" class="opis" text-anchor="start">b = 0,3 m</text>
<rect x="20" y="395" width="800" height="110" rx="8" class="ramka"/>
<text x="36" y="422" class="opis" text-anchor="start">Napięcie na chronionej instalacji = Up ogranicznika + spadek na przewodach (ok. 1 kV na metr przy udarze).</text>
<text x="36" y="448" class="opis" text-anchor="start">Źle: 1,3 kV + 1,5 m × 1 kV/m ≈ 2,8 kV — więcej niż wytrzyma odbiornik kategorii II (2,5 kV).</text>
<text x="36" y="474" class="opis" text-anchor="start">Dobrze: 1,3 kV + 0,5 m × 1 kV/m ≈ 1,8 kV.</text>
<text x="36" y="496" class="male" text-anchor="start">Przewody krótkie, proste, bez pętli; najlepiej połączenie „V” (przelotowe) na zaciskach SPD.</text>
</svg>
