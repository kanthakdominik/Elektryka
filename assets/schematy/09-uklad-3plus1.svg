<line x1="180" y1="286" x2="180" y2="340" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="180" cy="340" r="4" fill="#1a1a1a"/>
<line x1="250" y1="286" x2="250" y2="340" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="250" cy="340" r="4" fill="#1a1a1a"/>
<text x="320" y="260" class="male" text-anchor="middle">warystory</text>
<text x="320" y="276" class="male" text-anchor="middle">L–PEN</text>
<rect x="430" y="50" width="390" height="330" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
<text x="625" y="76" class="podt" text-anchor="middle">3+1 (CT2) — TT i przed RCD</text>
<text x="444" y="115" class="podt" text-anchor="start" style="fill:#8b4513">L1</text>
<line x1="475" y1="110" x2="800" y2="110" stroke="#8b4513" stroke-width="3"/>
<text x="444" y="145" class="podt" text-anchor="start" style="fill:#222">L2</text>
<line x1="475" y1="140" x2="800" y2="140" stroke="#222" stroke-width="3"/>
<text x="444" y="175" class="podt" text-anchor="start" style="fill:#95a5a6">L3</text>
<line x1="475" y1="170" x2="800" y2="170" stroke="#95a5a6" stroke-width="3"/>
<text x="444" y="205" class="podt" text-anchor="start" style="fill:#3498db">N</text>
<line x1="475" y1="200" x2="800" y2="200" stroke="#3498db" stroke-width="3"/>
<text x="444" y="345" class="podt" text-anchor="start" style="fill:#1e8449">PE</text>
<line x1="485" y1="340" x2="800" y2="340" stroke="#27ae60" stroke-width="3"/>
<circle cx="520" cy="110" r="4" fill="#1a1a1a"/>
<line x1="520" y1="110" x2="520" y2="240" stroke="#8b4513" stroke-width="2.5"/>
<rect x="502" y="240" width="36" height="46" rx="4" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="520" y="268" class="podt" text-anchor="middle">V</text>
<circle cx="590" cy="140" r="4" fill="#1a1a1a"/>
