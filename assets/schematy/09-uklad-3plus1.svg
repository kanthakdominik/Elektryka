<line x1="520" y1="286" x2="520" y2="292" stroke="#1f5fbf" stroke-width="2.5"/>
<line x1="590" y1="286" x2="590" y2="292" stroke="#1f5fbf" stroke-width="2.5"/>
<line x1="660" y1="286" x2="660" y2="292" stroke="#1f5fbf" stroke-width="2.5"/>
<line x1="520" y1="292" x2="730" y2="292" stroke="#1f5fbf" stroke-width="2.5"/>
<circle cx="730" cy="200" r="4" fill="#1a1a1a"/>
<circle cx="730" cy="292" r="4" fill="#1a1a1a"/>
<line x1="730" y1="200" x2="730" y2="300" stroke="#3498db" stroke-width="2.5"/>
<rect x="715" y="300" width="30" height="34" rx="4" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
<text x="730" y="322" class="podt" text-anchor="middle">G</text>
<line x1="730" y1="334" x2="730" y2="340" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="730" cy="340" r="4" fill="#1a1a1a"/>
<text x="754" y="312" class="male" text-anchor="start">iskiernik</text>
<text x="754" y="328" class="male" text-anchor="start">N–PE</text>
<text x="590" y="228" class="male" text-anchor="middle">warystory L–N</text>
<text x="420" y="405" class="male" text-anchor="middle">V — warystor, G — iskiernik sumujący. Za podziałem PEN (TN-S) i w TT: 3+1 albo 4+0. W 3+1 uszkodzony</text>
<text x="420" y="423" class="male" text-anchor="middle">warystor nie łączy fazy z PE, dlatego ten układ stosuje się w TT i przed wyłącznikiem różnicowoprądowym.</text>
</svg>
