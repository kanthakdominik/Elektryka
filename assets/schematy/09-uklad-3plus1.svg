<text x="180" y="268" class="podt" text-anchor="middle">V</text>
<circle cx="250" cy="170" r="4" fill="#1a1a1a"/>
<line x1="250" y1="170" x2="250" y2="240" stroke="#95a5a6" stroke-width="2.5"/>
<rect x="232" y="240" width="36" height="46" rx="4" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="250" y="268" class="podt" text-anchor="middle">V</text>
<line x1="110" y1="286" x2="110" y2="340" stroke="#27ae60" stroke-width="2.5"/>
