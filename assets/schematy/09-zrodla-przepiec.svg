<text x="36" y="440" class="opis" text-anchor="start">1 — uderzenie w budynek lub instalację odgromową — największa energia</text>
<text x="36" y="464" class="opis" text-anchor="start">2 — uderzenie w linię zasilającą lub w jej pobliżu — fala biegnie do budynku</text>
<text x="36" y="488" class="opis" text-anchor="start">3 — uderzenie w pobliżu — pole indukuje napięcia w przewodach</text>
<text x="36" y="512" class="opis" text-anchor="start">4 — przełączenia: silniki, transformatory, zadziałanie bezpieczników</text>
</svg>
