<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img" aria-labelledby="t d">
  <title id="t">Aparaty modułowe w rozdzielnicy domowej</title>
  <desc id="d">Rząd aparatów na szynie TH35: rozłącznik główny, ogranicznik przepięć typu 2, kontrolki faz, wyłącznik różnicowoprądowy 30 mA, wyłączniki nadprądowe B10 i B16, RCBO, stycznik, przekaźnik bistabilny, zegar, podlicznik i detektor iskrzenia AFDD. Pod spodem lista z funkcją każdego aparatu i odnośnikiem do tematu.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="490" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Aparaty w rozdzielnicy domowej — co jest czym</text>
<line x1="30" y1="160" x2="810" y2="160" stroke="#aab7b8" stroke-width="14"/>
<rect x="40" y="100" width="62" height="120" rx="5" fill="#f2f3f4" stroke="#566573" stroke-width="1.5"/>
<rect x="65.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="71.0" y="122" class="male" text-anchor="middle">rozłącznik</text>
<text x="71.0" y="200" class="male" text-anchor="middle">główny</text>
<rect x="106" y="100" width="62" height="120" rx="5" fill="#eaf2fb" stroke="#566573" stroke-width="1.5"/>
<rect x="131.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="137.0" y="122" class="male" text-anchor="middle">SPD</text>
<text x="137.0" y="200" class="male" text-anchor="middle">typ 2</text>
<rect x="172" y="100" width="62" height="120" rx="5" fill="#fef9e7" stroke="#566573" stroke-width="1.5"/>
<rect x="197.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="203.0" y="122" class="male" text-anchor="middle">kontrolki</text>
<text x="203.0" y="200" class="male" text-anchor="middle">faz</text>
<rect x="238" y="100" width="62" height="120" rx="5" fill="#eaf2fb" stroke="#566573" stroke-width="1.5"/>
<rect x="263.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="269.0" y="122" class="male" text-anchor="middle">RCD</text>
<text x="269.0" y="200" class="male" text-anchor="middle">30 mA</text>
<rect x="304" y="100" width="29" height="120" rx="5" fill="#ffffff" stroke="#566573" stroke-width="1.5"/>
<rect x="312.5" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="318.5" y="122" class="male" text-anchor="middle">B10</text>
<rect x="337" y="100" width="29" height="120" rx="5" fill="#ffffff" stroke="#566573" stroke-width="1.5"/>
<rect x="345.5" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="351.5" y="122" class="male" text-anchor="middle">B16</text>
<rect x="370" y="100" width="29" height="120" rx="5" fill="#ffffff" stroke="#566573" stroke-width="1.5"/>
<rect x="378.5" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="384.5" y="122" class="male" text-anchor="middle">B16</text>
<rect x="403" y="100" width="62" height="120" rx="5" fill="#eaf2fb" stroke="#566573" stroke-width="1.5"/>
<rect x="428.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="434.0" y="122" class="male" text-anchor="middle">RCBO</text>
<rect x="469" y="100" width="62" height="120" rx="5" fill="#fdedec" stroke="#566573" stroke-width="1.5"/>
<rect x="494.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="500.0" y="122" class="male" text-anchor="middle">stycznik</text>
<rect x="535" y="100" width="62" height="120" rx="5" fill="#fdedec" stroke="#566573" stroke-width="1.5"/>
<rect x="560.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="566.0" y="122" class="male" text-anchor="middle">bista-</text>
<text x="566.0" y="200" class="male" text-anchor="middle">bilny</text>
<rect x="601" y="100" width="62" height="120" rx="5" fill="#e8f8f5" stroke="#566573" stroke-width="1.5"/>
<rect x="626.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="632.0" y="122" class="male" text-anchor="middle">zegar</text>
<rect x="667" y="100" width="62" height="120" rx="5" fill="#f4ecf7" stroke="#566573" stroke-width="1.5"/>
<rect x="692.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="698.0" y="122" class="male" text-anchor="middle">pod-</text>
<text x="698.0" y="200" class="male" text-anchor="middle">licznik</text>
<rect x="733" y="100" width="62" height="120" rx="5" fill="#fef5e7" stroke="#566573" stroke-width="1.5"/>
<rect x="758.0" y="145" width="12" height="28" rx="3" fill="#2c3e50"/>
<text x="764.0" y="122" class="male" text-anchor="middle">AFDD</text>
<text x="420" y="250" class="male" text-anchor="middle">Szerokość aparatów w modułach (1 moduł = 17,5–18 mm)</text>
<rect x="30" y="270" width="780" height="200" rx="8" class="ramka"/>
<text x="46" y="296" class="podt" text-anchor="start" style="font-size:13px">rozłącznik główny</text>
<text x="300" y="296" class="male" text-anchor="start">wyłącza całą rozdzielnicę, bez wyzwalaczy</text>
<text x="790" y="296" class="male" text-anchor="end">10.01</text>
<text x="46" y="318" class="podt" text-anchor="start" style="font-size:13px">SPD</text>
<text x="300" y="318" class="male" text-anchor="start">ogranicznik przepięć</text>
<text x="790" y="318" class="male" text-anchor="end">moduł 09</text>
<text x="46" y="340" class="podt" text-anchor="start" style="font-size:13px">kontrolki faz</text>
<text x="300" y="340" class="male" text-anchor="start">pokazują obecność napięcia L1–L3</text>
<text x="790" y="340" class="male" text-anchor="end">10.04</text>
<text x="46" y="362" class="podt" text-anchor="start" style="font-size:13px">RCD, B10/B16, RCBO</text>
<text x="300" y="362" class="male" text-anchor="start">ochrona różnicowa i nadprądowa</text>
<text x="790" y="362" class="male" text-anchor="end">moduły 07–08</text>
<text x="46" y="384" class="podt" text-anchor="start" style="font-size:13px">stycznik, przekaźnik bistabilny</text>
<text x="300" y="384" class="male" text-anchor="start">łączą obwody na polecenie</text>
<text x="790" y="384" class="male" text-anchor="end">10.02</text>
<text x="46" y="406" class="podt" text-anchor="start" style="font-size:13px">zegar, zmierzchowy</text>
<text x="300" y="406" class="male" text-anchor="start">sterują w czasie lub od światła</text>
<text x="790" y="406" class="male" text-anchor="end">10.03</text>
<text x="46" y="428" class="podt" text-anchor="start" style="font-size:13px">podlicznik</text>
<text x="300" y="428" class="male" text-anchor="start">mierzy energię obwodu</text>
<text x="790" y="428" class="male" text-anchor="end">10.06</text>
<text x="46" y="450" class="podt" text-anchor="start" style="font-size:13px">AFDD</text>
<text x="300" y="450" class="male" text-anchor="start">wykrywa iskrzenie</text>
<text x="790" y="450" class="male" text-anchor="end">10.05</text>
</svg>
