<text x="420" y="30" class="tytul" text-anchor="middle">Układ IT</text>
<text x="420" y="355" class="opis" text-anchor="middle">Źródło odizolowane od ziemi. Pierwsze zwarcie z ziemią nie wyłącza</text>
<text x="420" y="375" class="opis" text-anchor="middle">zasilania — sygnalizuje je kontrola izolacji. Szpitale, kopalnie.</text>
</svg>
