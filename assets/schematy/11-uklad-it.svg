<text x="740" y="316" class="male" text-anchor="start">obudów</text>
<rect x="300" y="215" width="120" height="44" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
<text x="360" y="236" class="male" text-anchor="middle">kontrola</text>
<text x="360" y="251" class="male" text-anchor="middle">izolacji (IMD)</text>
<circle cx="330" cy="140" r="4.5" fill="#1a1a1a"/>
