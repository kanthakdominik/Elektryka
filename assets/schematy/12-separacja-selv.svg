<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 395" width="840" height="395" role="img" aria-labelledby="t d">
  <title id="t">Separacja elektryczna i SELV</title>
  <desc id="d">Dwa schematy z transformatorem. Po lewej separacja: transformator separacyjny zasila napięciem 230 V jeden odbiornik; obwód wtórny i obudowa nie są połączone z ziemią ani z PE. Po prawej SELV: transformator bezpieczeństwa zasila bardzo niskim napięciem, na przykład 12 V, lampę; ani obwód, ani części dostępne nie są uziemione, w odróżnieniu od PELV. Pojedynczy błąd do ziemi nie zamyka obwodu, bo przez człowieka nie ma drogi powrotnej do źródła.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="395" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Separacja elektryczna i SELV</text>
<rect x="20" y="50" width="390" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
<text x="215" y="76" class="podt" text-anchor="middle">Separacja: 230 V, jeden odbiornik</text>
<line x1="50" y1="130" x2="110" y2="130" stroke="#8b4513" stroke-width="3"/>
<line x1="50" y1="190" x2="110" y2="190" stroke="#3498db" stroke-width="3"/>
<text x="34" y="135" class="podt" text-anchor="start" style="fill:#8b4513">L</text>
<text x="34" y="195" class="podt" text-anchor="start" style="fill:#1f5fbf">N</text>
<circle cx="140" cy="160" r="30" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<circle cx="180" cy="160" r="30" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="110" y1="130" x2="120" y2="140" stroke="#1a1a1a" stroke-width="2"/>
<line x1="110" y1="190" x2="120" y2="180" stroke="#1a1a1a" stroke-width="2"/>
<line x1="200" y1="140" x2="220" y2="130" stroke="#1a1a1a" stroke-width="2"/>
<line x1="200" y1="180" x2="220" y2="190" stroke="#1a1a1a" stroke-width="2"/>
<line x1="220" y1="130" x2="310" y2="130" stroke="#1a1a1a" stroke-width="3"/>
<line x1="220" y1="190" x2="310" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<rect x="310" y="120" width="80" height="80" rx="6" fill="#d6dbdf" stroke="#566573" stroke-width="2"/>
<text x="160" y="215" class="male" text-anchor="middle">transformator</text>
<text x="160" y="231" class="male" text-anchor="middle">separacyjny</text>
<text x="265" y="120" class="podt" text-anchor="middle">230 V</text>
<text x="350" y="165" class="male" text-anchor="middle">1 odbiornik</text>
<text x="350" y="181" class="male" text-anchor="middle"></text>
<line x1="350" y1="200" x2="350" y2="230" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="350" y1="230" x2="350" y2="244" stroke="#bbbbbb" stroke-width="2"/>
<line x1="337.0" y1="244" x2="363.0" y2="244" stroke="#bbbbbb" stroke-width="2"/>
<line x1="341.5" y1="250" x2="358.5" y2="250" stroke="#bbbbbb" stroke-width="2"/>
