<line x1="332" y1="236" x2="368" y2="262" stroke="#c0392b" stroke-width="3"/>
<line x1="332" y1="262" x2="368" y2="236" stroke="#c0392b" stroke-width="3"/>
<rect x="430" y="50" width="390" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc"/>
<text x="625" y="76" class="podt" text-anchor="middle">SELV: bardzo niskie napięcie (≤ 50 V AC)</text>
<line x1="460" y1="130" x2="520" y2="130" stroke="#8b4513" stroke-width="3"/>
<line x1="460" y1="190" x2="520" y2="190" stroke="#3498db" stroke-width="3"/>
<text x="444" y="135" class="podt" text-anchor="start" style="fill:#8b4513">L</text>
<text x="444" y="195" class="podt" text-anchor="start" style="fill:#1f5fbf">N</text>
<circle cx="550" cy="160" r="30" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<circle cx="590" cy="160" r="30" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="520" y1="130" x2="530" y2="140" stroke="#1a1a1a" stroke-width="2"/>
<line x1="520" y1="190" x2="530" y2="180" stroke="#1a1a1a" stroke-width="2"/>
<line x1="610" y1="140" x2="630" y2="130" stroke="#1a1a1a" stroke-width="2"/>
<line x1="610" y1="180" x2="630" y2="190" stroke="#1a1a1a" stroke-width="2"/>
<line x1="630" y1="130" x2="720" y2="130" stroke="#1a1a1a" stroke-width="3"/>
<line x1="630" y1="190" x2="720" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<rect x="720" y="120" width="80" height="80" rx="6" fill="#d6dbdf" stroke="#566573" stroke-width="2"/>
<text x="570" y="215" class="male" text-anchor="middle">transformator</text>
<text x="570" y="231" class="male" text-anchor="middle">bezpieczeństwa</text>
<text x="675" y="120" class="podt" text-anchor="middle">np. 12 V</text>
<text x="760" y="165" class="male" text-anchor="middle">lampa</text>
<text x="760" y="181" class="male" text-anchor="middle"></text>
<line x1="760" y1="200" x2="760" y2="230" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="760" y1="230" x2="760" y2="244" stroke="#bbbbbb" stroke-width="2"/>
<line x1="747.0" y1="244" x2="773.0" y2="244" stroke="#bbbbbb" stroke-width="2"/>
<line x1="751.5" y1="250" x2="768.5" y2="250" stroke="#bbbbbb" stroke-width="2"/>
<line x1="756.0" y1="256" x2="764.0" y2="256" stroke="#bbbbbb" stroke-width="2"/>
<line x1="742" y1="236" x2="778" y2="262" stroke="#c0392b" stroke-width="3"/>
<line x1="742" y1="262" x2="778" y2="236" stroke="#c0392b" stroke-width="3"/>
<text x="215" y="290" class="male" text-anchor="middle">obwód wtórny bez połączenia z ziemią</text>
<text x="215" y="306" class="male" text-anchor="middle">i z PE; obudowa nieuziemiona</text>
<text x="625" y="290" class="male" text-anchor="middle">ani obwód, ani części dostępne</text>
<text x="625" y="306" class="male" text-anchor="middle">nie są uziemione (PELV — jest uziemienie)</text>
<text x="420" y="380" class="opis" text-anchor="middle">Pojedynczy błąd do ziemi nie zamyka obwodu — przez człowieka nie ma drogi powrotnej do źródła.</text>
</svg>
