<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img" aria-labelledby="t d">
  <title id="t">Rodzaje uziomów</title>
  <desc id="d">Przekrój domu i gruntu. W ławach fundamentowych biegnie uziom fundamentowy — bednarka lub pręt zatopiony w betonie, wyprowadzony do głównej szyny uziemiającej GSU; to najlepszy uziom dla nowego budynku. Dookoła budynku w ziemi, co najmniej 0,5 metra głęboko i około metra od ścian, biegnie uziom otokowy. Z boku pionowy uziom prętowy złożony z łączonych prętów o długości kilku metrów.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="490" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Rodzaje uziomów w domu</text>
<rect x="0" y="250" width="840" height="240" fill="#c9a77c"/>
<rect x="0" y="244" width="840" height="6" fill="#6aa84f"/>
<rect x="260" y="90" width="320" height="160" fill="#fdf6e3" stroke="#7f8c8d" stroke-width="2"/>
<path d="M240 90 L420 30 L600 90 Z" fill="#c0392b" fill-opacity="0.25" stroke="#7f8c8d" stroke-width="2"/>
<rect x="250" y="250" width="50" height="60" fill="#bdc3c7" stroke="#7f8c8d"/>
<rect x="540" y="250" width="50" height="60" fill="#bdc3c7" stroke="#7f8c8d"/>
<rect x="250" y="250" width="340" height="14" fill="#bdc3c7" stroke="#7f8c8d"/>
<line x1="258" y1="295" x2="292" y2="295" stroke="#555" stroke-width="4"/>
<line x1="548" y1="295" x2="582" y2="295" stroke="#555" stroke-width="4"/>
<circle cx="275" cy="295" r="6" fill="#555"/>
<circle cx="565" cy="295" r="6" fill="#555"/>
<line x1="275" y1="295" x2="275" y2="190" stroke="#555" stroke-width="3"/>
<rect x="275" y="175" width="70" height="22" rx="3" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
<text x="310" y="191" class="podt" text-anchor="middle">GSU</text>
<circle cx="200" cy="305" r="7" fill="#555"/>
<circle cx="640" cy="305" r="7" fill="#555"/>
<path d="M200 305 q 20 25 60 30 L580 335 q 40 -5 60 -30" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="715" y1="240" x2="715" y2="420" stroke="#555" stroke-width="6"/>
<rect x="707" y="232" width="16" height="12" fill="#b87333"/>
<line x1="715" y1="232" x2="715" y2="190" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="275" y1="295" x2="150" y2="370" stroke="#333" stroke-width="1"/>
<text x="20" y="370" class="male" text-anchor="start">uziom fundamentowy:</text>
<text x="20" y="386" class="male" text-anchor="start">bednarka lub pręt w ławach,</text>
<text x="20" y="402" class="male" text-anchor="start">w betonie — najlepszy dla nowego domu</text>
<line x1="200" y1="305" x2="150" y2="425" stroke="#333" stroke-width="1"/>
<text x="20" y="430" class="male" text-anchor="start">uziom otokowy: taśma w ziemi dookoła</text>
<text x="20" y="446" class="male" text-anchor="start">budynku, ≥ 0,5 m głęb., ok. 1 m od ścian</text>
<text x="735" y="310" class="male" text-anchor="start">uziom</text>
<text x="735" y="326" class="male" text-anchor="start">prętowy</text>
<text x="735" y="342" class="male" text-anchor="start">(pionowy),</text>
<text x="735" y="358" class="male" text-anchor="start">pręty łączone</text>
<text x="735" y="374" class="male" text-anchor="start">do 3–9 m</text>
<text x="420" y="390" class="male" text-anchor="middle">ławy fundamentowe</text>
</svg>
