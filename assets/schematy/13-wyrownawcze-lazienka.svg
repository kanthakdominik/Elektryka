<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="t d">
  <title id="t">Połączenia wyrównawcze miejscowe w łazience</title>
  <desc id="d">Rzut łazienki: wanna metalowa, grzejnik, rury wody i ogrzewania oraz zacisk ochronny gniazda są połączone żółto-zielonymi przewodami z lokalną szyną połączeń wyrównawczych miejscowych. Dzięki temu wszystkie części, których można dotknąć jednocześnie, mają ten sam potencjał. Przewody co najmniej 2,5 milimetra kwadratowego miedzi z ochroną mechaniczną lub 4 milimetry kwadratowe bez niej.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="500" fill="#ffffff"/>
<text x="420" y="32" class="tytul" text-anchor="middle">Połączenia wyrównawcze miejscowe w łazience</text>
<rect x="40" y="60" width="760" height="350" rx="6" fill="#f4f6f7" stroke="#aab7b8"/>
<rect x="70" y="250" width="260" height="90" rx="30" fill="#ffffff" stroke="#7f8c8d" stroke-width="3"/>
<text x="200" y="300" class="opis" text-anchor="middle">wanna metalowa</text>
<rect x="430" y="120" width="12" height="110" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/>
<rect x="448" y="120" width="12" height="110" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/>
<rect x="466" y="120" width="12" height="110" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/>
<rect x="484" y="120" width="12" height="110" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/>
<rect x="502" y="120" width="12" height="110" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/>
<rect x="520" y="120" width="12" height="110" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/>
<text x="482" y="110" class="opis" text-anchor="middle">grzejnik</text>
<line x1="650" y1="70" x2="650" y2="400" stroke="#7f8c8d" stroke-width="8"/>
<line x1="690" y1="70" x2="690" y2="400" stroke="#2e86c1" stroke-width="8"/>
<text x="670" y="420" class="male" text-anchor="middle">rury woda / CO</text>
<rect x="740" y="160" width="40" height="40" rx="6" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="760" y="225" class="male" text-anchor="middle">PE gniazda</text>
<rect x="340" y="345" width="90" height="40" rx="5" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
<text x="385" y="370" class="male" text-anchor="middle">szyna PWM</text>
<line x1="300" y1="345" x2="360" y2="345" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="300" y1="345" x2="300" y2="330" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="482" y1="232" x2="482" y2="300" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="482" y1="300" x2="415" y2="345" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="650" y1="300" x2="430" y2="365" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="690" y1="320" x2="430" y2="375" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="760" y1="200" x2="760" y2="390" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<line x1="760" y1="390" x2="430" y2="380" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<text x="420" y="460" class="opis" text-anchor="middle">Wszystkie części, których można dotknąć jednocześnie, mają ten sam potencjał — między nimi nie ma napięcia.</text>
<text x="420" y="482" class="male" text-anchor="middle">Przewody: ≥ 2,5 mm² Cu z ochroną mechaniczną, ≥ 4 mm² Cu bez ochrony. Wymagania dla łazienki — moduł 17.</text>
</svg>
