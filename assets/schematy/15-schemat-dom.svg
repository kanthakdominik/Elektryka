<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" role="img" aria-labelledby="t d">
  <title id="t">Dom jednorodzinny — rozdzielnica główna (przykład)</title>
  <desc id="d">Schemat jednokreskowy rozdzielnicy głównej domu: zasilanie WLZ ze złącza przewodem 5 razy 16 milimetrów kwadratowych, rozłącznik główny 63 A 3P, ogranicznik przepięć typu 1+2. RCD 1 4P 40 A 30 mA: oświetlenie parteru, gniazda parteru, gniazda kuchni. RCD 2 4P 40 A 30 mA: oświetlenie piętra, gniazda piętra, łazienki. Osobno: płyta indukcyjna 3P za RCD, pompa ciepła C16 3P za RCD typu wg producenta, wyłącznik C20 3P zasilający podrozdzielnicę garażu przewodem 5 razy 4, obwód zewnętrzny RCBO.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
