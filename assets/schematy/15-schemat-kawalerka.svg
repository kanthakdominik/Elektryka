<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 505" width="840" height="505" role="img" aria-labelledby="t d">
  <title id="t">Kawalerka — zasilanie jednofazowe (przykład)</title>
  <desc id="d">Schemat jednokreskowy rozdzielnicy kawalerki zasilanej jednofazowo: zasilanie z licznika przewodem 3 razy 10 milimetrów kwadratowych, rozłącznik główny 40 A 1P+N, ogranicznik przepięć typu 2. Dalej dwie grupy: RCD 1 40 A 30 mA typu A z obwodami oświetlenia B10 1,5 milimetra kwadratowego i gniazd pokoju B16 2,5; RCD 2 40 A 30 mA typu A z obwodami oświetlenia kuchni i łazienki B10, gniazd kuchni B16 i gniazd łazienki B16. Osobny RCBO B16 30 mA dla pralki i lodówki.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
