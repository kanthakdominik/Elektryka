<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" role="img" aria-labelledby="t d">
  <title id="t">Mieszkanie — zasilanie trójfazowe (przykład)</title>
  <desc id="d">Schemat jednokreskowy rozdzielnicy mieszkania zasilanego trójfazowo: zasilanie z licznika przewodem 5 razy 10 milimetrów kwadratowych, rozłącznik główny 63 A 3P, ogranicznik przepięć typu 2. RCD 1 4P 40 A 30 mA typu A: oświetlenie pokoi B10, gniazda salonu i sypialni B16. RCD 2 4P 40 A 30 mA typu A: oświetlenie kuchni, łazienki i przedpokoju B10, gniazda kuchni B16, gniazda łazienki B16. Płyta indukcyjna B16 3P przewodem 5 razy 2,5 za RCD 4P. RCBO dla pralki, zmywarki i lodówki.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
