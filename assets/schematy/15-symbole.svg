<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 365" width="840" height="365" role="img" aria-labelledby="t d">
  <title id="t">Symbole schematu jednokreskowego</title>
  <desc id="d">Tabela symboli. Pierwszy rząd: rozłącznik główny, bezpiecznik, wyłącznik nadprądowy z krzyżykiem na styku, wyłącznik różnicowoprądowy z elipsą przekładnika, licznik energii jako prostokąt z napisem kWh, ogranicznik przepięć z uziemieniem. Drugi rząd: RCBO jako wyłącznik nadprądowy z elipsą przekładnika, przewód z trzema ukośnymi kreskami oznaczającymi trzy żyły, gniazdo z bolcem, oprawa oświetleniowa jako koło z krzyżykiem, uziemienie, silnik trójfazowy jako koło z literą M zasilany przewodem pięciożyłowym. Symbole uproszczone według PN-EN 60617.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
