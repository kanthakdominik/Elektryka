<text x="605" y="118" class="male" text-anchor="start">grzebień — szyna łączeniowa</text>
<text x="605" y="164" class="male" text-anchor="start">aparaty na szynie TH35</text>
<text x="605" y="274" class="male" text-anchor="start">rezerwa — zaślepki</text>
