<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 515" width="840" height="515" role="img" aria-labelledby="t d">
  <title id="t">Budowa rozdzielnicy mieszkaniowej</title>
  <desc id="d">Widok rozdzielnicy z trzema rzędami szyny TH35. W pierwszym rzędzie rozłącznik, ogranicznik przepięć, wyłącznik różnicowoprądowy i cztery wyłączniki nadprądowe połączone grzebieniem. W drugim rzędzie drugi wyłącznik różnicowoprądowy, trzy wyłączniki nadprądowe, dwa RCBO i wolne miejsca rezerwy z zaślepkami. W trzecim rzędzie dwie osobne listwy N, po jednej dla każdej różnicówki, i wspólna listwa PE. Maskownica zakrywa wszystko poza dźwigniami, opis obwodów na drzwiczkach.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
