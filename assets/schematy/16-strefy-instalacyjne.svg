<text x="94" y="438" class="male" text-anchor="start">strefy poziome: 15–45 cm pod sufitem, 100–130 cm, 15–45 cm nad podłogą</text>
<rect x="60" y="449" width="26" height="16" fill="#f39c12" fill-opacity="0.35" stroke="#f39c12" stroke-width="1.2"/>
<text x="94" y="462" class="male" text-anchor="start">strefy pionowe: 10–30 cm od krawędzi drzwi, okien i narożników</text>
<line x1="60" y1="481" x2="86" y2="481" stroke="#c0392b" stroke-width="3"/>
<text x="94" y="486" class="male" text-anchor="start">przewód w strefie — prosto, poziomo albo pionowo; łącznik ok. 105 cm, gniazdo ok. 30 cm nad podłogą</text>
<text x="420" y="513" class="male" text-anchor="middle">Wymiary wg DIN 18015-3 (Niemcy); w Polsce N SEP-E-002 opisuje tę samą zasadę. Zawsze: prosto, równolegle do krawędzi.</text>
