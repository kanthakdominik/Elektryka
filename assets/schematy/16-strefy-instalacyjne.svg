<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 525" width="840" height="525" role="img" aria-labelledby="t d">
  <title id="t">Strefy instalacyjne w ścianie</title>
  <desc id="d">Widok ściany z drzwiami i oknem. Niebieskie pasy poziome to strefy instalacyjne: 15 do 45 cm pod sufitem, 100 do 130 cm nad podłogą i 15 do 45 cm nad podłogą. Pomarańczowe pasy pionowe biegną 10 do 30 cm od krawędzi drzwi, okien i narożników. Czerwone przewody biegną tylko w strefach, prosto: poziomo pod sufitem i pionowo do łącznika na wysokości około 105 cm oraz do gniazd na wysokości około 30 cm. Przewód poprowadzony na skos jest oznaczony jako błąd.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
