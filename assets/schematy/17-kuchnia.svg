<text x="130" y="95.0" class="male" text-anchor="start">Nad blatem 3–4 gniazda podwójne (np. 100–115 cm nad podłogą)</text>
<text x="130" y="113.0" class="male" text-anchor="start">Płyta, piekarnik, zmywarka — każde na własnym obwodzie</text>
<text x="420" y="446" class="male" text-anchor="middle">Wysokości to praktyka, nie przepis: liczy się dostęp i to, żeby gniazdo nie wypadło za szafką ani nad zlewem.</text>
