<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" role="img" aria-labelledby="t d">
  <title id="t">Kuchnia — rozmieszczenie gniazd</title>
  <desc id="d">Widok ściany kuchni: szafki dolne z blatem na 90 centymetrach, zlew i płyta, szafki górne, okap i lodówka. Nad blatem cztery gniazda na wysokości około 110 centymetrów, nie tuż nad zlewem. Za urządzeniami w szafkach dolnych gniazda na około 40 centymetrach dla zmywarki i piekarnika. Pod płytą na wysokości około 70 centymetrów puszka przyłączeniowa płyty, zasilanej trójfazowo przewodem pięciożyłowym. Gniazdo okapu w szafce okapowej, gniazdo lodówki nad nią. Płyta, piekarnik i zmywarka mają osobne obwody. Wysokości to praktyka, nie przepis.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
