<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 485" width="840" height="485" role="img" aria-labelledby="t d">
  <title id="t">Rozdzielnica budowlana</title>
  <desc id="d">Rozdzielnica budowlana w żółtej obudowie o stopniu ochrony co najmniej IP44. U góry rozłącznik główny z możliwością zablokowania kłódką. Pod nim dwa wyłączniki różnicowoprądowe: 30 miliamperów dla obwodów gniazd do 32 amperów i do 500 miliamperów dla obwodów powyżej 32 amperów. Dalej wyłączniki nadprądowe B16, B16, C16 i trójfazowy C32. Na dole gniazda z klapkami: zwykłe 230 V 16 A, CEE niebieskie 16 A i czerwone pięciobiegunowe 16 i 32 A. Z boku: zasilanie z przyłącza budowy, przewody giętkie w izolacji gumowej typu H07RN-F, regularne przeglądy, obudowa zamykana na klucz. Wymagania według PN-HD 60364-7-704 i PN-EN 61439-4.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
