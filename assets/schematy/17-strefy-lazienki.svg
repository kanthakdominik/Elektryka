<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 525" width="840" height="525" role="img" aria-labelledby="t d">
  <title id="t">Strefy w łazience</title>
  <desc id="d">Po lewej wanna z boku: strefa 0 to wnętrze wanny, strefa 1 to przestrzeń nad wanną do wysokości 2,25 metra, strefa 2 to pas szerokości 0,6 metra wokół strefy 1, też do 2,25 metra. Po prawej prysznic bez brodzika z góry: strefa 1 sięga 1,2 metra od wylotu wody i nie ma strefy 2. Tabela: strefa 0 tylko urządzenia stałe SELV do 12 V, IPX7; strefa 1 stałe odbiorniki przystosowane i SELV do 25 V, bez gniazd, IPX4; strefa 2 oprawy i wentylatory, z gniazd tylko gniazdo golarki, IPX4; poza strefami gniazda 230 V, najlepiej IP44, zawsze za RCD 30 mA.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="525" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Strefy w łazience (PN-HD 60364-7-701)</text>
<text x="210" y="60" class="podt" text-anchor="middle">Wanna — widok z boku</text>
<rect x="30" y="105.0" width="60" height="225.0" fill="#f39c12" fill-opacity="0.25" stroke="#f39c12" stroke-width="1.2"/>
<rect x="260" y="105.0" width="60" height="225.0" fill="#f39c12" fill-opacity="0.25" stroke="#f39c12" stroke-width="1.2"/>
<rect x="90" y="105.0" width="170" height="225.0" fill="#3498db" fill-opacity="0.22" stroke="#3498db" stroke-width="1.2"/>
<path d="M90 275 L98 326 L252 326 L260 275 Z" fill="#2e86c1" fill-opacity="0.55" stroke="#1b4f72" stroke-width="2"/>
<line x1="20" y1="330" x2="390" y2="330" stroke="#5d4037" stroke-width="4"/>
<text x="175.0" y="305" class="duze" text-anchor="middle" style="fill:#ffffff">0</text>
<text x="175.0" y="165.0" class="duze" text-anchor="middle" style="fill:#1b4f72">1</text>
<text x="60" y="165.0" class="duze" text-anchor="middle" style="fill:#b9770e">2</text>
<text x="290" y="165.0" class="duze" text-anchor="middle" style="fill:#b9770e">2</text>
<line x1="335" y1="330" x2="335" y2="105.0" stroke="#555" stroke-width="1.3"/><path d="M335.0 105.0 L338.5 113.3 L331.5 113.3 Z" fill="#555"/><path d="M335.0 330.0 L331.5 321.7 L338.5 321.7 Z" fill="#555"/>
<text x="342" y="217.5" class="male" text-anchor="start">2,25 m</text>
<line x1="260" y1="93.0" x2="320" y2="93.0" stroke="#555" stroke-width="1.3"/><path d="M320.0 93.0 L311.7 96.5 L311.7 89.5 Z" fill="#555"/><path d="M260.0 93.0 L268.3 89.5 L268.3 96.5 Z" fill="#555"/>
<text x="290" y="87.0" class="male" text-anchor="middle">0,6 m</text>
<text x="230" y="352" class="male" text-anchor="middle">strefa 1 sięga 2,25 m nad podłogę (albo wyżej, do głowicy prysznica)</text>
<text x="630" y="60" class="podt" text-anchor="middle">Prysznic bez brodzika — z góry</text>
<rect x="460" y="70" width="340" height="260" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="3"/>
<path d="M460 70 L580 70 A120 120 0 0 1 460 190 Z" fill="#3498db" fill-opacity="0.25" stroke="#2e86c1"/>
<circle cx="465" cy="75" r="9" fill="#5d6d7e"/>
<text x="480" y="120" class="duze" text-anchor="middle" style="fill:#1b4f72">1</text>
<line x1="465" y1="75" x2="550" y2="160" stroke="#555" stroke-width="1.3"/><path d="M550.0 160.0 L541.7 156.6 L546.6 151.7 Z" fill="#555"/>
<text x="562" y="154" class="male" text-anchor="start">1,2 m od</text>
<text x="562" y="170" class="male" text-anchor="start">wylotu wody</text>
<text x="630" y="270" class="male" text-anchor="middle">brak strefy 2 —</text>
<text x="630" y="286" class="male" text-anchor="middle">strefa 1 jest powiększona</text>
<text x="480" y="88" class="male" text-anchor="start">wylot wody</text>
<rect x="30" y="363" width="780" height="24" fill="#eaecee"/>
<text x="40" y="380" class="male" text-anchor="start" style="font-weight:bold">strefa</text>
<text x="110" y="380" class="male" text-anchor="start" style="font-weight:bold">gdzie</text>
<text x="300" y="380" class="male" text-anchor="start" style="font-weight:bold">co wolno (w skrócie)</text>
<text x="740" y="380" class="male" text-anchor="start" style="font-weight:bold">IP</text>
<text x="40" y="404" class="male" text-anchor="start">0</text>
<text x="110" y="404" class="male" text-anchor="start">wnętrze wanny / brodzika</text>
<text x="300" y="404" class="male" text-anchor="start">tylko urządzenia stałe SELV ≤ 12 V AC</text>
<text x="740" y="404" class="male" text-anchor="start">IPX7</text>
<text x="40" y="428" class="male" text-anchor="start">1</text>
<text x="110" y="428" class="male" text-anchor="start">nad wanną do 2,25 m</text>
<text x="300" y="428" class="male" text-anchor="start">stałe odbiorniki przystosowane, SELV ≤ 25 V; bez gniazd</text>
<text x="740" y="428" class="male" text-anchor="start">IPX4</text>
<text x="40" y="452" class="male" text-anchor="start">2</text>
<text x="110" y="452" class="male" text-anchor="start">0,6 m poza strefą 1</text>
<text x="300" y="452" class="male" text-anchor="start">oprawy, wentylatory; z gniazd — tylko gniazdo golarki</text>
<text x="740" y="452" class="male" text-anchor="start">IPX4</text>
<text x="40" y="476" class="male" text-anchor="start">poza</text>
<text x="110" y="476" class="male" text-anchor="start">reszta łazienki</text>
<text x="300" y="476" class="male" text-anchor="start">gniazda 230 V (lepiej IP44), zawsze RCD 30 mA</text>
<text x="740" y="476" class="male" text-anchor="start">—</text>
<text x="420" y="512" class="male" text-anchor="middle">Wymiary i dopuszczenia wg PN-HD 60364-7-701:2010 — w wodzie bijącej strumieniem (natryski) IPX5.</text>
</svg>
