<line x1="545" y1="110" x2="545" y2="124" stroke="#8b4513" stroke-width="2.5"/>
<rect x="529" y="124" width="32" height="32" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
