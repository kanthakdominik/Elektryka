<line x1="545" y1="156" x2="545" y2="180" stroke="#e67e22" stroke-width="2.5"/>
<line x1="620" y1="110" x2="620" y2="124" stroke="#8b4513" stroke-width="2.5"/>
<rect x="604" y="124" width="32" height="32" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="620" cy="140" r="7" fill="#d5d8dc" stroke="#1a1a1a"/>
<line x1="620" y1="156" x2="620" y2="180" stroke="#e67e22" stroke-width="2.5"/>
<line x1="695" y1="110" x2="695" y2="124" stroke="#8b4513" stroke-width="2.5"/>
<rect x="679" y="124" width="32" height="32" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="695" cy="140" r="7" fill="#d5d8dc" stroke="#1a1a1a"/>
<line x1="695" y1="156" x2="695" y2="180" stroke="#e67e22" stroke-width="2.5"/>
<line x1="470" y1="180" x2="760" y2="180" stroke="#e67e22" stroke-width="2.5"/>
<text x="615" y="198" class="male" text-anchor="middle" style="fill:#e67e22">sterowanie — 1 żyła wspólna</text>
<rect x="740" y="210" width="60" height="60" rx="6" fill="#d6eaf8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="770" y="236" class="podt" text-anchor="middle">BIS</text>
<text x="770" y="254" class="male" text-anchor="middle">w rozdz.</text>
<line x1="760" y1="180" x2="760" y2="210" stroke="#e67e22" stroke-width="2.5"/>
<line x1="770" y1="270" x2="770" y2="290" stroke="#8b4513" stroke-width="2.5"/>
<circle cx="770" cy="306" r="14" fill="#fffbe6" stroke="#1a1a1a" stroke-width="2"/>
<line x1="760.2" y1="296.2" x2="779.8" y2="315.8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="760.2" y1="315.8" x2="779.8" y2="296.2" stroke="#1a1a1a" stroke-width="2"/>
<text x="450" y="280" class="male" text-anchor="start">• przyciski łączone równolegle — ile chcesz</text>
<text x="450" y="302" class="male" text-anchor="start">• do przycisku wystarczy przewód 2-żyłowy</text>
<text x="450" y="324" class="male" text-anchor="start">• przekaźnik (BIS) w rozdzielnicy lub puszce</text>
<text x="450" y="346" class="male" text-anchor="start">• łatwo dodać „wyłącz wszystko” lub automat</text>
<text x="450" y="368" class="male" text-anchor="start">• cichy klik w przekaźniku przy każdym impulsie</text>
<line x1="420" y1="60" x2="420" y2="400" stroke="#d5d8dc" stroke-width="1.5"/>
<text x="420" y="430" class="male" text-anchor="middle">Przy 3+ miejscach przekaźnik impulsowy zwykle wygrywa: prostsze okablowanie i łatwiejsza rozbudowa.</text>
</svg>
