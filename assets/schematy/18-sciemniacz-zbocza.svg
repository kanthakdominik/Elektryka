<text x="630" y="310" class="male" text-anchor="middle">włącza od zera, wyłącza w środku — łagodniej</text>
<text x="210" y="290" class="male" text-anchor="middle">dla żarówek i transformatorów</text>
<text x="210" y="290" class="male" text-anchor="start"></text>
<text x="630" y="290" class="male" text-anchor="middle">zwykle lepszy dla LED i zasilaczy elektronicznych</text>
<rect x="20" y="355" width="800" height="78" rx="8" fill="#fef9e7" stroke="#f4d03f"/>
<text x="40" y="380" class="opis" text-anchor="start">Pomarańczowe pole = czas, gdy prąd płynie do lampy. Im mniej pola, tym ciemniej.</text>
<text x="40" y="403" class="opis" text-anchor="start">Uniwersalne ściemniacze („RLC”, „LED”) wybierają tryb same albo przełącznikiem. Zawsze sprawdź</text>
<text x="40" y="424" class="opis" text-anchor="start">na liście zgodności producenta: moc minimalną i maksymalną dla LED (zwykle dużo mniejszą niż dla żarówek).</text>
</svg>
