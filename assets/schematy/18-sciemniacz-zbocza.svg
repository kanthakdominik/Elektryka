<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 445" width="840" height="445" role="img" aria-labelledby="t d">
  <title id="t">Zbocza ściemniacza</title>
  <desc id="d">Dwa wykresy sinusoidy napięcia sieci. Po lewej ściemniacz z obcinaniem zbocza narastającego, oznaczany RL: przewodzi od środka każdego półokresu do jego końca, co daje ostry skok prądu, dobry dla żarówek i transformatorów. Po prawej ściemniacz z obcinaniem zbocza opadającego, oznaczany RC: przewodzi od zera do środka półokresu i łagodnie wyłącza, zwykle lepszy dla LED i zasilaczy elektronicznych. Pomarańczowe pole to czas przepływu prądu. Ściemniacze uniwersalne wybierają tryb same; zawsze trzeba sprawdzić listę zgodności i moc minimalną oraz maksymalną dla LED.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
