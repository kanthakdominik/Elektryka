<circle cx="160" cy="98" r="8" fill="#ecf0f1" stroke="#8b4513" stroke-width="2"/>
<line x1="200" y1="80" x2="200" y2="110" stroke="#c0392b" stroke-width="1.3"/><path d="M200.0 110.0 L196.5 101.7 L203.5 101.7 Z" fill="#c0392b"/><path d="M200.0 80.0 L203.5 88.3 L196.5 88.3 Z" fill="#c0392b"/>
<text x="206" y="100" class="male" text-anchor="start" style="fill:#c0392b">głęb. ≤ 30 mm</text>
<line x1="140" y1="72" x2="180" y2="72" stroke="#555" stroke-width="1.2"/><path d="M180.0 72.0 L171.7 75.5 L171.7 68.5 Z" fill="#555"/><path d="M140.0 72.0 L148.3 68.5 L148.3 75.5 Z" fill="#555"/>
