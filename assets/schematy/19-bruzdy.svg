<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 530" width="840" height="530" role="img" aria-labelledby="t d">
  <title id="t">Bruzdy w ścianach murowanych</title>
  <desc id="d">Lewa góra: przekrój ściany z bruzdą o głębokości do 30 milimetrów i przewodem. Prawa góra: tabela bruzd pionowych w gotowym murze — głębokość zawsze do 30 mm, szerokość od 100 mm przy ścianie 85–115 mm do 200 mm przy ścianach powyżej 225 mm. Prawa dół: bruzdy poziome i ukośne — w ścianach do 115 mm niedozwolone, przy 116–175 mm tylko krótkie do 1,25 m i 15 mm, przy 176–225 mm 10 mm lub 20 mm dla krótkich, przy 226–300 mm 15 lub 25 mm, powyżej 300 mm 20 lub 30 mm. Lewa dół: bruzdy poziome tylko w pasie jednej ósmej wysokości ściany przy stropie, nie w połowie wysokości. Źródło: PN-EN 1996-1-1, punkt 8.6.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="530" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Bruzdy w ścianie murowanej — ile wolno bez obliczeń</text>
<text x="170" y="62" class="podt" text-anchor="middle">Przekrój ściany (z góry)</text>
