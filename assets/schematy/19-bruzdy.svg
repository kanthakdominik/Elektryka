<rect x="40" y="401" width="260" height="19" fill="#3498db" fill-opacity="0.25"/>
<text x="170" y="284" class="male" text-anchor="middle">≤ h/8 pod stropem</text>
<text x="170" y="415" class="male" text-anchor="middle">≤ h/8 nad stropem (podłogą)</text>
<line x1="60" y1="345" x2="280" y2="345" stroke="#7b241c" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="170" y="338" class="male" text-anchor="middle" style="fill:#7b241c">✗ w połowie wysokości ściany</text>
<rect x="40" y="440" width="760" height="76" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="60" y="462" class="male" text-anchor="start">Wg PN-EN 1996-1-1 (Eurokod 6), p. 8.6. W ścianach cieńszych niż 85 mm — bez obliczeń bruzd nie wolno.</text>
<text x="60" y="482" class="male" text-anchor="start">Bruzda pozioma co najmniej 0,5 m od otworu (okna, drzwi). Większe bruzdy — tylko po sprawdzeniu przez konstruktora.</text>
<text x="60" y="502" class="male" text-anchor="start">Wycinaj bruzdownicą, nie kuj młotem; w ścianach > 150 mm bruzdy cięte maszynowo mogą być o 10 mm głębsze.</text>
</svg>
