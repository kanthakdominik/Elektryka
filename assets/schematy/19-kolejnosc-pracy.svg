<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t d">
  <title id="t">Kolejność pracy przy instalacji</title>
  <desc id="d">Osiem kroków w dwóch rzędach. Czerwone: 1 wyłącz właściwy wyłącznik, 2 zabezpiecz przed załączeniem kartką i kłódką, 3 sprawdź brak napięcia próbnikiem dwubiegunowym między L, N i PE. Niebieskie: 4 zrób zdjęcie połączeń, 5 odłącz i podłącz w kolejności PE, N, L, 6 sprawdź połączenia i ułóż przewody. Zielone: 7 załącz i sprawdź działanie oraz przycisk TEST, 8 przy zmianie instalacji pomiary wykonuje elektryk z miernikiem. Odłączanie w odwrotnej kolejności: L, N, PE.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="400" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Każda praca przy instalacji — ta sama kolejność</text>
<rect x="20" y="60" width="190" height="115" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="48" cy="90" r="17" fill="#c0392b"/>
<text x="48" y="96" class="podt" text-anchor="middle" style="fill:#ffffff">1</text>
<text x="74" y="96" class="podt" text-anchor="start">Wyłącz</text>
<text x="34" y="126" class="male" text-anchor="start">właściwy wyłącznik w</text>
<text x="34" y="143" class="male" text-anchor="start">rozdzielnicy</text>
<line x1="211" y1="117" x2="224" y2="117" stroke="#7f8c8d" stroke-width="2"/><path d="M224.0 117.0 L215.7 120.5 L215.7 113.5 Z" fill="#7f8c8d"/>
<rect x="225" y="60" width="190" height="115" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="253" cy="90" r="17" fill="#c0392b"/>
<text x="253" y="96" class="podt" text-anchor="middle" style="fill:#ffffff">2</text>
<text x="279" y="96" class="podt" text-anchor="start">Zabezpiecz</text>
<text x="239" y="126" class="male" text-anchor="start">kartka „Nie załączać”,</text>
<text x="239" y="143" class="male" text-anchor="start">kłódka</text>
<line x1="416" y1="117" x2="429" y2="117" stroke="#7f8c8d" stroke-width="2"/><path d="M429.0 117.0 L420.7 120.5 L420.7 113.5 Z" fill="#7f8c8d"/>
<rect x="430" y="60" width="190" height="115" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="458" cy="90" r="17" fill="#c0392b"/>
<text x="458" y="96" class="podt" text-anchor="middle" style="fill:#ffffff">3</text>
<text x="484" y="96" class="podt" text-anchor="start">Sprawdź</text>
<text x="444" y="126" class="male" text-anchor="start">brak napięcia próbnikiem</text>
<text x="444" y="143" class="male" text-anchor="start">dwubiegunowym: L–N,</text>
<text x="444" y="160" class="male" text-anchor="start">L–PE, N–PE</text>
<line x1="621" y1="117" x2="634" y2="117" stroke="#7f8c8d" stroke-width="2"/><path d="M634.0 117.0 L625.7 120.5 L625.7 113.5 Z" fill="#7f8c8d"/>
<rect x="635" y="60" width="190" height="115" rx="10" fill="#eaf2f8" stroke="#2e86c1" stroke-width="1.4"/>
<circle cx="663" cy="90" r="17" fill="#2e86c1"/>
<text x="663" y="96" class="podt" text-anchor="middle" style="fill:#ffffff">4</text>
<text x="689" y="96" class="podt" text-anchor="start">Zdjęcie</text>
<text x="649" y="126" class="male" text-anchor="start">połączeń przed</text>
<text x="649" y="143" class="male" text-anchor="start">odkręceniem</text>
<rect x="20" y="210" width="190" height="115" rx="10" fill="#eaf2f8" stroke="#2e86c1" stroke-width="1.4"/>
<circle cx="48" cy="240" r="17" fill="#2e86c1"/>
<text x="48" y="246" class="podt" text-anchor="middle" style="fill:#ffffff">5</text>
<text x="74" y="246" class="podt" text-anchor="start">Podłącz</text>
<text x="34" y="276" class="male" text-anchor="start">odłącz stare; podłącz PE</text>
<text x="34" y="293" class="male" text-anchor="start">→ N → L, dokręć zaciski</text>
<line x1="211" y1="267" x2="224" y2="267" stroke="#7f8c8d" stroke-width="2"/><path d="M224.0 267.0 L215.7 270.5 L215.7 263.5 Z" fill="#7f8c8d"/>
<rect x="225" y="210" width="190" height="115" rx="10" fill="#eaf2f8" stroke="#2e86c1" stroke-width="1.4"/>
<circle cx="253" cy="240" r="17" fill="#2e86c1"/>
<text x="253" y="246" class="podt" text-anchor="middle" style="fill:#ffffff">6</text>
<text x="279" y="246" class="podt" text-anchor="start">Kontrola</text>
<text x="239" y="276" class="male" text-anchor="start">pociągnij każdą żyłę,</text>
<text x="239" y="293" class="male" text-anchor="start">ułóż przewody w puszce</text>
<line x1="416" y1="267" x2="429" y2="267" stroke="#7f8c8d" stroke-width="2"/><path d="M429.0 267.0 L420.7 270.5 L420.7 263.5 Z" fill="#7f8c8d"/>
<rect x="430" y="210" width="190" height="115" rx="10" fill="#e9f7ef" stroke="#239b56" stroke-width="1.4"/>
<circle cx="458" cy="240" r="17" fill="#239b56"/>
<text x="458" y="246" class="podt" text-anchor="middle" style="fill:#ffffff">7</text>
<text x="484" y="246" class="podt" text-anchor="start">Załącz</text>
<text x="444" y="276" class="male" text-anchor="start">sprawdź działanie i TEST</text>
<text x="444" y="293" class="male" text-anchor="start">różnicówki</text>
<line x1="621" y1="267" x2="634" y2="267" stroke="#7f8c8d" stroke-width="2"/><path d="M634.0 267.0 L625.7 270.5 L625.7 263.5 Z" fill="#7f8c8d"/>
<rect x="635" y="210" width="190" height="115" rx="10" fill="#e9f7ef" stroke="#239b56" stroke-width="1.4"/>
<circle cx="663" cy="240" r="17" fill="#239b56"/>
<text x="663" y="246" class="podt" text-anchor="middle" style="fill:#ffffff">8</text>
<text x="689" y="246" class="podt" text-anchor="start">Pomiary</text>
<text x="649" y="276" class="male" text-anchor="start">przy zmianie instalacji</text>
<text x="649" y="293" class="male" text-anchor="start">— elektryk z miernikiem</text>
<path d="M730 175 L730 192 L115 192 L115 206" fill="none" stroke="#7f8c8d" stroke-width="2"/>
<path d="M115 210 l-6 -9 l12 0 Z" fill="#7f8c8d"/>
<text x="420" y="360" class="opis" text-anchor="middle">Czerwone kroki to zasady bezpieczeństwa z modułu 00 — bez nich nie zaczynaj.</text>
<text x="420" y="382" class="opis" text-anchor="middle">Odłączanie w odwrotnej kolejności: L → N → PE (PE odłączasz ostatni).</text>
</svg>
