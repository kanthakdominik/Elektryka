<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 510" width="840" height="510" role="img" aria-labelledby="t d">
  <title id="t">Nowy obwód w rozdzielnicy</title>
  <desc id="d">Widok rozdzielnicy: dwie różnicówki RCD 1 i RCD 2, za RCD 2 grzebień zasilający cztery wyłączniki nadprądowe, ostatni B16 jest nowy. Nowy przewód 3 × 2,5: żyła L do dolnego zacisku nowego wyłącznika, żyła N do listwy N grupy RCD 2, żyła PE do wspólnej listwy PE. Po prawej kolejność: wyłącz rozłącznik główny i sprawdź brak napięcia, wprowadź przewód z zapasem, podłącz PE, N do listwy właściwej grupy, L do wyłącznika, opisz obwód, wykonaj pomiary. Ostrzeżenie: N nowego obwodu tylko do listwy N różnicówki, za którą jest jego wyłącznik.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="510" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Nowy obwód w rozdzielnicy — co gdzie podłączyć</text>
<rect x="30" y="55" width="560" height="380" rx="12" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="1.4"/>
<line x1="290" y1="90" x2="520" y2="90" stroke="#8b4513" stroke-width="5"/>
<path d="M240 175 L240 190 L290 190 L290 90" fill="none" stroke="#8b4513" stroke-width="3"/>
<text x="300" y="82" class="male" text-anchor="start">grzebień L zasilany z RCD 2</text>
<rect x="70" y="105" width="80" height="70" rx="5" fill="#d6eaf8" stroke="#555"/>
<text x="110" y="145" class="podt" text-anchor="middle">RCD 1</text>
<rect x="200" y="105" width="80" height="70" rx="5" fill="#d6eaf8" stroke="#555"/>
<text x="240" y="145" class="podt" text-anchor="middle">RCD 2</text>
<rect x="300" y="105" width="42" height="70" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
<text x="321" y="145" class="male" text-anchor="middle">B10</text>
<line x1="321" y1="90" x2="321" y2="105" stroke="#8b4513" stroke-width="3"/>
<rect x="350" y="105" width="42" height="70" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
<text x="371" y="145" class="male" text-anchor="middle">B16</text>
<line x1="371" y1="90" x2="371" y2="105" stroke="#8b4513" stroke-width="3"/>
<rect x="400" y="105" width="42" height="70" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
<text x="421" y="145" class="male" text-anchor="middle">B16</text>
<line x1="421" y1="90" x2="421" y2="105" stroke="#8b4513" stroke-width="3"/>
<rect x="450" y="105" width="42" height="70" rx="5" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
<text x="471" y="145" class="male" text-anchor="middle">B16</text>
<line x1="471" y1="90" x2="471" y2="105" stroke="#8b4513" stroke-width="3"/>
<text x="471" y="196" class="male" text-anchor="middle" style="fill:#e67e22;font-weight:bold">nowy</text>
<rect x="60" y="250" width="150" height="20" rx="3" fill="#3498db"/>
<text x="135" y="265" class="male" text-anchor="middle" style="fill:#ffffff">N — grupa RCD 1</text>
<rect x="230" y="250" width="150" height="20" rx="3" fill="#3498db"/>
<text x="305" y="265" class="male" text-anchor="middle" style="fill:#ffffff">N — grupa RCD 2</text>
<rect x="60" y="300" width="500" height="20" rx="3" fill="#27ae60"/>
<text x="310" y="315" class="male" text-anchor="middle" style="fill:#ffffff">PE — wspólna</text>
<line x1="471" y1="175" x2="471" y2="410" stroke="#8b4513" stroke-width="3.5"/>
<path d="M457 410 L457 285 L360 285 L360 270" fill="none" stroke="#1f5fbf" stroke-width="3.5"/>
<line x1="485" y1="410" x2="485" y2="320" stroke="#27ae60" stroke-width="3.5"/>
<line x1="485" y1="410" x2="485" y2="320" stroke="#f1c40f" stroke-width="3.5" stroke-dasharray="8 8"/>
<rect x="441" y="410" width="60" height="22" rx="8" fill="#ecf0f1" stroke="#7f8c8d"/>
<text x="471" y="426" class="male" text-anchor="middle">3 × 2,5</text>
<text x="610" y="70" class="male" text-anchor="start">Kolejność:</text>
<text x="610" y="91" class="male" text-anchor="start">1. wyłącz rozłącznik główny,</text>
<text x="610" y="112" class="male" text-anchor="start">    sprawdź brak napięcia</text>
<text x="610" y="133" class="male" text-anchor="start">2. wprowadź przewód,</text>
<text x="610" y="154" class="male" text-anchor="start">    zostaw zapas</text>
<text x="610" y="175" class="male" text-anchor="start">3. PE → listwa PE</text>
<text x="610" y="196" class="male" text-anchor="start">4. N → listwa N tej grupy,</text>
<text x="610" y="217" class="male" text-anchor="start">    do której należy wyłącznik</text>
<text x="610" y="238" class="male" text-anchor="start">5. L → dolny zacisk</text>
<text x="610" y="259" class="male" text-anchor="start">    nowego wyłącznika</text>
<text x="610" y="280" class="male" text-anchor="start">6. opis na maskownicy</text>
<text x="610" y="301" class="male" text-anchor="start">    i w schemacie</text>
<text x="610" y="322" class="male" text-anchor="start">7. pomiary: izolacja, PE,</text>
<text x="610" y="343" class="male" text-anchor="start">    pętla, RCD</text>
<rect x="30" y="450" width="790" height="48" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<text x="425" y="479" class="male" text-anchor="middle">⚠ N nowego obwodu — tylko do listwy N tej różnicówki, za którą jest jego wyłącznik. Inaczej RCD będą wybijać.</text>
</svg>
