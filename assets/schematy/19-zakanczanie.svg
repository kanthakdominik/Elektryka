<text x="40" y="434" class="male" text-anchor="start">Długość odizolowania — jak podaje producent (typowo 10–12 mm dla aparatów modułowych). Moment z instrukcji,</text>
<text x="40" y="454" class="male" text-anchor="start">np. 2 N·m (wyłączniki do 25 A) i 3,5 N·m (32–63 A) u jednego producenta, 2,8 N·m u innego. Potem pociągnij przewód.</text>
<text x="40" y="474" class="male" text-anchor="start">Dwa przewody w jednym zacisku — tylko jeśli producent na to pozwala i tylko tego samego rodzaju i przekroju.</text>
