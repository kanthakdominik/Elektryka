<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="t d">
  <title id="t">Zakańczanie przewodów</title>
  <desc id="d">Sześć przykładów zakończenia przewodu w zacisku śrubowym. Dobrze: drut odizolowany na długość zacisku; linka zaciśnięta w tulejce. Źle: przewód odizolowany za długo, z gołą miedzią poza zaciskiem; izolacja wciśnięta pod śrubę; linka bez tulejki z rozplecionymi drucikami poza zaciskiem; dwa przewody o różnym przekroju w jednym zacisku, cieńszy niedociśnięty. Pod spodem: długość odizolowania według producenta, typowo 10–12 mm, moment dokręcania z instrukcji, na przykład 2 N·m dla wyłączników do 25 A i 3,5 N·m dla 32–63 A u jednego producenta, 2,8 N·m u innego; po dokręceniu pociągnąć przewód; dwa przewody w zacisku tylko gdy producent pozwala.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
