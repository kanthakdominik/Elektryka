<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" role="img" aria-labelledby="t d">
  <title id="t">Żarzenie się LED</title>
  <desc id="d">Trzy przyczyny świecenia lub mrugania wyłączonej lampy LED. Pierwsza: łącznik w przewodzie N, lampa stale ma fazę, upływ ładuje kondensator zasilacza i daje błyski; groźne przy wymianie żarówki. Druga: łącznik z podświetleniem, mały prąd podświetlenia płynie przez lampę także po wyłączeniu; wyjście: łącznik bez podświetlenia lub z przewodem N. Trzecia: długi przewód, faza przenika przez pojemność między żyłami do przewodu łącznikowego; wyjście: obciążenie bazowe lub inna żarówka. Pierwszą przyczynę sprawdza się w pierwszej kolejności, bo jest niebezpieczna.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="430" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Dlaczego wyłączona LED się żarzy lub mruga</text>
<rect x="20" y="50" width="260" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="150" y="76" class="podt" text-anchor="middle">1. Łącznik w przewodzie N</text>
<line x1="40" y1="120" x2="220" y2="120" stroke="#8b4513" stroke-width="3"/>
<text x="38" y="112" class="male" text-anchor="start" style="fill:#8b4513">L</text>
<circle cx="220" cy="160" r="16" fill="#fffbe6" stroke="#1a1a1a" stroke-width="2"/>
<line x1="208.8" y1="148.8" x2="231.2" y2="171.2" stroke="#1a1a1a" stroke-width="2"/>
<line x1="208.8" y1="171.2" x2="231.2" y2="148.8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="220" y1="120" x2="220" y2="144" stroke="#8b4513" stroke-width="3"/>
<line x1="220" y1="176" x2="220" y2="240" stroke="#1f5fbf" stroke-width="3"/>
<line x1="220" y1="240" x2="150" y2="240" stroke="#1f5fbf" stroke-width="3"/>
<circle cx="150" cy="240" r="4" fill="#1a1a1a"/>
<line x1="150" y1="240" x2="115" y2="222" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="110" y1="240" x2="40" y2="240" stroke="#1f5fbf" stroke-width="3"/>
<text x="38" y="232" class="male" text-anchor="start" style="fill:#1f5fbf">N</text>
<text x="34" y="280" class="male" text-anchor="start">Lampa stale na fazie, upływ do</text>
<text x="34" y="297" class="male" text-anchor="start">PE ładuje kondensator zasilacza</text>
<text x="34" y="314" class="male" text-anchor="start">→ błyski co kilka sekund.</text>
<text x="34" y="331" class="male" text-anchor="start">Groźne przy wymianie żarówki!</text>
<rect x="290" y="50" width="260" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="420" y="76" class="podt" text-anchor="middle">2. Łącznik z podświetleniem</text>
<line x1="310" y1="120" x2="380" y2="120" stroke="#8b4513" stroke-width="3"/>
<text x="308" y="112" class="male" text-anchor="start" style="fill:#8b4513">L</text>
<circle cx="380" cy="120" r="4" fill="#1a1a1a"/>
<line x1="380" y1="120" x2="415" y2="102" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="420" y1="120" x2="490" y2="120" stroke="#8b4513" stroke-width="3"/>
<rect x="390" y="135" width="26" height="14" rx="3" fill="#f9e79f" stroke="#b7950b"/>
<line x1="380" y1="120" x2="380" y2="142" stroke="#b7950b" stroke-width="1.5"/>
<line x1="380" y1="142" x2="390" y2="142" stroke="#b7950b" stroke-width="1.5"/>
<line x1="416" y1="142" x2="426" y2="142" stroke="#b7950b" stroke-width="1.5"/>
<line x1="426" y1="142" x2="426" y2="120" stroke="#b7950b" stroke-width="1.5"/>
<text x="403" y="166" class="male" text-anchor="middle">neonówka/LED ~ mA</text>
<circle cx="490" cy="170" r="16" fill="#fffbe6" stroke="#1a1a1a" stroke-width="2"/>
<line x1="478.8" y1="158.8" x2="501.2" y2="181.2" stroke="#1a1a1a" stroke-width="2"/>
<line x1="478.8" y1="181.2" x2="501.2" y2="158.8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="490" y1="120" x2="490" y2="154" stroke="#8b4513" stroke-width="3"/>
<line x1="490" y1="186" x2="490" y2="240" stroke="#1f5fbf" stroke-width="3"/>
<text x="304" y="280" class="male" text-anchor="start">Mały prąd podświetlenia płynie</text>
<text x="304" y="297" class="male" text-anchor="start">przez lampę także po wyłączeniu</text>
<text x="304" y="314" class="male" text-anchor="start">→ żarzenie, mruganie. Wyjście:</text>
<text x="304" y="331" class="male" text-anchor="start">łącznik bez podświetlenia lub z N.</text>
<rect x="560" y="50" width="260" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="690" y="76" class="podt" text-anchor="middle">3. Długi przewód</text>
<line x1="580" y1="120" x2="800" y2="120" stroke="#8b4513" stroke-width="3"/>
<text x="578" y="112" class="male" text-anchor="start" style="fill:#8b4513">L</text>
<line x1="600" y1="150" x2="760" y2="150" stroke="#1a1a1a" stroke-width="3"/>
<line x1="600" y1="124" x2="600" y2="146" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="630" y1="124" x2="630" y2="146" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="660" y1="124" x2="660" y2="146" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="690" y1="124" x2="690" y2="146" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="720" y1="124" x2="720" y2="146" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="750" y1="124" x2="750" y2="146" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="680" y="172" class="male" text-anchor="middle" style="fill:#8e44ad">pojemność między żyłami</text>
<circle cx="585" cy="120" r="4" fill="#1a1a1a"/>
<line x1="585" y1="120" x2="597" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>
<circle cx="600" cy="150" r="4" fill="#1a1a1a"/>
<text x="578" y="196" class="male" text-anchor="start">łącznik (wył.)</text>
<circle cx="760" cy="214" r="16" fill="#fffbe6" stroke="#1a1a1a" stroke-width="2"/>
<line x1="748.8" y1="202.8" x2="771.2" y2="225.2" stroke="#1a1a1a" stroke-width="2"/>
<line x1="748.8" y1="225.2" x2="771.2" y2="202.8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="760" y1="150" x2="760" y2="198" stroke="#1a1a1a" stroke-width="3"/>
<text x="574" y="280" class="male" text-anchor="start">Faza „przecieka” przez pojemność</text>
<text x="574" y="297" class="male" text-anchor="start">długiego przewodu do lampy.</text>
<text x="574" y="314" class="male" text-anchor="start">Wyjście: obciążenie bazowe</text>
<text x="574" y="331" class="male" text-anchor="start">(kondensator X2) albo inna LED.</text>
<rect x="20" y="365" width="800" height="50" rx="8" fill="#f8f9f9" stroke="#b3b6b7" stroke-width="1.4"/>
<text x="420" y="386" class="male" text-anchor="middle">Najpierw sprawdź przypadek 1 — jest groźny. Przypadki 2 i 3 są uciążliwe, ale nie niebezpieczne.</text>
<text x="420" y="405" class="male" text-anchor="middle">Mruganie przy włączonej lampie: ściemniacz, zasilacz, luźny zacisk, wahania napięcia (18.05, 20.06).</text>
</svg>
