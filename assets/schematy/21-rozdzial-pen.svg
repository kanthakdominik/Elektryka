<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">Rozdzielenie PEN przy modernizacji</title>
  <desc id="d">Wewnętrzna linia zasilająca w układzie TN-C z przewodami L i PEN dochodzi do rozdzielnicy mieszkaniowej. PEN wchodzi na listwę PE, a listwa PE łączy się z listwą N jednym mostkiem — to punkt rozdziału PEN, jedyne miejsce połączenia PE z N. Stary obwód dwuprzewodowy z wyłącznikiem B10 bierze L z szyny i N z listwy N. Nowy obwód trójprzewodowy w układzie TN-S wychodzi przez różnicówkę 30 mA i B16, z osobnymi żyłami L, N i PE z listwy PE. Zasady: PEN rozdziela się raz i potem nie łączy; przekrój PEN co najmniej 10 mm² miedzi lub 16 mm² aluminium, w przeciwnym razie modernizacja WLZ; w starych obwodach usuwa się mostki w gniazdach, a do czasu wymiany stosuje gniazda bez bolca i RCD jako ochronę przejściową.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="470" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Modernizacja częściowa: rozdzielenie PEN w rozdzielnicy mieszkania</text>
<text x="30" y="62" class="podt" text-anchor="start">WLZ w układzie TN-C</text>
<rect x="190" y="70" width="310" height="320" rx="10" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="345" y="88" class="male" text-anchor="middle">rozdzielnica mieszkaniowa</text>
<line x1="30" y1="100" x2="470" y2="100" stroke="#8b4513" stroke-width="4"/>
<text x="34" y="94" class="male" text-anchor="start" style="fill:#8b4513;font-weight:bold">L</text>
<line x1="30" y1="151" x2="235" y2="151" stroke="#27ae60" stroke-width="5"/>
<line x1="30" y1="151" x2="235" y2="151" stroke="#3498db" stroke-width="5" stroke-dasharray="10 10"/>
<text x="34" y="173" class="male" text-anchor="start" style="font-weight:bold">PEN</text>
<rect x="235" y="140" width="70" height="22" rx="3" fill="#27ae60"/>
<text x="270" y="155" class="male" text-anchor="middle" style="fill:#ffffff;font-weight:bold">PE</text>
<rect x="235" y="200" width="70" height="22" rx="3" fill="#3498db"/>
<text x="270" y="215" class="male" text-anchor="middle" style="fill:#ffffff;font-weight:bold">N</text>
<line x1="270" y1="162" x2="270" y2="200" stroke="#c0392b" stroke-width="4"/>
<circle cx="284" cy="181" r="9" fill="#c0392b"/>
<text x="284" y="185" class="male" text-anchor="middle" style="fill:#ffffff;font-weight:bold">1</text>
<path d="M212 100 L212 143 A8 8 0 0 1 212 159 L212 280" fill="none" stroke="#8b4513" stroke-width="3"/>
<rect x="196" y="280" width="34" height="60" rx="4" fill="#fadbd8" stroke="#555"/>
<text x="213" y="314" class="male" text-anchor="middle">B10</text>
<line x1="213" y1="340" x2="213" y2="410" stroke="#8b4513" stroke-width="3"/>
<line x1="250" y1="222" x2="250" y2="410" stroke="#1f5fbf" stroke-width="3"/>
<text x="232" y="428" class="male" text-anchor="middle">stary 2-przewodowy</text>
<path d="M410 100 L410 143 A8 8 0 0 1 410 159 L410 240" fill="none" stroke="#8b4513" stroke-width="3"/>
<path d="M305 211 L350 211 L350 240" fill="none" stroke="#1f5fbf" stroke-width="3"/>
<rect x="330" y="240" width="100" height="60" rx="5" fill="#d6eaf8" stroke="#555"/>
<text x="380" y="266" class="male" text-anchor="middle" style="font-weight:bold">RCD 30 mA</text>
<text x="380" y="284" class="male" text-anchor="middle">+ B16</text>
<line x1="410" y1="300" x2="410" y2="410" stroke="#8b4513" stroke-width="3"/>
<line x1="350" y1="300" x2="350" y2="410" stroke="#1f5fbf" stroke-width="3"/>
<line x1="305" y1="151" x2="460" y2="151" stroke="#27ae60" stroke-width="3"/>
<line x1="460" y1="151" x2="460" y2="410" stroke="#27ae60" stroke-width="3"/>
<text x="405" y="428" class="male" text-anchor="middle" style="font-weight:bold">nowy 3-przewodowy (TN-S)</text>
<circle cx="40" cy="452" r="9" fill="#c0392b"/>
<text x="40" y="456" class="male" text-anchor="middle" style="fill:#ffffff;font-weight:bold">1</text>
<text x="56" y="456" class="male" text-anchor="start">jedyne miejsce połączenia PE z N — punkt rozdziału PEN</text>
<text x="520" y="92" class="male" text-anchor="start">Zasady:</text>
<text x="520" y="112" class="male" text-anchor="start">• PEN rozdziela się raz, w jednym</text>
<text x="520" y="132" class="male" text-anchor="start">   miejscu; za nim PE i N już się</text>
<text x="520" y="152" class="male" text-anchor="start">   nie łączą.</text>
<text x="520" y="172" class="male" text-anchor="start">• PEN ≥ 10 mm² Cu lub 16 mm² Al.</text>
<text x="520" y="192" class="male" text-anchor="start">   Cieńszy → modernizacja WLZ</text>
<text x="520" y="212" class="male" text-anchor="start">   (zarządca budynku).</text>
<text x="520" y="232" class="male" text-anchor="start">• Nowe obwody: 3 żyły, RCD 30 mA.</text>
<text x="520" y="252" class="male" text-anchor="start">• Stare obwody: usuń mostki</text>
<text x="520" y="272" class="male" text-anchor="start">   w gniazdach; do wymiany —</text>
<text x="520" y="292" class="male" text-anchor="start">   gniazda bez bolca, RCD jako</text>
<text x="520" y="312" class="male" text-anchor="start">   ochrona przejściowa.</text>
<text x="520" y="332" class="male" text-anchor="start">• Połączenia wyrównawcze</text>
<text x="520" y="352" class="male" text-anchor="start">   wg projektu.</text>
</svg>
