<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="840" height="450" role="img" aria-labelledby="t d">
  <title id="t">Cęgi prądowe</title>
  <desc id="d">Trzy panele. Cęgi obejmują jedną żyłę L: pokazują prąd obwodu 10 A. Cęgi obejmują cały przewód z L i N: prądy płyną w przeciwne strony i się znoszą, wynik 0. Cęgi upływowe obejmują L i N razem: pokazują mały prąd upływu, na przykład 3,2 mA, który ucieka do PE. Cęgi mierzą bez rozłączania obwodu; prąd upływu pomaga znaleźć przyczynę wybijania różnicówki.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="450" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Cęgi prądowe — co obejmujesz, to mierzysz</text>
<rect x="20" y="50" width="260" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="150" y="76" class="podt" text-anchor="middle">1 żyła (L)</text>
<circle cx="150" cy="170" r="12" fill="#8b4513"/>
<circle cx="220" cy="210" r="12" fill="#1f5fbf"/>
<text x="220" y="236" class="male" text-anchor="middle">N poza cęgami</text>
<path d="M110 170 A40 40 0 1 1 190 170" fill="none" stroke="#e67e22" stroke-width="12"/>
<path d="M110 170 A40 40 0 0 0 190 170" fill="none" stroke="#e67e22" stroke-width="12" stroke-dasharray="40 6"/>
<rect x="90" y="250" width="120" height="44" rx="6" fill="#d5f5e3" stroke="#555"/>
<text x="150" y="279" class="podt" text-anchor="middle">10,0 A</text>
<text x="150" y="320" class="male" text-anchor="middle" style="font-weight:bold">prąd obwodu</text>
<rect x="295" y="50" width="260" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="425" y="76" class="podt" text-anchor="middle">L + N razem</text>
<circle cx="425" cy="170" r="26" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
<circle cx="416" cy="170" r="9" fill="#8b4513"/>
<circle cx="434" cy="170" r="9" fill="#1f5fbf"/>
<path d="M373 170 A52 52 0 1 1 477 170" fill="none" stroke="#e67e22" stroke-width="12"/>
<path d="M373 170 A52 52 0 0 0 477 170" fill="none" stroke="#e67e22" stroke-width="12" stroke-dasharray="40 6"/>
<rect x="365" y="250" width="120" height="44" rx="6" fill="#d5f5e3" stroke="#555"/>
<text x="425" y="279" class="podt" text-anchor="middle">0,00 A</text>
<text x="425" y="320" class="male" text-anchor="middle" style="font-weight:bold">prądy się znoszą</text>
<rect x="570" y="50" width="260" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="700" y="76" class="podt" text-anchor="middle">L + N (+ cęgi upływowe)</text>
<circle cx="700" cy="170" r="26" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
<circle cx="691" cy="170" r="9" fill="#8b4513"/>
<circle cx="709" cy="170" r="9" fill="#1f5fbf"/>
<path d="M648 170 A52 52 0 1 1 752 170" fill="none" stroke="#e67e22" stroke-width="12"/>
<path d="M648 170 A52 52 0 0 0 752 170" fill="none" stroke="#e67e22" stroke-width="12" stroke-dasharray="40 6"/>
<rect x="640" y="250" width="120" height="44" rx="6" fill="#d5f5e3" stroke="#555"/>
<text x="700" y="279" class="podt" text-anchor="middle">3,2 mA</text>
<text x="700" y="320" class="male" text-anchor="middle" style="font-weight:bold">prąd upływu</text>
<rect x="20" y="365" width="800" height="70" rx="8" fill="#f8f9f9" stroke="#b3b6b7" stroke-width="1.4"/>
<text x="40" y="388" class="male" text-anchor="start">Cęgi mierzą pole magnetyczne prądu — bez rozłączania obwodu. Zwykłe cęgi: obejmij jedną żyłę (rozdziel przewód</text>
<text x="40" y="408" class="male" text-anchor="start">w puszce lub rozdzielnicy). Wszystkie żyły obwodu razem: wynik ≈ 0 — chyba że coś ucieka do PE. Ten mały prąd</text>
<text x="40" y="428" class="male" text-anchor="start">mierzą cęgi upływowe (rozdzielczość rzędu µA–mA) — sposób na szukanie przyczyny wybijania RCD.</text>
</svg>
