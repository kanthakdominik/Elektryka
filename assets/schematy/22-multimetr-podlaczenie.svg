<rect x="570" y="50" width="260" height="330" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="700" y="76" class="podt" text-anchor="middle">Rezystancja — bez napięcia</text>
<rect x="640" y="230" width="120" height="120" rx="10" fill="#f9e79f" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="650" y="240" width="100" height="32" rx="3" fill="#d5f5e3" stroke="#555"/>
<text x="700.0" y="262" class="podt" text-anchor="middle">48 Ω</text>
<circle cx="658.0" cy="328" r="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="658.0" y="316" class="male" text-anchor="middle">COM</text>
<circle cx="700.0" cy="328" r="7" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="700.0" y="316" class="male" text-anchor="middle">V Ω</text>
<circle cx="742.0" cy="328" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="742.0" y="316" class="male" text-anchor="middle">A</text>
<rect x="660" y="125" width="80" height="26" rx="4" fill="#fdebd0" stroke="#1a1a1a"/>
<text x="700" y="143" class="male" text-anchor="middle">element</text>
<path d="M658.0 328 L658.0 200 L640 200 L640 138 L660 138" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<path d="M700.0 328 L700.0 190 L760 190 L760 138 L740 138" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="700" y="110" class="male" text-anchor="middle" style="fill:#c0392b">obwód odłączony od zasilania</text>
<rect x="20" y="395" width="800" height="80" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<text x="40" y="418" class="male" text-anchor="start">⚠ Przewód w gnieździe A i pomiar napięcia = zwarcie przez miernik (bezpiecznik miernika, łuk, oparzenie).</text>
<text x="40" y="440" class="male" text-anchor="start">Po pomiarze prądu od razu przełóż przewód z gniazda A do V. Prąd w instalacji mierz cęgami (22.03), nie szeregowo.</text>
<text x="40" y="462" class="male" text-anchor="start">Rezystancję i ciągłość mierzysz tylko w obwodzie bez napięcia — inaczej wynik jest fałszywy, a miernik może się uszkodzić.</text>
</svg>
