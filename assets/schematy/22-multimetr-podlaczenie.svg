<text x="383.0" y="316" class="male" text-anchor="middle">COM</text>
<circle cx="425.0" cy="328" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="425.0" y="316" class="male" text-anchor="middle">V Ω</text>
<circle cx="467.0" cy="328" r="7" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
