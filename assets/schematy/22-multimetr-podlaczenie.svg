<line x1="510.2" y1="130.2" x2="529.8" y2="149.8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="510.2" y1="149.8" x2="529.8" y2="130.2" stroke="#1a1a1a" stroke-width="2"/>
<line x1="520" y1="110" x2="520" y2="126" stroke="#8b4513" stroke-width="2"/>
<line x1="520" y1="154" x2="520" y2="170" stroke="#1f5fbf" stroke-width="2"/>
<text x="410" y="102" class="male" text-anchor="middle" style="fill:#c0392b">przerwany obwód</text>
<path d="M383.0 328 L383.0 190 L445 190 L445 110" fill="none" stroke="#1a1a1a" stroke-width="2"/>
