<rect x="100" y="240" width="100" height="32" rx="3" fill="#d5f5e3" stroke="#555"/>
<text x="150.0" y="262" class="podt" text-anchor="middle">230 V</text>
<circle cx="108.0" cy="328" r="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="108.0" y="316" class="male" text-anchor="middle">COM</text>
