<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 455" width="840" height="455" role="img" aria-labelledby="t d">
  <title id="t">Ocena termowizyjna ΔT</title>
  <desc id="d">Skala oceny różnicy temperatur. Przy porównaniu z identycznym elementem przy podobnym obciążeniu: 1 do 3 stopni — możliwa usterka, zapisać i sprawdzić przy kolejnym przeglądzie; 4 do 15 stopni — prawdopodobna usterka, naprawić, gdy możliwe; powyżej 15 stopni — poważna usterka, naprawić natychmiast. Przy porównaniu z temperaturą otoczenia: 1–10 możliwa, 11–20 prawdopodobna, 21–40 monitorować, powyżej 40 naprawić natychmiast. Kryteria ANSI/NETA, pomiar pod obciążeniem, uwaga na emisyjność błyszczących metali i bezpieczeństwo przy otwartej rozdzielnicy.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="455" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Termowizja — jak ocenić przegrzane połączenie (ΔT)</text>
<text x="30" y="70" class="podt" text-anchor="start">Porównanie z takim samym elementem przy podobnym obciążeniu (np. ta sama faza obok):</text>
<rect x="60" y="90" width="66" height="40" fill="#f9e79f" stroke="#555"/>
<rect x="126" y="90" width="264" height="40" fill="#f5b041" stroke="#555"/>
<rect x="390" y="90" width="330" height="40" fill="#e74c3c" stroke="#555"/>
<text x="60" y="150" class="male" text-anchor="middle">1 °C</text>
<text x="126" y="150" class="male" text-anchor="middle">4 °C</text>
<text x="390" y="150" class="male" text-anchor="middle">16 °C</text>
<text x="720" y="150" class="male" text-anchor="middle">ΔT</text>
<rect x="60" y="172" width="18" height="18" fill="#f9e79f" stroke="#555"/>
<text x="88" y="186" class="male" text-anchor="start">1–3 °C: możliwa usterka — zapisz, sprawdź przy kolejnym przeglądzie</text>
<rect x="60" y="198" width="18" height="18" fill="#f5b041" stroke="#555"/>
<text x="88" y="212" class="male" text-anchor="start">4–15 °C: prawdopodobna usterka — napraw, gdy to możliwe</text>
<rect x="60" y="224" width="18" height="18" fill="#e74c3c" stroke="#555"/>
<text x="88" y="238" class="male" text-anchor="start">> 15 °C: poważna usterka — napraw natychmiast</text>
<text x="30" y="275" class="podt" text-anchor="start">Porównanie z temperaturą powietrza wokół (bez elementu odniesienia):</text>
<rect x="60" y="290" width="170" height="36" fill="#f9e79f" stroke="#555"/>
<text x="145" y="314" class="podt" text-anchor="middle">1–10 °C</text>
<rect x="240" y="290" width="170" height="36" fill="#f5b041" stroke="#555"/>
<text x="325" y="314" class="podt" text-anchor="middle">11–20 °C</text>
<rect x="420" y="290" width="170" height="36" fill="#eb984e" stroke="#555"/>
<text x="505" y="314" class="podt" text-anchor="middle">21–40 °C</text>
<rect x="600" y="290" width="170" height="36" fill="#e74c3c" stroke="#555"/>
<text x="685" y="314" class="podt" text-anchor="middle">> 40 °C</text>
<text x="60" y="346" class="male" text-anchor="start">możliwa</text>
<text x="240" y="346" class="male" text-anchor="start">prawdopodobna</text>
<text x="420" y="346" class="male" text-anchor="start">monitoruj do naprawy</text>
<text x="600" y="346" class="male" text-anchor="start">napraw natychmiast</text>
<rect x="20" y="365" width="800" height="75" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="40" y="388" class="male" text-anchor="start">Kryteria wg ANSI/NETA MTS (tab. 100.18) 🇬🇧 — to wytyczne, nie przepis. Pomiar ma sens pod obciążeniem</text>
<text x="40" y="408" class="male" text-anchor="start">(często zaleca się ≥ 40 % prądu znamionowego) i przy znanej emisyjności: błyszcząca miedź i aluminium „udają” zimne.</text>
<text x="40" y="428" class="male" text-anchor="start">Zdjęcie z kamery przez otwartą rozdzielnicę = praca w pobliżu napięcia: CAT, odstęp, ochrona twarzy.</text>
</svg>
