<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">Ciągłość przewodu PE</title>
  <desc id="d">Rozdzielnica z listwą PE i przewód PE prowadzony do trzech gniazd. Miernik ciągłości z prądem co najmniej 0,2 A i napięciem 4 do 24 V podłączony jednym przewodem do listwy PE, a długim przewodem pomiarowym do bolca gniazda 3; wynik 0,42 oma. Zasady: mierzy się od listwy PE do każdego bolca i obudowy klasy I, przewody pomiarowe kompensuje się, wynik ocenia się względem długości i przekroju (miedź 2,5 mm² około 7,4 miliomów na metr, 1,5 mm² około 12), tak samo sprawdza się połączenia wyrównawcze.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="470" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Ciągłość przewodu ochronnego PE</text>
<rect x="30" y="60" width="170" height="230" rx="10" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="1.4"/>
<text x="115" y="82" class="male" text-anchor="middle">rozdzielnica</text>
<rect x="50" y="200" width="130" height="20" rx="3" fill="#27ae60"/>
<text x="115" y="215" class="male" text-anchor="middle" style="fill:#ffffff">listwa PE</text>
<line x1="180" y1="210" x2="640" y2="210" stroke="#27ae60" stroke-width="3"/>
<line x1="180" y1="210" x2="640" y2="210" stroke="#f1c40f" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="336" y="160" width="48" height="48" rx="8" fill="#f2f3f4" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="360" cy="172" r="4" fill="#27ae60"/>
<line x1="360" y1="176" x2="360" y2="210" stroke="#27ae60" stroke-width="2"/>
<rect x="476" y="160" width="48" height="48" rx="8" fill="#f2f3f4" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="500" cy="172" r="4" fill="#27ae60"/>
<line x1="500" y1="176" x2="500" y2="210" stroke="#27ae60" stroke-width="2"/>
<rect x="616" y="160" width="48" height="48" rx="8" fill="#f2f3f4" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="640" cy="172" r="4" fill="#27ae60"/>
<line x1="640" y1="176" x2="640" y2="210" stroke="#27ae60" stroke-width="2"/>
<text x="360" y="150" class="male" text-anchor="middle">gniazdo 1</text>
<text x="500" y="150" class="male" text-anchor="middle">gniazdo 2</text>
<text x="640" y="150" class="male" text-anchor="middle">gniazdo 3</text>
<rect x="360" y="260" width="140" height="80" rx="10" fill="#f9e79f" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="370" y="270" width="120" height="34" rx="3" fill="#d5f5e3" stroke="#555"/>
<text x="430" y="294" class="podt" text-anchor="middle">0,42 Ω</text>
<text x="430" y="324" class="male" text-anchor="middle">≥ 0,2 A, 4–24 V</text>
<path d="M380 260 L380 240 L115 240 L115 220" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<path d="M480 260 L480 240 L700 240 L700 172 L644 172" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4"/>
<text x="712" y="230" class="male" text-anchor="start">długi przewód</text>
<text x="712" y="246" class="male" text-anchor="start">pomiarowy</text>
<text x="30" y="375" class="male" text-anchor="start">• Mierzy się od listwy PE (lub GSU) do każdego punktu: bolce gniazd, obudowy opraw klasy I, zaciski PE.</text>
<text x="30" y="397" class="male" text-anchor="start">• Przyrząd: źródło 4–24 V, prąd co najmniej 0,2 A (PN-EN 61557-4). Najpierw wyzeruj (skompensuj) przewody pomiarowe.</text>
<text x="30" y="419" class="male" text-anchor="start">• Wynik ocenia się w odniesieniu do długości i przekroju: Cu 2,5 mm² ≈ 7,4 mΩ/m, 1,5 mm² ≈ 12 mΩ/m.</text>
<text x="30" y="441" class="male" text-anchor="start">• Tak samo sprawdza się połączenia wyrównawcze główne i miejscowe (wanna, rury, grzejniki).</text>
</svg>
