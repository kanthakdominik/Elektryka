<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 485" width="840" height="485" role="img" aria-labelledby="t d">
  <title id="t">Pomiar rezystancji uziemienia</title>
  <desc id="d">Metoda techniczna z trzema elektrodami. Badany uziom E, sonda napięciowa S i sonda prądowa H wbite w ziemię w jednej linii. Miernik z zaciskami E, S i H pokazuje 7,8 oma. Sonda prądowa w odległości co najmniej 40 metrów lub pięciokrotnej długości uziomu, sonda napięciowa w około 62 procentach tej odległości, co najmniej 20 metrów. Wykres rozkładu napięcia między E a H ma płaski obszar w środku, w którym należy umieścić sondę S. Sprawdzenie przez przesunięcie sondy o 10 procent w obie strony. Uziom badany odłączony od instalacji albo metoda cęgowa.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="485" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Pomiar rezystancji uziemienia — metoda techniczna (3 elektrody)</text>
<rect x="0" y="200" width="840" height="140" fill="#c9a77c"/>
<rect x="0" y="195" width="840" height="5" fill="#6aa84f"/>
<rect x="85" y="190" width="10" height="90" fill="#7f8c8d"/>
<text x="90" y="305" class="male" text-anchor="middle" style="font-weight:bold">E — badany uziom</text>
<rect x="465" y="190" width="10" height="50" fill="#2e86c1"/>
<text x="470" y="265" class="male" text-anchor="middle" style="font-weight:bold">S — sonda napięciowa</text>
<rect x="725" y="190" width="10" height="50" fill="#c0392b"/>
<text x="730" y="265" class="male" text-anchor="middle" style="font-weight:bold">H — sonda prądowa</text>
<rect x="300" y="60" width="140" height="80" rx="10" fill="#f9e79f" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="310" y="70" width="120" height="34" rx="3" fill="#d5f5e3" stroke="#555"/>
<text x="370" y="94" class="podt" text-anchor="middle">7,8 Ω</text>
<text x="370" y="124" class="male" text-anchor="middle" style="font-weight:bold">E   S   H</text>
<path d="M340 140 L340 170 L90 170 L90 190" fill="none" stroke="#7f8c8d" stroke-width="2"/>
<path d="M370 140 L370 160 L470 160 L470 190" fill="none" stroke="#2e86c1" stroke-width="2"/>
<path d="M400 140 L400 150 L730 150 L730 190" fill="none" stroke="#c0392b" stroke-width="2"/>
<line x1="90" y1="355" x2="730" y2="355" stroke="#555" stroke-width="1.3"/><path d="M730.0 355.0 L721.7 358.5 L721.7 351.5 Z" fill="#555"/><path d="M90.0 355.0 L98.3 351.5 L98.3 358.5 Z" fill="#555"/>
<text x="410.0" y="372" class="male" text-anchor="middle">≥ 40 m (lub ≥ 5 × długość uziomu)</text>
<line x1="90" y1="385" x2="470" y2="385" stroke="#555" stroke-width="1.3"/><path d="M470.0 385.0 L461.7 388.5 L461.7 381.5 Z" fill="#555"/><path d="M90.0 385.0 L98.3 381.5 L98.3 388.5 Z" fill="#555"/>
<text x="280.0" y="402" class="male" text-anchor="middle">ok. 62 % odległości E–H (≥ 20 m)</text>
<text x="600" y="70" class="male" text-anchor="middle">rozkład napięcia między E a H</text>
<path d="M480.0 140.0 L486.0 133.5 L492.0 128.7 L498.0 125.2 L504.0 122.5 L510.0 120.6 L516.0 119.1 L522.0 118.1 L528.0 117.3 L534.0 116.7 L540.0 116.2 L546.0 115.9 L552.0 115.7 L558.0 115.5 L564.0 115.4 L570.0 115.3 L576.0 115.2 L582.0 115.1 L588.0 115.1 L594.0 115.0 L600.0 115.0 L606.0 115.0 L612.0 114.9 L618.0 114.9 L624.0 114.8 L630.0 114.7 L636.0 114.6 L642.0 114.5 L648.0 114.3 L654.0 114.1 L660.0 113.8 L666.0 113.3 L672.0 112.7 L678.0 111.9 L684.0 110.9 L690.0 109.4 L696.0 107.5 L702.0 104.8 L708.0 101.3 L714.0 96.5 L720.0 90.0" fill="none" stroke="#2e86c1" stroke-width="2"/>
<line x1="480" y1="140" x2="720" y2="140" stroke="#555" stroke-width="1"/>
<rect x="588.0" y="90" width="60.0" height="50" fill="#2e86c1" fill-opacity="0.12"/>
<text x="618.0" y="84" class="male" text-anchor="middle" style="fill:#2e86c1">„płaski” obszar</text>
<rect x="20" y="415" width="800" height="55" rx="8" fill="#f8f9f9" stroke="#b3b6b7" stroke-width="1.4"/>
<text x="40" y="437" class="male" text-anchor="start">Sprawdzenie: przesuń sondę S o ok. ±10 % w stronę E i H — wynik nie może się wyraźnie zmienić. Uziom badany</text>
<text x="40" y="457" class="male" text-anchor="start">odłączony od instalacji (złącze kontrolne otwarte) albo metoda cęgowa, gdy rozłączenie jest niemożliwe.</text>
</svg>
