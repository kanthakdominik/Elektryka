<text x="300.0" y="468" class="male" text-anchor="middle">80 % obrotów</text>
<text x="54" y="366.96" class="male" text-anchor="end">51 %</text>
<text x="368" y="454" class="male" text-anchor="start">100 %</text>
<text x="54" y="284" class="male" text-anchor="end">100 %</text>
<text x="420" y="270" class="male" text-anchor="start">W instalacji pamiętaj:</text>
<text x="420" y="292" class="male" text-anchor="start">• RCD: typ B (lub F, jeśli producent dopuszcza) —</text>
<text x="420" y="314" class="male" text-anchor="start">  prądy upływu z DC i wysokiej częstotliwości;</text>
<text x="420" y="336" class="male" text-anchor="start">• duży prąd upływu przez filtry EMC — osobny RCD,</text>
<text x="420" y="358" class="male" text-anchor="start">  czasem 100–300 mA tam, gdzie wolno;</text>
<text x="420" y="380" class="male" text-anchor="start">• przewód silnikowy ekranowany, ekran z obu stron do PE;</text>
<text x="420" y="402" class="male" text-anchor="start">• przy małych obrotach silnik słabiej się chłodzi;</text>
<text x="420" y="424" class="male" text-anchor="start">• po wyłączeniu w obwodzie DC jest napięcie —</text>
<text x="420" y="446" class="male" text-anchor="start">  odczekaj czas z instrukcji przed otwarciem.</text>
</svg>
