<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-labelledby="t d">
  <title id="t">Przemiennik częstotliwości</title>
  <desc id="d">Schemat blokowy falownika: sieć trójfazowa 400 V 50 Hz, prostownik diodowy zamieniający prąd przemienny na stały, obwód pośredni DC z kondensatorami około 560 V, falownik z tranzystorami IGBT wytwarzający napięcie o regulowanej częstotliwości metodą PWM, silnik. Pod spodem przebiegi: sinusoida sieci, napięcie stałe, impulsy PWM. Wykres: moc pompy lub wentylatora rośnie z sześcianem prędkości, przy 80 procentach obrotów potrzeba około 51 procent mocy. Uwagi instalacyjne: różnicówka typu B lub F według producenta, duże prądy upływu, przewód ekranowany, słabsze chłodzenie przy małych obrotach, napięcie w obwodzie DC po wyłączeniu.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
