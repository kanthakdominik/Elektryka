    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="480" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Przemiennik częstotliwości (falownik) — co jest w środku</text>
<rect x="40" y="60" width="130" height="80" rx="8" fill="#ecf0f1" stroke="#555" stroke-width="1.4"/>
<text x="105" y="92" class="podt" text-anchor="middle">sieć</text>
<text x="105" y="116" class="male" text-anchor="middle">3~ 400 V 50 Hz</text>
<rect x="200" y="60" width="130" height="80" rx="8" fill="#fdebd0" stroke="#555" stroke-width="1.4"/>
<text x="265" y="92" class="podt" text-anchor="middle">prostownik</text>
<text x="265" y="116" class="male" text-anchor="middle">diody: AC → DC</text>
<rect x="360" y="60" width="130" height="80" rx="8" fill="#fcf3cf" stroke="#555" stroke-width="1.4"/>
<text x="425" y="92" class="podt" text-anchor="middle">obwód DC</text>
<text x="425" y="116" class="male" text-anchor="middle">ok. 560 V DC</text>
<rect x="520" y="60" width="130" height="80" rx="8" fill="#d6eaf8" stroke="#555" stroke-width="1.4"/>
<text x="585" y="92" class="podt" text-anchor="middle">falownik</text>
<text x="585" y="116" class="male" text-anchor="middle">IGBT, PWM</text>
<rect x="680" y="60" width="130" height="80" rx="8" fill="#e9f7ef" stroke="#555" stroke-width="1.4"/>
<text x="745" y="92" class="podt" text-anchor="middle">silnik</text>
<text x="745" y="116" class="male" text-anchor="middle">0–50 Hz (i więcej)</text>
