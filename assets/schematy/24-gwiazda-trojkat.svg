<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 525" width="840" height="525" role="img" aria-labelledby="t d">
  <title id="t">Gwiazda i trójkąt</title>
  <desc id="d">Dwie tabliczki zaciskowe silnika trójfazowego. Górny rząd zacisków U1, V1, W1 zasilany fazami L1, L2, L3, dolny rząd W2, U2, V2. Gwiazda: jeden poziomy mostek łączy W2, U2 i V2; każde uzwojenie ma 230 V. Trójkąt: trzy pionowe mostki łączą U1 z W2, V1 z U2, W1 z V2; każde uzwojenie ma 400 V. Zasada: silnik 230/400 V Δ/Y w sieci 400 V łączy się w gwiazdę; silnik 400/690 V Δ/Y w trójkąt i tylko taki nadaje się do rozruchu gwiazda-trójkąt. Błędny trójkąt przy silniku 230/400 V spala silnik.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="525" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Silnik trójfazowy: gwiazda (Y) i trójkąt (Δ) na tabliczce zaciskowej</text>
<rect x="20" y="50" width="390" height="380" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="215" y="76" class="podt" text-anchor="middle">Gwiazda Y — mostek łączy W2-U2-V2</text>
<rect x="100" y="125" width="230" height="150" rx="8" fill="#ecf0f1" stroke="#7f8c8d"/>
<circle cx="135" cy="160" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="153" y="146" class="male" text-anchor="start" style="font-weight:bold">U1</text>
<circle cx="135" cy="240" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="135" y="272" class="male" text-anchor="middle" style="font-weight:bold">W2</text>
<circle cx="215" cy="160" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="233" y="146" class="male" text-anchor="start" style="font-weight:bold">V1</text>
<circle cx="215" cy="240" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="215" y="272" class="male" text-anchor="middle" style="font-weight:bold">U2</text>
<circle cx="295" cy="160" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="313" y="146" class="male" text-anchor="start" style="font-weight:bold">W1</text>
<circle cx="295" cy="240" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="295" y="272" class="male" text-anchor="middle" style="font-weight:bold">V2</text>
<line x1="135" y1="90" x2="135" y2="147" stroke="#8b4513" stroke-width="4"/>
<text x="149" y="100" class="male" text-anchor="start" style="fill:#8b4513;font-weight:bold">L1</text>
<line x1="215" y1="90" x2="215" y2="147" stroke="#1a1a1a" stroke-width="4"/>
<text x="229" y="100" class="male" text-anchor="start" style="fill:#1a1a1a;font-weight:bold">L2</text>
<line x1="295" y1="90" x2="295" y2="147" stroke="#7f8c8d" stroke-width="4"/>
<text x="309" y="100" class="male" text-anchor="start" style="fill:#7f8c8d;font-weight:bold">L3</text>
<rect x="127" y="234" width="176" height="12" rx="4" fill="#c87533" stroke="#7e5109"/>
<line x1="215" y1="345" x2="215.0" y2="300.0" stroke="#1a1a1a" stroke-width="3"/>
<line x1="215" y1="345" x2="176.02885682970026" y2="367.5" stroke="#1a1a1a" stroke-width="3"/>
<line x1="215" y1="345" x2="253.97114317029974" y2="367.5" stroke="#1a1a1a" stroke-width="3"/>
<text x="215" y="415" class="male" text-anchor="middle">na uzwojeniu 230 V (400 / √3)</text>
<rect x="430" y="50" width="390" height="380" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="625" y="76" class="podt" text-anchor="middle">Trójkąt Δ — mostki U1-W2, V1-U2, W1-V2</text>
<rect x="510" y="125" width="230" height="150" rx="8" fill="#ecf0f1" stroke="#7f8c8d"/>
<circle cx="545" cy="160" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="563" y="146" class="male" text-anchor="start" style="font-weight:bold">U1</text>
<circle cx="545" cy="240" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="545" y="272" class="male" text-anchor="middle" style="font-weight:bold">W2</text>
<circle cx="625" cy="160" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="643" y="146" class="male" text-anchor="start" style="font-weight:bold">V1</text>
<circle cx="625" cy="240" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="625" y="272" class="male" text-anchor="middle" style="font-weight:bold">U2</text>
<circle cx="705" cy="160" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="723" y="146" class="male" text-anchor="start" style="font-weight:bold">W1</text>
<circle cx="705" cy="240" r="13" fill="#d5d8dc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="705" y="272" class="male" text-anchor="middle" style="font-weight:bold">V2</text>
<line x1="545" y1="90" x2="545" y2="147" stroke="#8b4513" stroke-width="4"/>
<text x="559" y="100" class="male" text-anchor="start" style="fill:#8b4513;font-weight:bold">L1</text>
<line x1="625" y1="90" x2="625" y2="147" stroke="#1a1a1a" stroke-width="4"/>
<text x="639" y="100" class="male" text-anchor="start" style="fill:#1a1a1a;font-weight:bold">L2</text>
<line x1="705" y1="90" x2="705" y2="147" stroke="#7f8c8d" stroke-width="4"/>
<text x="719" y="100" class="male" text-anchor="start" style="fill:#7f8c8d;font-weight:bold">L3</text>
<rect x="539" y="158" width="12" height="84" rx="4" fill="#c87533" stroke="#7e5109"/>
<rect x="619" y="158" width="12" height="84" rx="4" fill="#c87533" stroke="#7e5109"/>
<rect x="699" y="158" width="12" height="84" rx="4" fill="#c87533" stroke="#7e5109"/>
<path d="M625.0 300.0 L586.0 367.5 L664.0 367.5 Z" fill="none" stroke="#1a1a1a" stroke-width="3"/>
<text x="625" y="415" class="male" text-anchor="middle">na uzwojeniu 400 V</text>
<rect x="20" y="440" width="800" height="70" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="40" y="463" class="male" text-anchor="start">Tabliczka „230/400 V Δ/Y” → w sieci 400 V łącz w gwiazdę. „400/690 V Δ/Y” → w sieci 400 V w trójkąt</text>
<text x="40" y="485" class="male" text-anchor="start">(i tylko taki nadaje się do rozruchu Y-Δ). Błąd: Δ przy 230/400 V = 400 V na uzwojeniu 230 V → spalony silnik.</text>
</svg>
