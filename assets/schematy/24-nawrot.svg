<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 570" width="840" height="570" role="img" aria-labelledby="t d">
  <title id="t">Zmiana kierunku obrotów</title>
  <desc id="d">Obwód główny: fazy L1, L2, L3 do dwóch styczników. K1 przekazuje fazy prosto, K2 zamienia L1 z L3. Za stycznikami przekaźnik termiczny F2 i silnik. Obwód sterowania: dwa szczeble, przycisk S1 prawo i styk rozwierny K2 21-22 przed cewką K1, przycisk S2 lewo i styk rozwierny K1 21-22 przed cewką K2 — blokada elektryczna. Ostrzeżenie: K1 i K2 nie mogą być załączone razem, bo to zwarcie międzyfazowe; stosuje się blokadę elektryczną i mechaniczną oraz zatrzymanie przed zmianą kierunku.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
