<rect x="20" y="485" width="800" height="70" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<text x="40" y="508" class="male" text-anchor="start">K1 i K2 nigdy nie mogą być załączone razem — to zwarcie międzyfazowe L1–L3. Dlatego: blokada elektryczna</text>
<text x="40" y="528" class="male" text-anchor="start">(styk rozwierny drugiego stycznika w obwodzie cewki), najlepiej też mechaniczna (styczniki nawrotne z blokadą),</text>
<text x="40" y="548" class="male" text-anchor="start">a przy dużych masach wirujących — zatrzymanie silnika przed zmianą kierunku.</text>
