<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-labelledby="t d">
  <title id="t">Porównanie rozruchów</title>
  <desc id="d">Wykres prądu rozruchowego w wielokrotnościach prądu znamionowego w funkcji czasu dla czterech sposobów rozruchu. Rozruch bezpośredni: prąd 5 do 8 razy znamionowy przez kilka sekund. Gwiazda-trójkąt: około jednej trzeciej tego prądu, krótki skok przy przełączeniu na trójkąt. Softstart: prąd narasta do ograniczonej wartości, na przykład 3 do 4 razy. Falownik: około 1 do 1,5 raza. Gwiazda-trójkąt i softstart zmniejszają też moment rozruchowy, falownik daje pełny moment przy małym prądzie dzięki stałemu stosunkowi napięcia do częstotliwości.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
