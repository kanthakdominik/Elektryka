<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 610" width="840" height="610" role="img" aria-labelledby="t d">
  <title id="t">Układ start-stop</title>
  <desc id="d">Po lewej obwód główny: fazy L1, L2, L3 przez wyłącznik silnikowy Q1, styki główne stycznika K1 i przekaźnik termiczny F2 do silnika M 3~. Po prawej obwód sterowania 230 V między L i N: styk rozwierny przekaźnika termicznego F2 95-96, przycisk rozwierny stop S0, przycisk zwierny start S1, równolegle do niego styk zwierny stycznika K1 13-14 podtrzymujący, cewka stycznika K1 A1-A2. Start załącza cewkę, styk podtrzymania utrzymuje ją po puszczeniu przycisku, stop lub termik przerywa obwód cewki. Po zaniku napięcia silnik sam nie ruszy.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="610" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Układ start-stop: obwód główny i obwód sterowania</text>
