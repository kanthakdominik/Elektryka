<text x="455" y="512" class="male" text-anchor="start">Start (NO) → cewka K1 → styk K1 13-14 „podtrzymuje”.</text>
<text x="455" y="532" class="male" text-anchor="start">Stop (NC) lub termik F2 przerywa obwód cewki.</text>
<text x="455" y="552" class="male" text-anchor="start">Po zaniku napięcia silnik sam nie ruszy —</text>
<text x="455" y="572" class="male" text-anchor="start">trzeba nacisnąć start (ochrona przed samorozruchem).</text>
</svg>
