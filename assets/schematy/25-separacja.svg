<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 505" width="840" height="505" role="img" aria-labelledby="t d">
  <title id="t">Transformator separacyjny</title>
  <desc id="d">Dwa panele. Po lewej zwykła sieć: przewód N jest uziemiony, człowiek stojący na ziemi i dotykający L zamyka obwód przez ziemię do N — porażenie. Po prawej odbiornik zasilany przez transformator separacyjny: obwód wtórny 230 V nie ma połączenia z ziemią, więc dotknięcie jednego przewodu nie daje drogi powrotu prądu — brak porażenia. Zasady: jeden odbiornik na uzwojenie, obwód wtórny nieuziemiony, dotknięcie obu przewodów nadal poraża, autotransformator nie daje separacji; transformator bezpieczeństwa daje SELV do 50 V.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="505" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Transformator separacyjny: dotyk jednego przewodu nie poraża</text>
<rect x="20" y="50" width="390" height="360" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="215" y="76" class="podt" text-anchor="middle">Zwykła sieć (TN)</text>
