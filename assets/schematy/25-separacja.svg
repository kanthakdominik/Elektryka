<text x="46" y="114" class="male" text-anchor="end" style="fill:#8b4513">L</text>
<line x1="50" y1="200" x2="150" y2="200" stroke="#1f5fbf" stroke-width="3"/>
<text x="46" y="204" class="male" text-anchor="end" style="fill:#1f5fbf">N</text>
<line x1="80" y1="200" x2="80" y2="210" stroke="#1a1a1a" stroke-width="2"/>
<line x1="69.0" y1="210" x2="91.0" y2="210" stroke="#1a1a1a" stroke-width="2"/>
