<line x1="487.0" y1="220" x2="493.0" y2="220" stroke="#1a1a1a" stroke-width="2"/>
<text x="505" y="240" class="male" text-anchor="start">N sieci uziemiony</text>
<line x1="560" y1="110" x2="594" y2="110" stroke="#8b4513" stroke-width="3"/>
<line x1="594" y1="110" x2="594" y2="120" stroke="#8b4513" stroke-width="3"/>
<line x1="560" y1="200" x2="594" y2="200" stroke="#1f5fbf" stroke-width="3"/>
<line x1="594" y1="190" x2="594" y2="200" stroke="#1f5fbf" stroke-width="3"/>
<path d="M594 122.5 A7.5 7.5 0 0 1 594 137.5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
