<path d="M626 167.5 A7.5 7.5 0 0 0 626 182.5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<line x1="607" y1="120" x2="607" y2="190" stroke="#1a1a1a" stroke-width="2"/>
<line x1="613" y1="120" x2="613" y2="190" stroke="#1a1a1a" stroke-width="2"/>
<line x1="626" y1="120" x2="626" y2="110" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="626" y1="110" x2="760" y2="110" stroke="#e67e22" stroke-width="3"/>
<line x1="626" y1="190" x2="626" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="626" y1="200" x2="760" y2="200" stroke="#e67e22" stroke-width="3"/>
<text x="695" y="100" class="male" text-anchor="middle">230 V — bez połączenia z ziemią</text>
<circle cx="730" cy="230" r="9" fill="none" stroke="#555" stroke-width="2.5"/>
<line x1="730" y1="239" x2="730" y2="270" stroke="#555" stroke-width="2.5"/>
<line x1="730" y1="250" x2="714" y2="242" stroke="#555" stroke-width="2.5"/>
<line x1="730" y1="250" x2="744" y2="260" stroke="#555" stroke-width="2.5"/>
<line x1="730" y1="270" x2="720" y2="292" stroke="#555" stroke-width="2.5"/>
<line x1="730" y1="270" x2="740" y2="292" stroke="#555" stroke-width="2.5"/>
<line x1="714" y1="242" x2="710" y2="110" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="680" y="292" width="100" height="8" fill="#a1887f"/>
<text x="625" y="330" class="opis" text-anchor="middle">Prąd nie ma którędy wrócić:</text>
<text x="625" y="350" class="opis" text-anchor="middle">obwód wtórny nie ma połączenia z ziemią.</text>
<text x="625" y="380" class="male" text-anchor="middle" style="fill:#1e8449;font-weight:bold">✓ dotyk jednego przewodu — bez porażenia</text>
<rect x="20" y="420" width="800" height="70" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="40" y="442" class="male" text-anchor="start">Zasady: jeden odbiornik na uzwojenie, obwód wtórny nieuziemiony i niepołączony z PE, przewody krótkie i widoczne.</text>
<text x="40" y="462" class="male" text-anchor="start">Dotknięcie OBU przewodów wtórnych poraża jak zwykle. Autotransformator NIE daje separacji — uzwojenia są połączone.</text>
<text x="40" y="482" class="male" text-anchor="start">Transformator bezpieczeństwa (PN-EN 61558-2-6) daje dodatkowo SELV ≤ 50 V AC; separacyjny — PN-EN 61558-2-4.</text>
</svg>
