<line x1="77.0" y1="220" x2="83.0" y2="220" stroke="#1a1a1a" stroke-width="2"/>
<text x="95" y="240" class="male" text-anchor="start">N sieci uziemiony</text>
<line x1="150" y1="110" x2="350" y2="110" stroke="#8b4513" stroke-width="3"/>
<line x1="150" y1="200" x2="350" y2="200" stroke="#1f5fbf" stroke-width="3"/>
<circle cx="320" cy="230" r="9" fill="none" stroke="#555" stroke-width="2.5"/>
<line x1="320" y1="239" x2="320" y2="270" stroke="#555" stroke-width="2.5"/>
<line x1="320" y1="250" x2="304" y2="242" stroke="#555" stroke-width="2.5"/>
