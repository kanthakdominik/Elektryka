<circle cx="325.0" cy="190" r="5" fill="#27ae60"/>
<text x="215" y="290" class="male" text-anchor="middle">prąd przechodzi przez zero co 10 ms</text>
<text x="215" y="308" class="male" text-anchor="middle" style="fill:#1e8449;font-weight:bold">→ łuk gaśnie, aparaty AC łatwo go przerywają</text>
<rect x="430" y="50" width="390" height="280" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="625" y="76" class="podt" text-anchor="middle">Prąd stały (DC) z paneli</text>
<line x1="460" y1="190" x2="790" y2="190" stroke="#bbb" stroke-width="1"/>
<line x1="460" y1="130" x2="790" y2="130" stroke="#c0392b" stroke-width="3"/>
<text x="625" y="290" class="male" text-anchor="middle">prąd stały nie przechodzi przez zero</text>
<text x="625" y="308" class="male" text-anchor="middle" style="fill:#c0392b;font-weight:bold">→ łuk się podtrzymuje; trzeba aparatów DC</text>
<rect x="20" y="345" width="800" height="100" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<text x="40" y="370" class="male" text-anchor="start">• Panele w dzień są ZAWSZE pod napięciem — nie da się ich „wyłączyć” w rozdzielnicy; rozłącznik DC odcina tylko falownik.</text>
<text x="40" y="392" class="male" text-anchor="start">• Rozłączenie złącza MC4 pod obciążeniem = łuk. Najpierw wyłącz po stronie AC, potem rozłącznik DC, dopiero potem złącza.</text>
<text x="40" y="414" class="male" text-anchor="start">• Aparaty po stronie DC muszą mieć parametry DC (napięcie, prąd) — zwykły wyłącznik AC może nie zgasić łuku.</text>
<text x="40" y="436" class="male" text-anchor="start">• Luźne złącze lub złącza różnych producentów → łuk szeregowy → pożar dachu.</text>
</svg>
