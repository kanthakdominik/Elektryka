<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 475" width="840" height="475" role="img" aria-labelledby="t d">
  <title id="t">Magazyn energii</title>
  <desc id="d">Dwa sposoby dołączenia magazynu. Sprzężenie DC: panele i bateria dołączone do jednego falownika hybrydowego, który zasila rozdzielnicę i ma wyjście backup dla wybranych obwodów przy zaniku sieci; mniej strat przy ładowaniu z PV. Sprzężenie AC: istniejący falownik PV zasila rozdzielnicę, a bateria ma własny falownik bateryjny dołączony po stronie AC; łatwo dołożyć magazyn, ale są dwie przemiany energii. Uwagi: zasilanie awaryjne wymaga automatycznego odcięcia od sieci; na wyjściu backup musi działać ochrona przeciwporażeniowa; baterie litowe LFP w miejscu zgodnym z instrukcją; bateria daje duży prąd zwarciowy DC.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="475" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Magazyn energii: sprzężenie DC i AC, zasilanie awaryjne</text>
<rect x="20" y="50" width="390" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="215" y="76" class="podt" text-anchor="middle">Sprzężenie DC (falownik hybrydowy)</text>
<rect x="40" y="100" width="80" height="46" rx="8" fill="#d6eaf8" stroke="#2e86c1" stroke-width="1.4"/>
<text x="80.0" y="128.0" class="podt" text-anchor="middle">PV</text>
<rect x="160" y="140" width="120" height="70" rx="8" fill="#e8daef" stroke="#8e44ad" stroke-width="1.4"/>
<text x="220.0" y="175.0" class="podt" text-anchor="middle">falownik</text>
<text x="220.0" y="195.0" class="male" text-anchor="middle">hybrydowy</text>
<path d="M120 123 L140 123 L140 160 L160 160" fill="none" stroke="#c0392b" stroke-width="3"/>
<rect x="40" y="220" width="90" height="50" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="85.0" y="245.0" class="podt" text-anchor="middle">bateria</text>
<text x="85.0" y="265.0" class="male" text-anchor="middle">DC</text>
<path d="M130 245 L145 245 L145 195 L160 195" fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="280" y1="175" x2="320" y2="175" stroke="#8b4513" stroke-width="3"/>
<rect x="320" y="150" width="70" height="50" rx="8" fill="#ecf0f1" stroke="#555" stroke-width="1.4"/>
<text x="355.0" y="180.0" class="podt" text-anchor="middle">RG</text>
<path d="M220 210 L220 260 L320 260" fill="none" stroke="#e67e22" stroke-width="3"/>
<rect x="320" y="240" width="70" height="40" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.4"/>
<text x="355.0" y="265.0" class="podt" text-anchor="middle">backup</text>
<text x="215" y="310" class="male" text-anchor="middle">jeden falownik: mniej strat przy ładowaniu z PV;</text>
<text x="215" y="328" class="male" text-anchor="middle">wyjście backup zasila wybrane obwody przy zaniku</text>
<rect x="430" y="50" width="390" height="300" rx="8" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.4"/>
<text x="625" y="76" class="podt" text-anchor="middle">Sprzężenie AC (osobny falownik bateryjny)</text>
<rect x="450" y="100" width="80" height="46" rx="8" fill="#d6eaf8" stroke="#2e86c1" stroke-width="1.4"/>
<text x="490.0" y="128.0" class="podt" text-anchor="middle">PV</text>
<rect x="560" y="100" width="100" height="46" rx="8" fill="#d6eaf8" stroke="#2e86c1" stroke-width="1.4"/>
<text x="610.0" y="123.0" class="podt" text-anchor="middle">falownik</text>
<text x="610.0" y="143.0" class="male" text-anchor="middle">PV</text>
<line x1="530" y1="123" x2="560" y2="123" stroke="#c0392b" stroke-width="3"/>
<path d="M660 123 L730 123 L730 150" fill="none" stroke="#8b4513" stroke-width="3"/>
<rect x="700" y="150" width="80" height="50" rx="8" fill="#ecf0f1" stroke="#555" stroke-width="1.4"/>
<text x="740.0" y="180.0" class="podt" text-anchor="middle">RG</text>
<rect x="450" y="230" width="90" height="50" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="495.0" y="260.0" class="podt" text-anchor="middle">bateria</text>
<rect x="560" y="230" width="120" height="50" rx="8" fill="#e8daef" stroke="#8e44ad" stroke-width="1.4"/>
<text x="620.0" y="255.0" class="podt" text-anchor="middle">falownik</text>
<text x="620.0" y="275.0" class="male" text-anchor="middle">bateryjny (AC)</text>
<line x1="540" y1="255" x2="560" y2="255" stroke="#c0392b" stroke-width="3"/>
<path d="M680 255 L740 255 L740 200" fill="none" stroke="#8b4513" stroke-width="3"/>
<text x="625" y="310" class="male" text-anchor="middle">dołożenie magazynu do istniejącej instalacji PV</text>
<text x="625" y="328" class="male" text-anchor="middle">bez wymiany falownika; dwie przemiany energii</text>
<rect x="20" y="365" width="800" height="95" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<text x="40" y="388" class="male" text-anchor="start">• Backup wymaga automatycznego odcięcia od sieci (w falowniku / skrzynce backup) — jak przy agregacie (25.04).</text>
<text x="40" y="410" class="male" text-anchor="start">• W trybie wyspy musi działać ochrona przeciwporażeniowa (połączenie N–PE, RCD) — wg producenta i projektu.</text>
<text x="40" y="432" class="male" text-anchor="start">• Baterie litowe (zwykle LFP): miejsce wg instrukcji (temperatura, odstępy), rozłącznik DC, grube przewody.</text>
<text x="40" y="454" class="male" text-anchor="start">• Bateria to źródło dużego prądu zwarciowego DC — praca przy zaciskach tylko z izolowanymi narzędziami i po rozłączeniu.</text>
</svg>
