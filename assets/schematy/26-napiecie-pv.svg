<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" role="img" aria-labelledby="t d">
  <title id="t">Wzrost napięcia przez PV</title>
  <desc id="d">Wykres napięcia wzdłuż linii niskiego napięcia od transformatora do piątego domu na końcu linii. Wieczorem, gdy domy pobierają energię, napięcie spada wzdłuż linii, np. z 236 do 226 V. W południe, gdy wiele instalacji PV oddaje energię, napięcie rośnie wzdłuż linii, np. do 256 V, przekraczając granicę 253 V, przy której falownik musi się odłączyć. Pomaga autokonsumpcja w dzień, falownik trójfazowy, przewód do falownika o małym spadku i reklamacja do operatora; zmiana progów falownika jest niezgodna z wymaganiami.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="460" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Dlaczego falownik wyłącza się w słoneczny dzień (253 V)</text>
<line x1="80" y1="330" x2="760" y2="330" stroke="#555" stroke-width="1.5"/>
<line x1="80" y1="330" x2="80" y2="90" stroke="#555" stroke-width="1.5"/>
<line x1="80" y1="306.0" x2="760" y2="306.0" stroke="#eaecee" stroke-width="1"/>
<text x="72" y="310.0" class="male" text-anchor="end">220 V</text>
<line x1="80" y1="258.0" x2="760" y2="258.0" stroke="#eaecee" stroke-width="1"/>
<text x="72" y="262.0" class="male" text-anchor="end">230 V</text>
<line x1="80" y1="210.0" x2="760" y2="210.0" stroke="#eaecee" stroke-width="1"/>
<text x="72" y="214.0" class="male" text-anchor="end">240 V</text>
<line x1="80" y1="147.6" x2="760" y2="147.6" stroke="#e74c3c" stroke-width="2" stroke-dasharray="8 5"/>
<text x="72" y="151.6" class="male" text-anchor="end">253 V</text>
<line x1="80" y1="114.0" x2="760" y2="114.0" stroke="#eaecee" stroke-width="1"/>
<text x="72" y="118.0" class="male" text-anchor="end">260 V</text>
<text x="88" y="141.6" class="male" text-anchor="start" style="fill:#c0392b;font-weight:bold">253 V — granica, falownik się odłącza</text>
<text x="80" y="352" class="male" text-anchor="middle">transformator</text>
<text x="208.30188679245285" y="352" class="male" text-anchor="middle">dom 1</text>
<text x="336.6037735849057" y="352" class="male" text-anchor="middle">dom 2</text>
<text x="464.9056603773585" y="352" class="male" text-anchor="middle">dom 3</text>
<text x="593.2075471698114" y="352" class="male" text-anchor="middle">dom 4</text>
<text x="721.5094339622642" y="352" class="male" text-anchor="middle">dom 5 (koniec linii)</text>
<path d="M80.0 229.2 L114.0 231.6 L148.0 234.0 L182.0 236.4 L216.0 238.8 L250.0 241.2 L284.0 243.6 L318.0 246.0 L352.0 248.4 L386.0 250.8 L420.0 253.2 L454.0 255.6 L488.0 258.0 L522.0 260.4 L556.0 262.8 L590.0 265.2 L624.0 267.6 L658.0 270.0 L692.0 272.4 L726.0 274.8 L760.0 277.2" fill="none" stroke="#2e86c1" stroke-width="3"/>
<path d="M80.0 229.2 L114.0 224.4 L148.0 219.6 L182.0 214.8 L216.0 210.0 L250.0 205.2 L284.0 200.4 L318.0 195.6 L352.0 190.8 L386.0 186.0 L420.0 181.2 L454.0 176.4 L488.0 171.6 L522.0 166.8 L556.0 162.0 L590.0 157.2 L624.0 152.4 L658.0 147.6 L692.0 142.8 L726.0 138.0 L760.0 133.2" fill="none" stroke="#e67e22" stroke-width="3"/>
<text x="454.00000000000006" y="284.8" class="male" text-anchor="middle" style="fill:#2e86c1">wieczór: pobór → napięcie spada wzdłuż linii</text>
<text x="297.6" y="162.0" class="male" text-anchor="middle" style="fill:#d35400">południe, dużo PV: oddawanie → napięcie rośnie</text>
<rect x="20" y="365" width="800" height="80" rx="8" fill="#f8f9f9" stroke="#b3b6b7" stroke-width="1.4"/>
<text x="40" y="388" class="male" text-anchor="start">Prąd oddawany do sieci podnosi napięcie na końcu linii. Powyżej 253 V (230 V + 10 %) falownik musi się odłączyć.</text>
<text x="40" y="408" class="male" text-anchor="start">Pomaga: autokonsumpcja w dzień (bojler, pompa, magazyn), falownik 3-fazowy, gruby przewód do falownika,</text>
<text x="40" y="428" class="male" text-anchor="start">reklamacja jakości napięcia do OSD. Nie wolno: „podkręcać” progów falownika — to niezgodne z wymaganiami.</text>
</svg>
