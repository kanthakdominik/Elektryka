<text x="790" y="348" class="male" text-anchor="middle" style="font-weight:bold">sieć OSD</text>
<rect x="20" y="260" width="680" height="200" rx="8" fill="#f8f9f9" stroke="#b3b6b7" stroke-width="1.4"/>
<text x="36" y="286" class="male" text-anchor="start">• Mikroinstalacja: do 50 kW, sieć poniżej 110 kV — na zgłoszenie do OSD (moc ≤ przyłączeniowa).</text>
<text x="36" y="311" class="male" text-anchor="start">• Falownik on-grid wyłącza się przy zaniku sieci (anti-islanding) — bez backupu dom nie ma prądu.</text>
<text x="36" y="336" class="male" text-anchor="start">• Falownik odłącza się też przy za wysokim napięciu (powyżej 253 V) — patrz 26.03.</text>
<text x="36" y="361" class="male" text-anchor="start">• Strona DC: zawsze pod napięciem w dzień, łuk DC nie gaśnie sam (26.02).</text>
<text x="36" y="386" class="male" text-anchor="start">• Powyżej 6,5 kW — uzgodnienie z rzeczoznawcą ppoż. i zawiadomienie PSP.</text>
<text x="36" y="411" class="male" text-anchor="start">• Ramy paneli i konstrukcja — połączenie wyrównawcze; odstępy od instalacji odgromowej.</text>
<text x="36" y="436" class="male" text-anchor="start">• Wymagania: PN-HD 60364-7-712; po montażu — pomiary i protokół.</text>
</svg>
