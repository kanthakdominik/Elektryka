<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 475" width="840" height="475" role="img" aria-labelledby="t d">
  <title id="t">Mikroinstalacja PV</title>
  <desc id="d">Schemat instalacji fotowoltaicznej: dwa łańcuchy paneli do około 1000 V DC, skrzynka DC z rozłącznikiem DC, ogranicznikiem przepięć DC i bezpiecznikami gPV przy trzech lub więcej łańcuchach, falownik zamieniający DC na AC 230/400 V, skrzynka AC z wyłącznikiem nadprądowym, ogranicznikiem przepięć AC i RCD według falownika, rozdzielnica główna, licznik dwukierunkowy i sieć operatora. Uwagi: mikroinstalacja do 50 kW na zgłoszenie, falownik wyłącza się przy zaniku sieci i przy napięciu powyżej 253 V, strona DC zawsze pod napięciem w dzień, powyżej 6,5 kW uzgodnienie ppoż i zawiadomienie PSP, połączenia wyrównawcze ram, norma PN-HD 60364-7-712.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
