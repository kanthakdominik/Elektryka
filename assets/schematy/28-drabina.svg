<text x="398" y="290" class="male" text-anchor="start">4 części</text>
<text x="205" y="405" class="podt" text-anchor="middle">≈ 75°</text>
<line x1="300" y1="100" x2="300" y2="140" stroke="#c0392b" stroke-width="1.5"/><path d="M300.0 140.0 L296.5 131.7 L303.5 131.7 Z" fill="#c0392b"/><path d="M300.0 100.0 L303.5 108.3 L296.5 108.3 Z" fill="#c0392b"/>
<text x="250" y="116" class="male" text-anchor="end" style="fill:#c0392b;font-weight:bold">ok. 0,75 m</text>
<text x="250" y="132" class="male" text-anchor="end" style="fill:#c0392b">ponad podest</text>
<rect x="450" y="60" width="370" height="380" rx="8" fill="#f8f9f9" stroke="#b3b6b7" stroke-width="1.4"/>
<text x="466" y="86" class="male" text-anchor="start">• Drabina z materiału nieprzewodzącego</text>
<text x="466" y="107" class="male" text-anchor="start">  (włókno szklane, drewno) — nie aluminiowa</text>
<text x="466" y="128" class="male" text-anchor="start">  przy pracach w pobliżu napięcia.</text>
<text x="466" y="149" class="male" text-anchor="start">• Sprawdź przed wejściem: szczeble, stopki,</text>
<text x="466" y="170" class="male" text-anchor="start">  rozpórka/łańcuch drabiny rozstawnej.</text>
<text x="466" y="191" class="male" text-anchor="start">• Przystawna: kąt ok. 75° (1 : 4), wystaje</text>
<text x="466" y="212" class="male" text-anchor="start">  ok. 0,75 m ponad podest, na którym się</text>
<text x="466" y="233" class="male" text-anchor="start">  schodzi.</text>
<text x="466" y="254" class="male" text-anchor="start">• Trzy punkty podparcia; nie stawaj na</text>
<text x="466" y="275" class="male" text-anchor="start">  ostatnich szczeblach.</text>
<text x="466" y="296" class="male" text-anchor="start">• Praca na wysokości od 1 m — wg BHP;</text>
<text x="466" y="317" class="male" text-anchor="start">  w pracy zawodowej przy urządzeniach</text>
<text x="466" y="338" class="male" text-anchor="start">  energetycznych to szczególne zagrożenie</text>
<text x="466" y="359" class="male" text-anchor="start">  (praca na wysokości — polecenie, zespół).</text>
<text x="466" y="380" class="male" text-anchor="start">• Porażenie na drabinie = upadek:</text>
<text x="466" y="401" class="male" text-anchor="start">  dwa zagrożenia naraz.</text>
</svg>
