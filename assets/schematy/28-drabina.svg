<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">Drabina przy pracach elektrycznych</title>
  <desc id="d">Drabina przystawna oparta o ścianę z podestem: kąt około 75 stopni, czyli odsunięcie podstawy o jedną część na cztery części wysokości, górny koniec wystaje około 0,75 m ponad podest. Zasady: drabina z materiału nieprzewodzącego przy pracach w pobliżu napięcia, sprawdzenie przed wejściem, trzy punkty podparcia, nie stawać na ostatnich szczeblach, praca na wysokości od 1 m według przepisów BHP, porażenie na drabinie grozi upadkiem.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
