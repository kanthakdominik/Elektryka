<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img" aria-labelledby="t d">
  <title id="t">Postępowanie przy awarii</title>
  <desc id="d">Siedem kroków: sprawdzić zagrożenie dla ludzi; odłączyć uszkodzony fragment i zabezpieczyć przed załączeniem; zgłosić przełożonemu lub dyspozytorowi, przy awarii sieci pogotowiu energetycznemu 991; ustalić zakres i przyczynę oględzinami i pomiarami; usunąć usterkę lub zabezpieczyć miejsce; sprawdzić po naprawie i załączyć; zapisać zdarzenie w dokumentacji.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="490" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Postępowanie przy awarii urządzenia lub instalacji</text>
<rect x="40" y="55" width="760" height="46" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="66" cy="78.0" r="15" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="66" y="84.0" class="podt" text-anchor="middle">1</text>
<text x="92" y="75" class="podt" text-anchor="start">Zagrożenie dla ludzi?</text>
<text x="92" y="94" class="male" text-anchor="start">najpierw ratuj i odsuń ludzi; porażenie → 31, pożar → 30.05</text>
<line x1="66" y1="93.0" x2="66" y2="123.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 123.0 L62.5 114.7 L69.5 114.7 Z" fill="#555"/>
<rect x="40" y="115" width="760" height="46" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.4"/>
<circle cx="66" cy="138.0" r="15" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
<text x="66" y="144.0" class="podt" text-anchor="middle">2</text>
<text x="92" y="135" class="podt" text-anchor="start">Odłącz uszkodzony fragment</text>
<text x="92" y="154" class="male" text-anchor="start">wyłącz obwód / urządzenie, zabezpiecz przed załączeniem; nie „próbuj, czy przeszło”</text>
<line x1="66" y1="153.0" x2="66" y2="183.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 183.0 L62.5 174.7 L69.5 174.7 Z" fill="#555"/>
<rect x="40" y="175" width="760" height="46" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.4"/>
<circle cx="66" cy="198.0" r="15" fill="#ffffff" stroke="#d4ac0d" stroke-width="2"/>
<text x="66" y="204.0" class="podt" text-anchor="middle">3</text>
<text x="92" y="195" class="podt" text-anchor="start">Zgłoś</text>
<text x="92" y="214" class="male" text-anchor="start">przełożony / dyspozytor / właściciel; awaria sieci — pogotowie energetyczne 991</text>
<line x1="66" y1="213.0" x2="66" y2="243.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 243.0 L62.5 234.7 L69.5 234.7 Z" fill="#555"/>
<rect x="40" y="235" width="760" height="46" rx="8" fill="#eaf2f8" stroke="#2e86c1" stroke-width="1.4"/>
<circle cx="66" cy="258.0" r="15" fill="#ffffff" stroke="#2e86c1" stroke-width="2"/>
<text x="66" y="264.0" class="podt" text-anchor="middle">4</text>
<text x="92" y="255" class="podt" text-anchor="start">Ustal zakres i przyczynę</text>
<text x="92" y="274" class="male" text-anchor="start">oględziny, wywiad, pomiary — metoda z 20.01; nie wymieniaj „na ślepo”</text>
<line x1="66" y1="273.0" x2="66" y2="303.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 303.0 L62.5 294.7 L69.5 294.7 Z" fill="#555"/>
<rect x="40" y="295" width="760" height="46" rx="8" fill="#eaf2f8" stroke="#2e86c1" stroke-width="1.4"/>
<circle cx="66" cy="318.0" r="15" fill="#ffffff" stroke="#2e86c1" stroke-width="2"/>
<text x="66" y="324.0" class="podt" text-anchor="middle">5</text>
<text x="92" y="315" class="podt" text-anchor="start">Usuń lub zabezpiecz</text>
<text x="92" y="334" class="male" text-anchor="start">naprawa według instrukcji; jeśli się nie da — zasilanie zastępcze, oznakowanie</text>
<line x1="66" y1="333.0" x2="66" y2="363.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 363.0 L62.5 354.7 L69.5 354.7 Z" fill="#555"/>
<rect x="40" y="355" width="760" height="46" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<circle cx="66" cy="378.0" r="15" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
<text x="66" y="384.0" class="podt" text-anchor="middle">6</text>
<text x="92" y="375" class="podt" text-anchor="start">Sprawdź i załącz</text>
<text x="92" y="394" class="male" text-anchor="start">pomiary po naprawie, próba działania, poinformuj użytkowników</text>
<line x1="66" y1="393.0" x2="66" y2="423.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 423.0 L62.5 414.7 L69.5 414.7 Z" fill="#555"/>
<rect x="40" y="415" width="760" height="46" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<circle cx="66" cy="438.0" r="15" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
<text x="66" y="444.0" class="podt" text-anchor="middle">7</text>
<text x="92" y="435" class="podt" text-anchor="start">Zapisz</text>
<text x="92" y="454" class="male" text-anchor="start">co, kiedy, przyczyna, co zrobiono — dokumentacja eksploatacyjna (29.03)</text>
</svg>
