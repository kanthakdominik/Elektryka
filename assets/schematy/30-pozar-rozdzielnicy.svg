<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img" aria-labelledby="t d">
  <title id="t">Pożar w rozdzielnicy</title>
  <desc id="d">Siedem kroków: najpierw ludzie — ostrzec i wyprowadzić; alarm 112 z informacją, że pali się instalacja elektryczna; wyłączyć zasilanie przed rozdzielnicą — wyłącznik główny, przeciwpożarowy wyłącznik prądu lub złącze; gasić tylko pożar w zarodku gaśnicą proszkową lub śniegową z odległości co najmniej 1 m; zamknąć drzwi i ewakuować się; poinformować strażaków o wyłącznikach i innych źródłach energii; nie załączać ponownie przed sprawdzeniem instalacji.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="490" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Dym lub ogień w rozdzielnicy — kolejność działań</text>
<rect x="40" y="55" width="760" height="46" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="66" cy="78.0" r="15" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="66" y="84.0" class="podt" text-anchor="middle">1</text>
<text x="92" y="75" class="podt" text-anchor="start">Ludzie najpierw</text>
<text x="92" y="94" class="male" text-anchor="start">ostrzeż, wyprowadź osoby z zagrożonego miejsca; nie ryzykuj zdrowia dla sprzętu</text>
<line x1="66" y1="93.0" x2="66" y2="123.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 123.0 L62.5 114.7 L69.5 114.7 Z" fill="#555"/>
<rect x="40" y="115" width="760" height="46" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="66" cy="138.0" r="15" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="66" y="144.0" class="podt" text-anchor="middle">2</text>
<text x="92" y="135" class="podt" text-anchor="start">Alarm — 112</text>
<text x="92" y="154" class="male" text-anchor="start">zgłoś pożar: adres, co się pali, czy są ludzie w środku, że to instalacja elektryczna</text>
<line x1="66" y1="153.0" x2="66" y2="183.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 183.0 L62.5 174.7 L69.5 174.7 Z" fill="#555"/>
<rect x="40" y="175" width="760" height="46" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.4"/>
<circle cx="66" cy="198.0" r="15" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
<text x="66" y="204.0" class="podt" text-anchor="middle">3</text>
<text x="92" y="195" class="podt" text-anchor="start">Wyłącz zasilanie PRZED rozdzielnicą</text>
<text x="92" y="214" class="male" text-anchor="start">wyłącznik główny w innym miejscu, PWP, złącze — nie sięgaj do płonącej szafy</text>
<line x1="66" y1="213.0" x2="66" y2="243.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 243.0 L62.5 234.7 L69.5 234.7 Z" fill="#555"/>
<rect x="40" y="235" width="760" height="46" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.4"/>
<circle cx="66" cy="258.0" r="15" fill="#ffffff" stroke="#d4ac0d" stroke-width="2"/>
<text x="66" y="264.0" class="podt" text-anchor="middle">4</text>
<text x="92" y="255" class="podt" text-anchor="start">Gaś tylko pożar w zarodku</text>
<text x="92" y="274" class="male" text-anchor="start">gaśnica proszkowa lub CO₂, odległość ≥ 1 m; jeśli się nie udaje w kilkanaście sekund — wycofaj się</text>
<line x1="66" y1="273.0" x2="66" y2="303.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 303.0 L62.5 294.7 L69.5 294.7 Z" fill="#555"/>
<rect x="40" y="295" width="760" height="46" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.4"/>
<circle cx="66" cy="318.0" r="15" fill="#ffffff" stroke="#d4ac0d" stroke-width="2"/>
<text x="66" y="324.0" class="podt" text-anchor="middle">5</text>
<text x="92" y="315" class="podt" text-anchor="start">Zamknij drzwi, ewakuuj się</text>
<text x="92" y="334" class="male" text-anchor="start">ogranicz dopływ powietrza i dymu; dym jest groźniejszy niż ogień</text>
<line x1="66" y1="333.0" x2="66" y2="363.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 363.0 L62.5 354.7 L69.5 354.7 Z" fill="#555"/>
<rect x="40" y="355" width="760" height="46" rx="8" fill="#eaf2f8" stroke="#2e86c1" stroke-width="1.4"/>
<circle cx="66" cy="378.0" r="15" fill="#ffffff" stroke="#2e86c1" stroke-width="2"/>
<text x="66" y="384.0" class="podt" text-anchor="middle">6</text>
<text x="92" y="375" class="podt" text-anchor="start">Poinformuj strażaków</text>
<text x="92" y="394" class="male" text-anchor="start">gdzie są wyłączniki, czy jest PV, magazyn, agregat, UPS — co jeszcze może być pod napięciem</text>
<line x1="66" y1="393.0" x2="66" y2="423.0" stroke="#555" stroke-width="1.5"/><path d="M66.0 423.0 L62.5 414.7 L69.5 414.7 Z" fill="#555"/>
<rect x="40" y="415" width="760" height="46" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<circle cx="66" cy="438.0" r="15" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
<text x="66" y="444.0" class="podt" text-anchor="middle">7</text>
<text x="92" y="435" class="podt" text-anchor="start">Nie załączaj ponownie</text>
<text x="92" y="454" class="male" text-anchor="start">rozdzielnica i instalacja do sprawdzenia przez elektryka; pomiary przed załączeniem</text>
</svg>
