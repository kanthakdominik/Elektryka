<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 505" width="840" height="505" role="img" aria-labelledby="t d">
  <title id="t">Grupa 1 — punkty</title>
  <desc id="d">Lista trzynastu punktów grupy 1 według załącznika do rozporządzenia z 2022 r.: 1 urządzenia prądotwórcze przyłączone do sieci, 2 urządzenia, instalacje i sieci do 1 kV, 3 od 1 do 30 kV, 4 od 30 do 110 kV, 5 powyżej 110 kV, 6 zespoły prądotwórcze powyżej 50 kW, 7 urządzenia elektrotermiczne, 8 urządzenia do elektrolizy, 9 sieci oświetlenia ulicznego, 10 sieć trakcyjna, 11 urządzenia przeciwwybuchowe, 12 magazyny energii powyżej 10 kW, 13 aparatura kontrolno-pomiarowa i automatyka dla urządzeń z punktów 1–12. Wyróżnione punkty 2 i 13 jako typowe dla elektryka instalacji w budynkach.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="505" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Grupa 1 — urządzenia elektroenergetyczne (punkty załącznika 1)</text>
<rect x="20" y="52" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="71" class="male" text-anchor="middle" style="font-weight:bold">1</text>
<text x="70" y="71" class="male" text-anchor="start">urządzenia prądotwórcze przyłączone do sieci — bez względu na napięcie</text>
<rect x="20" y="85" width="800" height="28" rx="5" fill="#d6eaf8" stroke="#2e86c1"/>
<text x="45" y="104" class="male" text-anchor="middle" style="font-weight:bold">2</text>
<text x="70" y="104" class="male" text-anchor="start" style="font-weight:bold">urządzenia, instalacje i sieci o napięciu nie wyższym niż 1 kV</text>
<rect x="20" y="118" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="137" class="male" text-anchor="middle" style="font-weight:bold">3</text>
<text x="70" y="137" class="male" text-anchor="start">urządzenia, instalacje i sieci > 1 kV i ≤ 30 kV</text>
<rect x="20" y="151" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="170" class="male" text-anchor="middle" style="font-weight:bold">4</text>
<text x="70" y="170" class="male" text-anchor="start">urządzenia, instalacje i sieci > 30 kV i ≤ 110 kV</text>
<rect x="20" y="184" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="203" class="male" text-anchor="middle" style="font-weight:bold">5</text>
<text x="70" y="203" class="male" text-anchor="start">urządzenia, instalacje i sieci > 110 kV</text>
<rect x="20" y="217" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="236" class="male" text-anchor="middle" style="font-weight:bold">6</text>
<text x="70" y="236" class="male" text-anchor="start">zespoły prądotwórcze o mocy > 50 kW</text>
<rect x="20" y="250" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="269" class="male" text-anchor="middle" style="font-weight:bold">7</text>
<text x="70" y="269" class="male" text-anchor="start">urządzenia elektrotermiczne</text>
<rect x="20" y="283" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="302" class="male" text-anchor="middle" style="font-weight:bold">8</text>
<text x="70" y="302" class="male" text-anchor="start">urządzenia do elektrolizy</text>
<rect x="20" y="316" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="335" class="male" text-anchor="middle" style="font-weight:bold">9</text>
<text x="70" y="335" class="male" text-anchor="start">sieci elektrycznego oświetlenia ulicznego</text>
<rect x="20" y="349" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="368" class="male" text-anchor="middle" style="font-weight:bold">10</text>
<text x="70" y="368" class="male" text-anchor="start">elektryczna sieć trakcyjna</text>
<rect x="20" y="382" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="401" class="male" text-anchor="middle" style="font-weight:bold">11</text>
<text x="70" y="401" class="male" text-anchor="start">elektryczne urządzenia w wykonaniu przeciwwybuchowym</text>
<rect x="20" y="415" width="800" height="28" rx="5" fill="#f8f9f9" stroke="#d5d8dc"/>
<text x="45" y="434" class="male" text-anchor="middle" style="font-weight:bold">12</text>
<text x="70" y="434" class="male" text-anchor="start">magazyny energii oddające energię do sieci, moc > 10 kW</text>
<rect x="20" y="448" width="800" height="28" rx="5" fill="#d6eaf8" stroke="#2e86c1"/>
<text x="45" y="467" class="male" text-anchor="middle" style="font-weight:bold">13</text>
<text x="70" y="467" class="male" text-anchor="start" style="font-weight:bold">aparatura kontrolno-pomiarowa, automatyka, sterowanie i zabezpieczenia urządzeń z pkt 1–12</text>
<text x="420" y="490" class="male" text-anchor="middle">Podświetlone — punkty typowe dla elektryka instalacji w budynkach (pkt 2 i 13).</text>
</svg>
