<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 485" width="840" height="485" role="img" aria-labelledby="t d">
  <title id="t">Mapa przepisów</title>
  <desc id="d">Cztery kolumny: Prawo energetyczne, art. 54, i rozporządzenie z 1 lipca 2022 r. w sprawie kwalifikacji; Kodeks pracy i rozporządzenie z 28 sierpnia 2019 r. w sprawie BHP przy urządzeniach energetycznych oraz ogólne przepisy BHP; Prawo budowlane z art. 62 i rozporządzenie w sprawie warunków technicznych budynków; ustawa o ochronie przeciwpożarowej i rozporządzenie MSWiA z 7 czerwca 2010 r. Poniżej normy: PN-HD 60364, PN-EN 50110-1, PN-EN 62305, PN-EN 61439, PN-EN 60204-1, PN-EN 61557, normy SEP. Hierarchia: ustawa, rozporządzenie obowiązkowe, norma dobrowolna; sprawdzać aktualne teksty jednolite.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="485" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Mapa przepisów elektryka</text>
<rect x="20" y="55" width="194" height="70" rx="8" fill="#e8daef" stroke="#8e44ad" stroke-width="1.4"/>
<text x="117" y="82" class="opis" text-anchor="middle" style="font-weight:bold">Prawo energetyczne</text>
<text x="117" y="104" class="male" text-anchor="middle">art. 54 — świadectwa</text>
<line x1="117" y1="125" x2="117" y2="155" stroke="#555" stroke-width="1.5"/><path d="M117.0 155.0 L113.5 146.7 L120.5 146.7 Z" fill="#555"/>
<rect x="20" y="155" width="194" height="85" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="1.4"/>
<text x="30" y="178" class="male" text-anchor="start">rozp. MKiŚ z 1.07.2022</text>
<text x="30" y="198" class="male" text-anchor="start">w sprawie kwalifikacji</text>
<text x="30" y="218" class="male" text-anchor="start">(grupy, punkty, E / D)</text>
<rect x="222" y="55" width="194" height="70" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.4"/>
<text x="319" y="82" class="opis" text-anchor="middle" style="font-weight:bold">Kodeks pracy</text>
<text x="319" y="104" class="male" text-anchor="middle">BHP — obowiązki pracodawcy</text>
<line x1="319" y1="125" x2="319" y2="155" stroke="#555" stroke-width="1.5"/><path d="M319.0 155.0 L315.5 146.7 L322.5 146.7 Z" fill="#555"/>
<rect x="222" y="155" width="194" height="85" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="1.4"/>
<text x="232" y="178" class="male" text-anchor="start">rozp. ME z 28.08.2019 — BHP</text>
<text x="232" y="198" class="male" text-anchor="start">przy urządzeniach energet.</text>
<text x="232" y="218" class="male" text-anchor="start">+ ogólne przepisy BHP</text>
<rect x="424" y="55" width="194" height="70" rx="8" fill="#d6eaf8" stroke="#2e86c1" stroke-width="1.4"/>
<text x="521" y="82" class="opis" text-anchor="middle" style="font-weight:bold">Prawo budowlane</text>
<text x="521" y="104" class="male" text-anchor="middle">art. 62 — kontrole okresowe</text>
<line x1="521" y1="125" x2="521" y2="155" stroke="#555" stroke-width="1.5"/><path d="M521.0 155.0 L517.5 146.7 L524.5 146.7 Z" fill="#555"/>
<rect x="424" y="155" width="194" height="85" rx="8" fill="#ffffff" stroke="#2e86c1" stroke-width="1.4"/>
<text x="434" y="178" class="male" text-anchor="start">rozp. w sprawie warunków</text>
<text x="434" y="198" class="male" text-anchor="start">technicznych budynków (WT)</text>
<text x="434" y="218" class="male" text-anchor="start">— rozdz. instalacja elektr.</text>
<rect x="626" y="55" width="194" height="70" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/>
<text x="723" y="82" class="opis" text-anchor="middle" style="font-weight:bold">Ustawa o ochr. ppoż.</text>
<text x="723" y="104" class="male" text-anchor="middle">obowiązki ppoż.</text>
<line x1="723" y1="125" x2="723" y2="155" stroke="#555" stroke-width="1.5"/><path d="M723.0 155.0 L719.5 146.7 L726.5 146.7 Z" fill="#555"/>
<rect x="626" y="155" width="194" height="85" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="636" y="178" class="male" text-anchor="start">rozp. MSWiA z 7.06.2010</text>
<text x="636" y="198" class="male" text-anchor="start">o ochronie ppoż. budynków</text>
<text x="636" y="218" class="male" text-anchor="start">(gaśnice, instrukcje)</text>
<text x="420" y="272" class="male" text-anchor="middle">↓ odwołują się do / uszczegóławiają je</text>
<rect x="20" y="285" width="800" height="120" rx="8" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.4"/>
<text x="420" y="308" class="podt" text-anchor="middle">Normy (PN-EN, PN-HD) — dobrowolne, ale wskazywane przez WT</text>
<text x="36" y="334" class="male" text-anchor="start">PN-HD 60364 — instalacje niskiego napięcia  •  PN-EN 50110-1 — eksploatacja urządzeń elektrycznych</text>
<text x="36" y="358" class="male" text-anchor="start">PN-EN 62305 — ochrona odgromowa  •  PN-EN 61439 — rozdzielnice  •  PN-EN 60204-1 — wyposażenie maszyn</text>
<text x="36" y="382" class="male" text-anchor="start">PN-EN 61557 — przyrządy do pomiarów ochronnych  •  N SEP-E-002, N SEP-E-004 — normy SEP (wytyczne)</text>
<rect x="20" y="415" width="800" height="55" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="420" y="437" class="male" text-anchor="middle">Hierarchia: ustawa → rozporządzenie (obowiązkowe) → norma (dobrowolna, „reguła wiedzy technicznej”).</text>
<text x="420" y="457" class="male" text-anchor="middle">Zawsze sprawdzaj aktualny tekst jednolity na isap.sejm.gov.pl / eli.gov.pl.</text>
</svg>
