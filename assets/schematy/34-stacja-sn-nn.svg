<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 475" width="840" height="475" role="img" aria-labelledby="t d">
  <title id="t">Stacja SN/nN</title>
  <desc id="d">Schemat jednokreskowy stacji transformatorowej: linia SN 15 kV, rozłącznik lub odłącznik SN, bezpieczniki SN, transformator 15/0,4 kV o mocy na przykład 250–630 kVA w grupie połączeń Dyn5 z uziemionym punktem neutralnym, rozłącznik główny nN, szyny 0,4 kV i odpływy przez rozłączniki bezpiecznikowe NH do linii nN. Obok: stacje słupowe, wnętrzowe i kontenerowe, wieżowe; wspólny uziom ochronny i roboczy, jeśli spełnione są warunki napięć dotykowych.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .tytul { font-size: 20px; font-weight: bold; }
    .podt { font-size: 15px; font-weight: bold; }
    .opis { font-size: 13.5px; fill: #333333; }
    .male { font-size: 12px; fill: #444444; }
    .duze { font-size: 34px; font-weight: bold; }
    .os { stroke: #555555; stroke-width: 1.5; }
    .siatka { stroke: #e5e8e8; stroke-width: 1; }
    .ramka { fill: #f8f9f9; stroke: #b3b6b7; stroke-width: 1.2; }
  </style>
  <rect width="840" height="475" fill="#ffffff"/>
<text x="420" y="30" class="tytul" text-anchor="middle">Stacja transformatorowa SN/nN — schemat jednokreskowy</text>
<text x="200" y="62" class="male" text-anchor="middle" style="font-weight:bold">linia SN 15 kV</text>
<line x1="200" y1="70" x2="200" y2="110" stroke="#1a1a1a" stroke-width="3"/>
<line x1="200" y1="110" x2="218" y2="140" stroke="#1a1a1a" stroke-width="3"/>
<line x1="200" y1="140" x2="200" y2="160" stroke="#1a1a1a" stroke-width="3"/>
<text x="230" y="130" class="male" text-anchor="start">rozłącznik / odłącznik SN</text>
<rect x="192" y="160" width="16" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="200" y1="160" x2="200" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="185" class="male" text-anchor="start">bezpieczniki SN</text>
<line x1="200" y1="200" x2="200" y2="225" stroke="#1a1a1a" stroke-width="3"/>
<circle cx="200" cy="245" r="22" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<circle cx="200" cy="275" r="22" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="235" y="255" class="male" text-anchor="start">transformator 15/0,4 kV</text>
<text x="235" y="273" class="male" text-anchor="start">np. 250–630 kVA, Dyn5</text>
<line x1="200" y1="297" x2="200" y2="330" stroke="#1a1a1a" stroke-width="3"/>
<line x1="178" y1="285" x2="140" y2="285" stroke="#2e9e3e" stroke-width="2"/>
