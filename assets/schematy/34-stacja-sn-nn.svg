<line x1="129.0" y1="295" x2="151.0" y2="295" stroke="#1a1a1a" stroke-width="2"/>
<line x1="133.0" y1="300" x2="147.0" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<line x1="137.0" y1="305" x2="143.0" y2="305" stroke="#1a1a1a" stroke-width="2"/>
<text x="138" y="318" class="male" text-anchor="middle">N uziemiony</text>
