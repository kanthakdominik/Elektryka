<text x="490" y="438" class="male" text-anchor="middle">odpływ 3</text>
<line x1="585" y1="330" x2="585" y2="360" stroke="#1a1a1a" stroke-width="2.5"/>
<rect x="578" y="360" width="14" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="585" y1="390" x2="585" y2="420" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="585" y="438" class="male" text-anchor="middle">odpływ 4</text>
<line x1="680" y1="330" x2="680" y2="360" stroke="#1a1a1a" stroke-width="2.5"/>
<rect x="673" y="360" width="14" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="680" y1="390" x2="680" y2="420" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="680" y="438" class="male" text-anchor="middle">odpływ 5</text>
<text x="490" y="460" class="male" text-anchor="middle">rozłączniki bezpiecznikowe NH → linie nN do odbiorców</text>
<rect x="520" y="60" width="300" height="230" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="536" y="86" class="male" text-anchor="start">Rodzaje stacji:</text>
<text x="536" y="107" class="male" text-anchor="start">• słupowe — małe moce, wieś,</text>
<text x="536" y="128" class="male" text-anchor="start">• wnętrzowe / kontenerowe —</text>
<text x="536" y="149" class="male" text-anchor="start">  miasto, większe moce,</text>
<text x="536" y="170" class="male" text-anchor="start">• wieżowe (stare, ceglane).</text>
<text x="536" y="191" class="male" text-anchor="start"></text>
<text x="536" y="212" class="male" text-anchor="start">Wspólny uziom stacji:</text>
<text x="536" y="233" class="male" text-anchor="start">ochronny (SN) + roboczy (N nN),</text>
<text x="536" y="254" class="male" text-anchor="start">jeśli spełnione warunki</text>
<text x="536" y="275" class="male" text-anchor="start">napięć dotykowych (34.04).</text>
</svg>
