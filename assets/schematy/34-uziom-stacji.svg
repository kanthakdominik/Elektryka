<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">Uziom stacji SN</title>
  <desc id="d">Przekrój terenu wokół stacji SN z uziomem: przy zwarciu doziemnym prąd wpływa do uziomu i podnosi potencjał stacji i gruntu, tworząc lejek potencjału. Człowiek dotykający obudowy ma napięcie dotykowe, a idący obok — napięcie krokowe. Dopuszczalne napięcie dotykowe zależy od czasu trwania zwarcia według PN-EN 50522. Środki: mała rezystancja uziomu, otok wyrównujący potencjał, izolujące podłoże, szybkie zabezpieczenia; przy zerwanym przewodzie nie podchodzić.</desc>
  <defs>
    <pattern id="zz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1c40f"/><rect width="8" height="16" fill="#27ae60"/>
    </pattern>
    <pattern id="kresk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9ad9b" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
