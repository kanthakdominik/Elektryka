<rect x="20" y="345" width="800" height="110" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.4"/>
<text x="36" y="368" class="male" text-anchor="start">• Prąd zwarcia doziemnego wpływa do uziomu → podnosi potencjał stacji i gruntu (lejek potencjału).</text>
<text x="36" y="391" class="male" text-anchor="start">• Dopuszczalne napięcie dotykowe zależy od czasu zwarcia: im szybsze wyłączenie, tym wyższe (PN-EN 50522).</text>
<text x="36" y="414" class="male" text-anchor="start">• Środki: mała rezystancja uziomu, otok wyrównujący potencjał, izolujące podłoże (żwir, asfalt), szybkie zabezpieczenia.</text>
<text x="36" y="437" class="male" text-anchor="start">• Przy zerwanym przewodzie SN: nie podchodzić, drobne kroki, 991 / 112 (04.03, 31.01).</text>
</svg>
