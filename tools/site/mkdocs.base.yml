# Konfiguracja strony GitHub Pages. Menu (nav) dopisuje tools/build_site.py.
site_name: Elektryka — od podstaw do rozdzielnicy i uprawnień SEP
site_url: https://kanthakdominik.github.io/Elektryka/
site_description: Otwarta baza wiedzy z elektryki po polsku — instalacja w domu i przygotowanie do egzaminu SEP (G1, E, do 1 kV, z pomiarami)
repo_url: https://github.com/kanthakdominik/Elektryka
repo_name: kanthakdominik/Elektryka
edit_uri: ""
docs_dir: src
site_dir: public
copyright: Treść własna repozytorium — CC BY-SA 4.0; zdjęcia — licencje autorów (assets/CREDITS.md)

theme:
  name: material
  language: pl
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - sane_lists
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - javascripts/extra.css
